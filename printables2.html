<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brewhouses of the Hanse — Print &amp; Play · Cask Cards · v2.1.1 “Staple Rights”</title>
<style>
  :root{--ink:#2b2018;--ink2:#5b4a37;--parch:#f3e9d2;--parch2:#e9dcc0;--line:#333;--gold:#b8860b;
    --sea:#274b5c;--green:#4a6b3a;--red:#7c2128;--violet:#5b3a8e;--vp:#b8860b;}
  *{box-sizing:border-box}
  body{margin:0;background:#e7e2d6;color:var(--ink);font-family:"Iowan Old Style",Georgia,serif;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar{position:sticky;top:0;z-index:10;background:var(--ink);color:var(--parch);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .bar h1{font-size:1.05rem;margin:0;font-variant:small-caps;letter-spacing:.5px}
  .bar a{color:var(--gold);text-decoration:none;font-size:.85rem}
  .bar button{font-family:inherit;cursor:pointer;border:none;border-radius:6px;padding:6px 13px;font-weight:bold;background:var(--gold);color:var(--ink)}
  .bar .seg{display:inline-flex;border:1px solid var(--gold);border-radius:6px;overflow:hidden}
  .bar .seg button{border-radius:0;background:transparent;color:var(--parch);font-weight:normal}
  .bar .seg button.on{background:var(--gold);color:var(--ink)}
  .bar .bsub{font-weight:normal;font-size:.66rem;opacity:.55;font-variant:small-caps;letter-spacing:1.5px;margin-left:10px}
  .bar .bsel{font-family:inherit;font-size:.85rem;border-radius:6px;padding:5px 10px;border:1px solid var(--gold);background:var(--ink);color:var(--parch);cursor:pointer}
  .bar h1+.bsel{margin-left:auto}   /* push the controls to the right of the title */
  .note{font-size:.78rem;opacity:.85}
  /* ====== PAGE = US Letter LANDSCAPE (11×8.5in, .3in margins → 10.4×7.9in canvas) ====== */
  @media print{ @page{size:letter landscape;margin:.3in} @page large{size:22in 15in;margin:0} }
  .page{width:10.4in;height:7.9in;background:#fff;margin:14px auto;box-shadow:0 3px 14px rgba(0,0,0,.25);position:relative;overflow:hidden}
  /* LARGE-FORMAT tile sheets (laser cutter) — 22×15in; a named @page so they print full-bleed alongside the letter sheets */
  .page.lg{width:22in;height:15in;page:large}
  @media print{.no-print{display:none} body{background:#fff} .page{margin:0;box-shadow:none;break-after:page}
    body.solo .page{display:none} body.solo .page.soloed{display:block}}
  /* every printed piece sits in an absolutely positioned .it box (inches) — layout is identical in
     ART and CUT layers; the CUT layer only hides the art and reveals the cut strokes in the overlay svg */
  .it{position:absolute}
  body.cut .it{visibility:hidden}
  /* baseline inline-icon size — body-text icons track the local font; component CSS overrides with explicit sizes */
  .ic{width:1em;height:1em;vertical-align:-.13em}
  /* goods-icon colours: the pale palette is for dark tile faces; use the token colours on light text panels */
  .mbox .g,.pb-sub .g,.card .c-buy .g{color:#9c7414}
  .mbox .h,.pb-sub .h,.card .c-buy .h{color:#5d7d34}
  .ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
  .ov .cuts{display:none}
  body.cut .ov .cuts,body.both .ov .cuts{display:block}   /* CUT shows guides only (art hidden); BOTH overlays guides ON the art */
  /* card sheets are cut with a paper cutter, not the laser — their cut lines print WITH the art */
  .ov .cuts.always{display:block}
  .dl{position:absolute;top:.32in;right:.45in;z-index:6;display:flex;gap:4px}
  .dl button{font-size:.7rem;background:var(--sea);color:#fff;border:none;border-radius:4px;padding:2px 8px;cursor:pointer;font-family:inherit;opacity:.85}
  /* ====== TILES — 1.25in cut squares, gapless grid (a neighbour's colour is the bleed) ====== */
  .tile{width:1.25in;height:1.25in;background:var(--c,#777);color:#fff;
    position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:.096in;overflow:hidden;
    text-shadow:0 1px 1.5px rgba(0,0,0,.5)}
  /* SCALE-UP (printables2): keep the tuned 1.25in art; a top-left transform blows it up to the cut size,
     so every proportion is preserved. casks → 2.5in (×2), ships & buildings → 2.0in (×1.6); improvements stay 1.25in. */
  .tile.s2{transform:scale(2);transform-origin:top left}
  .tile.s16{transform:scale(1.6);transform-origin:top left}
  .tile .ic{width:1em;height:1em;vertical-align:-.15em} .tile svg{stroke-width:2}
  .q{position:absolute;top:.06in;left:.08in;display:flex;align-items:center;gap:.02in;font-weight:900;font-size:.34in;line-height:1}
  .q svg,.q .ic{width:.2in;height:.2in;stroke-width:2.2}
  .t-nm{position:absolute;top:.46in;left:.1in;max-width:1.05in;text-align:left;font-variant:small-caps;font-weight:bold;font-size:.155in;line-height:1.05}
  .t-act{font-size:.1in;line-height:1.12;background:rgba(0,0,0,.24);border-radius:.04in;padding:.025in .04in;margin-bottom:.03in;display:flex;align-items:center;gap:.03in}
  .t-act svg,.t-act .ic{width:.13in;height:.13in;flex:0 0 auto}
  .t-act .ac{display:inline-flex;align-items:center;justify-content:center;width:.22in;height:.22in;border-radius:50%;background:rgba(255,255,255,.92);flex:0 0 auto}
  .t-act .ac svg,.t-act .ac .ic{width:.12in;height:.12in;stroke-width:2.1;color:#23201c}
  .t-cost{font-size:.12in;font-weight:bold;display:flex;align-items:center;gap:.04in;line-height:1;flex-wrap:wrap}
  /* dual brew cost (the shared Q3 pool: Broyhan / Keut) — tightened so both costs sit on one line */
  .t-cost.dual{gap:.015in;font-size:.11in}
  .t-cost.dual .gc{gap:.008in;font-size:.11in} .t-cost.dual .gc svg,.t-cost.dual .gc .ic{width:.125in;height:.125in}
  .g{color:#ffe08a} .h{color:#c4e69c}
  .gc{display:inline-flex;align-items:center;gap:.02in;font-size:.12in;font-weight:bold}
  .gc svg,.gc .ic{width:.15in;height:.15in;flex:0 0 auto}
  .tile.gen{justify-content:flex-start;text-shadow:0 1px 1px rgba(0,0,0,.4)}
  .gen .g-head{display:flex;align-items:center;gap:.06in;font-variant:small-caps;font-weight:bold;font-size:.125in;line-height:1.02;min-width:0}
  .gen .g-head .bigic{flex:0 0 auto}
  .gen .g-head .bigic svg,.gen .g-head .bigic .ic{width:.27in;height:.27in;stroke-width:1.7}
  .gen .g-head .g-nm{min-width:0;overflow-wrap:break-word;hyphens:auto}
  .gen .g-sub{font-size:.108in;line-height:1.2;margin-top:.05in;opacity:.97}
  .gen .g-big{position:absolute;bottom:.072in;right:.096in;font-weight:900;font-size:.46in;line-height:.8;opacity:.92}
  .gen .g-cost{position:absolute;bottom:.078in;left:.096in}
  .gen.tn .g-head, .gen.tu .g-head{flex-direction:column;align-items:flex-end;text-align:right;gap:.05in}
  .gen.tn .g-sub{position:absolute;left:.096in;right:.096in;bottom:.084in;margin-top:0}
  .gen .g-act{background:rgba(0,0,0,.22);border-radius:.04in;padding:.04in .055in;font-size:.105in;line-height:1.16;margin-top:.06in;align-self:stretch}
  .gen.tg .g-head .bigic{position:absolute;right:.1in;bottom:.08in}
  .gen.tg .g-head .bigic svg,.gen.tg .g-head .bigic .ic{width:.34in;height:.34in;opacity:.9}
  /* ====== IMPROVEMENT CARD (v9) — half-height building card: 2in×1in, full-bleed interior art + green foot ====== */
  .icard{width:2in;height:1in;background:var(--c,#46663a);color:#fff;position:relative;overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;text-shadow:0 1px 1.5px rgba(0,0,0,.55)}
  .icard > *{position:relative;z-index:1}
  .icard > .artbg{z-index:0}
  .icard .ic-top{display:flex;align-items:center;gap:.05in;padding:.09in .12in 0}
  .icard .ic-ic{flex:0 0 auto} .icard .ic-ic svg,.icard .ic-ic .ic{width:.18in;height:.18in;stroke-width:1.8;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.6))}
  .icard .ic-nm{font-variant:small-caps;font-weight:bold;font-size:.145in;line-height:1.0;flex:1}
  .icard .ic-foot{background:linear-gradient(to top,var(--c) 0%,var(--c) 55%,transparent 100%);
    padding:.16in .12in .09in;display:flex;align-items:flex-end;gap:.06in}
  .icard .ic-act{font-size:.105in;line-height:1.12;flex:1}
  .icard .ic-act::first-letter{text-transform:uppercase}
  .icard .ic-act .ic,.icard .ic-act svg{width:.13in;height:.13in;vertical-align:-.02in}
  .icard .ic-act .g{color:#ffe08a} .icard .ic-act .h{color:#c4e69c}
  .icard .ic-cost{margin-left:auto;font-weight:bold;font-size:.145in;display:inline-flex;align-items:center;flex:0 0 auto}
  .icard .ic-cost .gc{gap:.02in} .icard .ic-cost .gc svg,.icard .ic-cost .gc .ic{width:.16in;height:.16in}
  /* ====== cask PERK strip (e.g. Keut +1 presence) — printed above the cost ====== */
  .t-perk{position:absolute;top:.06in;right:.08in;text-align:right;font-size:.082in;font-style:italic;line-height:1.08;opacity:.96}
  .t-perk b{font-size:.16in;font-weight:900;font-style:normal}
  .t-perk svg,.t-perk .ic{width:.16in;height:.16in;vertical-align:-.03in}
  /* (v5: the old 1.25″ .tile.bld / .tile.bback building-tile styles were retired — buildings are now .bcard cards, below) */
  /* ====== printables2: BUILDING CARDS (2″, double-sided) — FRONT full-bleed building art + effect ·
     BACK the generic Wild + developer ★ (displaced face). Nests in the 2.5″ player-colour owner FRAME
     (the coloured edge showing around it = whose building it is). Same art-card grammar as the casks/ships. ====== */
  .bcard{width:2in;height:2in;background:var(--c,#3a3342);color:#fff;position:relative;overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;text-shadow:0 1px 1.5px rgba(0,0,0,.55)}
  .bcard > *{position:relative;z-index:1}
  .bcard > .artbg{z-index:0}
  .bcard .bc-top{display:flex;align-items:flex-start;gap:.05in;padding:.15in .17in 0}
  .bcard .bc-ic{flex:0 0 auto} .bcard .bc-ic svg,.bcard .bc-ic .ic{width:.2in;height:.2in;stroke-width:1.8}
  /* WHARFAGE chip — icons+numbers only: what the OWNER banks when a RIVAL docks a cask/ship here (a rival → +N★) */
  .bcard .bc-wf{display:inline-flex;align-items:center;gap:.012in;flex:0 0 auto;font-weight:bold;font-size:.115in;line-height:1;
    background:rgba(0,0,0,.34);border-radius:.04in;padding:.022in .05in}
  .bcard .bc-wf svg,.bcard .bc-wf .ic{width:.13in;height:.13in;stroke-width:2}
  .bcard .bc-wf .st{color:#ffd24a}
  .bcard .bc-nm{font-variant:small-caps;font-weight:bold;font-size:.15in;line-height:1.02;flex:1;margin-top:-.01in}
  .bcard .bc-foot{background:linear-gradient(to top,var(--c) 0%,var(--c) 52%,transparent 100%);
    padding:.26in .17in .15in;display:flex;flex-direction:column;gap:.055in}
  .bcard .bc-eff{font-size:.115in;line-height:1.18}
  .bcard .bc-eff::first-letter{text-transform:uppercase}   /* sentence-case the effect (data stays lowercase) */
  /* resource icons inside effect text — colour by type (gold grain / green hops), notation: +1 [icon] */
  .bcard .bc-eff .ic,.bcard .bc-eff svg{width:.12in;height:.12in;vertical-align:-.02in}
  .bcard .bc-eff .g{color:#ffe08a} .bcard .bc-eff .h{color:#c4e69c}
  .bcard .bc-row{display:flex;align-items:center;gap:.05in}
  .bcard .bc-tgt{display:inline-flex;align-items:center;justify-content:center;width:.26in;height:.26in;border-radius:50%;background:rgba(255,255,255,.92);flex:0 0 auto}
  .bcard .bc-tgt svg,.bcard .bc-tgt .ic{width:.15in;height:.15in;color:#23201c;stroke-width:2}
  .bcard .bc-row .gc{margin-left:auto;font-size:.14in} .bcard .bc-row .gc svg,.bcard .bc-row .gc .ic{width:.15in;height:.15in}
  .bcard .bc-top svg,.bcard .bc-top .ic{filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.6))}
  /* BUILDING CARD BACK (v6) — the SAME building art + title as the front (muted), plus the Wild action + the
     developer ★. Reuses the front's bc-top/bc-foot layout so a flipped card still reads as its building. */
  .bcard.bc-bk .artbg{filter:grayscale(.55) brightness(.78)}
  .bcard .bc-wild{font-size:.1in;line-height:1.15;flex:1}
  .bcard .bc-sub{font-variant:small-caps;font-size:.092in;opacity:.85;letter-spacing:.3px}
  .bcard .bc-dev{margin-left:auto;font-weight:900;font-size:.2in;display:inline-flex;align-items:center;gap:.02in}
  .bcard .bc-dev svg,.bcard .bc-dev .ic{width:.2in;height:.2in;color:#ffd24a}
  /* ====== printables2: CASK CARDS (double-sided, 2×3) — FRONT buy/age (aging track) · BACK brewed (action) ====== */
  .ccard{width:2.5in;height:2.5in;background:var(--c,#777);color:#fff;position:relative;overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;text-shadow:0 1px 1.5px rgba(0,0,0,.5)}
  .ccard .ce{padding:.12in .17in;display:flex;flex-direction:column;gap:.035in;flex:0 0 auto}   /* content margin (the gradient/art are full-bleed on .ce/.artbg, so this insets text only) */
  .ccard .ce.bot{padding-top:.05in}
  .ccard .ce-row{display:flex;align-items:center;gap:.06in}
  .ccard .ce-row.sb{justify-content:space-between}
  .ccard .cq{display:inline-flex;align-items:center;gap:.02in;font-weight:900;font-size:.2in;line-height:1;flex:0 0 auto}
  .ccard .cq svg,.ccard .cq .ic{width:.17in;height:.17in;stroke-width:2.2}
  .ccard .cq.big{font-size:.4in} .ccard .cq.big svg,.ccard .cq.big .ic{width:.34in;height:.34in}   /* the front top-end quality, 2× */
  .ccard .cnm{font-variant:small-caps;font-weight:bold;font-size:.165in;line-height:1.02}
  .ccard .ccost{display:inline-flex;gap:.05in;font-weight:bold;font-size:.135in;align-items:center}
  .ccard .ccost .gc{gap:.02in} .ccard .ccost .gc svg,.ccard .ccost .gc .ic{width:.14in;height:.14in}
  .ccard .ctitle{display:flex;flex-direction:column;align-items:flex-end;gap:.02in;line-height:1.05;text-align:right}   /* title + cost stacked on the right, beside the big quality */
  .ccard .clbl{font-size:.085in;font-style:italic;opacity:.85}
  .ccard .cact{display:flex;align-items:center;gap:.05in;background:rgba(0,0,0,.3);border-radius:.05in;padding:.05in .06in;font-size:.155in;line-height:1.12}
  .ccard .cact .ac{display:inline-flex;align-items:center;justify-content:center;width:.27in;height:.27in;border-radius:50%;background:rgba(255,255,255,.92);flex:0 0 auto}
  .ccard .cact .ac svg,.ccard .cact .ac .ic{width:.15in;height:.15in;color:#23201c;stroke-width:2.1}
  .ccard .cc-mark{width:.3in;height:.3in;border:1.6px dashed rgba(255,255,255,.85);border-radius:.05in;flex:0 0 auto;margin-left:auto}
  /* aging track on the FRONT centre */
  /* FRONT centre = the maturation track on ONE line over a brewhouse-interior illustration (light parchment scrim keeps the ink legible) */
  .cc-age{margin:.04in .05in;color:#fff;border-radius:.07in;padding:.05in .05in;overflow:hidden;
    background:linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.4)),url('art/brewhouse.png');background-size:cover;background-position:center;
    display:flex;align-items:center;justify-content:center;flex:1}
  .cc-agerow{display:flex;gap:.07in;align-items:center;justify-content:center;flex-wrap:nowrap}
  .cc-step{width:.4in;height:.4in;border:1.9px solid rgba(255,255,255,.92);border-radius:.06in;display:flex;align-items:center;justify-content:center;font-size:.21in;font-weight:bold;color:#fff;background:transparent;text-shadow:0 1px 2px rgba(0,0,0,.75);flex:0 0 auto}
  .cc-step.rdy{border-color:var(--green);background:var(--green);color:#fff;text-shadow:none;box-shadow:0 1px 2px rgba(0,0,0,.4)}   /* READY = flip the card to its brewed side */
  .cc-step.rdy svg,.cc-step.rdy .ic{width:.26in;height:.26in;stroke-width:2.4}
  .cc-step.start{border-style:dashed}   /* place the vessel marker here at brew (the Brewhouse beaker) */
  .cc-step.start svg,.cc-step.start .ic{width:.25in;height:.25in;filter:drop-shadow(0 1px 2px rgba(0,0,0,.75))}
  /* BACK centre */
  .cc-big{flex:1;display:flex;align-items:center;justify-content:center;opacity:.32}
  .cc-big svg,.cc-big .ic{width:.85in;height:.85in}
  .cc-back .ce.bot{gap:.05in;padding-top:.34in;background:linear-gradient(to top,var(--c) 0%,var(--c) 38%,transparent 100%)}   /* the front's beer colour, solid at the foot, fading up into the illustration */
  .cc-back .ce.top{padding-bottom:.3in;background:linear-gradient(to bottom,var(--c) 0%,var(--c) 36%,transparent 100%)}   /* a matching colour gradient at the top, fading down into the illustration */
  .cc-actfloat{flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:0;transform:translateY(.13in)}   /* the action / berths float low over the illustration, dropped toward the colour foot */
  /* SHIP CARD (printables2 v4) — hull + cost over the art, gate + berths floating low, the kontor name in the colour foot */
  .ship-card .ce.top{background:none;padding-bottom:.08in}   /* ships keep a plain art top (no colour gradient — that's cask-back only) */
  .ship-card .ce.top .cnm{font-size:.22in;display:inline-flex;align-items:center;gap:.05in}
  .ship-card .ce.top .cnm svg,.ship-card .ce.top .cnm .ic{width:.26in;height:.26in}
  .ship-card .ccost{font-size:.17in}
  .ship-card .sberth{display:inline-flex;align-items:center;gap:.07in;background:rgba(0,0,0,.34);border-radius:.06in;padding:.055in .09in}
  .ship-card .sbn{width:.34in;height:.34in;border:1.8px solid rgba(255,255,255,.92);border-radius:.05in;display:flex;align-items:center;justify-content:center;font-size:.18in;font-weight:900}
  .ship-card .ce.bot .ce-row{align-items:flex-end}
  .ship-card .ce.bot .sdest{font-size:.22in;font-variant:small-caps;font-weight:bold;display:inline-flex;align-items:center;gap:.06in}
  .ship-card .ce.bot .sdest svg,.ship-card .ce.bot .sdest .ic{width:.2in;height:.2in}
  .ship-card .ce.bot .sgate{font-weight:900;font-size:.2in;display:inline-flex;align-items:center;gap:.02in}
  .ship-card .ce.bot .sgate svg,.ship-card .ce.bot .sgate .ic{width:.19in;height:.19in}
  /* the BACK ends match (Q + title + a marker space), a little larger */
  .cc-back .ce .cq{font-size:.24in} .cc-back .ce .cq svg,.cc-back .ce .cq .ic{width:.2in;height:.2in}
  .cc-back .ce .cnm{font-size:.19in}
  .cc-back .ce.top .cnm{font-size:.225in}   /* the back's top title a touch larger */
  .cc-back .ce.top .cq{font-size:.44in}   /* big quality + beer icon on the left of the back's top */
  .cc-back .ce.top .cq svg,.cc-back .ce.top .cq .ic{width:.38in;height:.38in}
  /* ===== background ART slot (printables2): a layer behind the card/tile content. Placeholder = a faint hatch;
     when ART_ON, it carries the generated image (art/cask-<beer>.png · art/ship-<hull>.png) with a scrim for legibility. ===== */
  .ccard > *{position:relative;z-index:1}
  .ccard > .artbg{z-index:0}
  .tile.ts > *{position:relative;z-index:1}
  .tile.ts > .artbg{z-index:0}
  .artbg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;background-repeat:no-repeat}
  .artbg>img.artbg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
  .artbg.ph{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 .09in,rgba(255,255,255,0) .09in .18in)}
  .artbg.scrim::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.12) 28%,rgba(0,0,0,.12) 72%,rgba(0,0,0,.55))}
  .artbg.baked::after{content:none}   /* PNG export: scrim is baked into the art <canvas> (see bakeArt) — drop the live pseudo */
  .cc-back.baked-fg .ce.top,.cc-back.baked-fg .ce.bot{background:none}   /* PNG export: the colour foot is baked into the art <canvas> too */
  /* keep the white end-icons legible over busy art */
  .ccard .cq svg,.ccard .cq .ic,.ccard .ccost svg,.ccard .ccost .ic,.tile.ts .g-head svg,.tile.ts .g-head .ic,.tile.ts .berths svg,.tile.ts .berths .ic{filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.6))}
  /* ship NUMBERED BERTHS — pinned to the BOTTOM with the quality gate */
  .ts .berths{display:flex;align-items:center;justify-content:center;gap:.04in}
  .ts .berths .bn{width:.235in;height:.235in;border:1.3px solid rgba(255,255,255,.9);border-radius:.03in;
    display:flex;align-items:center;justify-content:center;font-size:.13in;font-weight:900;background:rgba(0,0,0,.22);text-shadow:none}
  .ts .berths .sgate{font-weight:900;font-size:.15in;display:inline-flex;align-items:center;gap:.015in;margin-right:.04in}
  .ts .berths .sgate svg,.ts .berths .sgate .ic{width:.17in;height:.17in}
  /* ship = NEUTRAL hull body; destination is a coloured chip, CENTERED in the middle of the tile */
  .ts .g-dest-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
  .ts .g-dest{display:inline-flex;align-items:center;gap:.04in;color:#fff;font-variant:small-caps;font-weight:bold;font-size:.125in;border-radius:.04in;padding:.025in .08in;text-shadow:0 1px 1px rgba(0,0,0,.45)}
  .ts .g-dest svg,.ts .g-dest .ic{width:.15in;height:.15in}
  .ts .t-cost-tr{position:absolute;top:.08in;right:.09in;font-weight:bold}
  .ts .t-cost-tr .gc{font-size:.12in;gap:.02in} .ts .t-cost-tr .gc svg,.ts .t-cost-tr .gc .ic{width:.15in;height:.15in}
  /* ====== goods TOKENS — laser-cut .7in circle inside a .95in bleed disc ====== */
  .tok{width:.95in;height:.95in;border-radius:50%;background:var(--c);color:#fff;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.1in;text-shadow:0 1px 1px rgba(0,0,0,.4)}
  .tok::after{content:"";position:absolute;inset:.125in;border:.8pt solid rgba(255,255,255,.75);border-radius:50%}
  .tok svg{width:.26in;height:.26in}
  /* ownership DISCS — .5in cut circle inside a .65in bleed disc */
  .disc{width:.65in;height:.65in;border-radius:50%;background:var(--c);color:#fff;position:relative;
    display:flex;align-items:center;justify-content:center}
  .disc::after{content:"";position:absolute;inset:.075in;border:.6pt solid rgba(255,255,255,.7);border-radius:50%}
  .disc svg{width:.2in;height:.2in}
  /* BUILDING OWNERSHIP FRAMES (printables2) — a player-colour 2.5in base the 2in Building tile sits on; the
     colour border showing around the smaller tile = whose building it is. Sized to drop into a 2.5in wharf slot. */
  .frame{width:2.5in;height:2.5in;background:var(--c);border-radius:.12in;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .frame::after{content:"";position:absolute;inset:.25in;border:2px dashed rgba(255,255,255,.85);border-radius:.07in}
  .frame .fl{position:absolute;left:0;right:0;bottom:.07in;text-align:center;color:#fff;font-variant:small-caps;font-weight:bold;font-size:.12in;text-shadow:0 1px 1.5px rgba(0,0,0,.5)}
  /* worker / marker DISCS — .8in cut circle inside a 1in bleed disc */
  .wtok{width:1in;height:1in;border-radius:50%;background:var(--c);color:#fff;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.02in;font-size:.085in;font-variant:small-caps;font-weight:bold;text-align:center;line-height:1;text-shadow:0 1px 1px rgba(0,0,0,.4)}
  .wtok::after{content:"";position:absolute;inset:.1in;border:.8pt solid rgba(255,255,255,.75);border-radius:50%}
  .wtok svg{width:.3in;height:.3in}
  /* ====== RECIPE CARDS — 1.85×2.55in, square corners, gapless grid ====== */
  .card{width:1.85in;height:2.55in;background:#f7efdc;color:var(--ink);
    position:relative;padding:0;display:flex;flex-direction:column;overflow:hidden}
  .card .c-reach{padding:.07in .14in 0;font-size:.092in;font-style:italic;color:var(--ink2);text-align:center;line-height:1.15}
  .card .c-buy{flex:1;margin:.06in .14in;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.04in;
    background:rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.14);border-radius:.06in;padding:.06in .1in;
    font-size:.1in;line-height:1.2;text-align:center}
  .card .c-buy .lbl{font-variant:small-caps;font-weight:bold;color:var(--ink2)}
  .card .c-buy .gc{font-size:.14in} .card .c-buy .gc svg,.card .c-buy .gc .ic{width:.17in;height:.17in}
  .card .c-buy .gate{font-size:.09in;font-style:italic;color:var(--red);display:flex;align-items:center;gap:.03in}
  .card .c-buy .gate svg,.card .c-buy .gate .ic{width:.12in;height:.12in}
  /* title + BREW-cost strip — the visible edge when the card is tucked up under the board.
     FIXED two-row layout (rung+name / cost) so every card's bottom edge reads identically. */
  .card .c-strip{flex:0 0 .56in;background:var(--cc,#8a6408);color:#fff;display:flex;flex-direction:column;justify-content:center;gap:.035in;
    padding:.05in .12in;text-shadow:0 1px 1.5px rgba(0,0,0,.45)}
  .card .c-strip .c-row{display:flex;align-items:center;gap:.06in;line-height:1;white-space:nowrap}
  .card .c-strip svg,.card .c-strip .ic{width:.14in;height:.14in;flex:0 0 auto}
  .card .c-strip .c-rung{flex:0 0 auto;display:inline-flex;align-items:center;gap:.015in;
    background:rgba(255,255,255,.92);color:var(--cc);border-radius:.04in;padding:.025in .05in;font-size:.115in;font-weight:bold;text-shadow:none}
  .card .c-strip .c-rung svg,.card .c-strip .c-rung .ic{width:.13in;height:.13in}
  .card .c-strip .c-nm{font-variant:small-caps;font-weight:bold;font-size:.16in}
  .card .c-strip .c-cost{display:inline-flex;align-items:center;gap:.06in;font-weight:bold;font-size:.13in}
  .card .c-strip .c-cost .gc{font-size:.13in;gap:.015in}
  .card .c-strip .c-cost .gc svg,.card .c-strip .c-cost .gc .ic{width:.13in;height:.13in}
  .card .c-strip .c-lbl{font-size:.085in;font-style:italic;opacity:.85}
  .card .c-strip .c-gate{display:inline-flex;align-items:center;gap:.02in;font-size:.085in;font-style:italic}
  .card .c-strip .c-gate svg,.card .c-strip .c-gate .ic{width:.12in;height:.12in}
  /* ====================== PLAYER AID CARD (double-sided: A = a turn · B = icon reference) ======================
     Two sheets (FRONT / BACK). Every card on a sheet is IDENTICAL, on a centred & symmetric 2×2 grid, so the
     outlines register under EITHER duplex flip edge — "front aligns with back" holds regardless of the printer.
     (Flip on the SHORT edge keeps the back upright.) 4.7×3.4in card. */
  .aid{width:100%;height:100%;background:#f7efdc;color:var(--ink);border:1.4px solid var(--ink);border-radius:.07in;
    padding:.09in .11in;display:flex;flex-direction:column;overflow:hidden;font-size:.088in;line-height:1.16}
  .aid .ic,.aid svg{width:.1in;height:.1in;vertical-align:-.015in;flex:0 0 auto}
  .aid .gi{color:#9c7414} .aid .hi{color:#5d7d34} .aid .vi{color:var(--gold)}
  .aid b{color:var(--ink)} .aid .em{color:var(--red);font-weight:bold;font-variant:small-caps}
  .aid .ahd{display:flex;align-items:center;gap:.07in;border-bottom:2px solid var(--gold);padding-bottom:.035in;margin-bottom:.05in;flex:0 0 auto}
  .aid .ahd .abi{width:.36in;height:.36in;border-radius:.05in;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .aid .ahd .abi svg,.aid .ahd .abi .ic{width:.24in;height:.24in}
  .aid .ahd .at{font-variant:small-caps;font-weight:bold;color:var(--red);font-size:.155in;line-height:1}
  .aid .ahd .as{font-size:.076in;font-style:italic;color:var(--ink2);margin-left:auto;text-align:right;line-height:1.1}
  .aid .acols{flex:1;display:flex;gap:.14in;min-height:0}
  .aid .acol{flex:1;display:flex;flex-direction:column;min-width:0}
  .aid h5{font-variant:small-caps;font-weight:bold;color:var(--sea);font-size:.1in;margin:.05in 0 .02in;
    border-bottom:1px solid var(--line);padding-bottom:.008in;display:flex;align-items:center;gap:.04in}
  .aid h5:first-child{margin-top:0}
  .aid h5 svg,.aid h5 .ic{width:.12in;height:.12in}
  .aid .step{display:flex;gap:.05in;margin-bottom:.03in}
  .aid .step .sn{flex:0 0 auto;width:.17in;height:.17in;border-radius:50%;background:var(--sea);color:#fff;font-size:.09in;font-weight:bold;display:flex;align-items:center;justify-content:center}
  .aid .step .sx,.aid .ln{min-width:0}
  .aid .ln{margin-bottom:.025in}
  /* legend grid (back) */
  .aid .leg{display:flex;flex-direction:column}
  .aid .lr{display:flex;align-items:flex-start;gap:.05in;margin-bottom:.022in}
  .aid .lr .lic{flex:0 0 .2in;height:.15in;display:flex;align-items:center;justify-content:center;color:var(--sea)}
  .aid .lr .lic svg,.aid .lr .lic .ic{width:.15in;height:.15in}
  .aid .lr .lx{min-width:0} .aid .lr .lx b{font-variant:small-caps}
  /* ====================== PLAYER BOARD (v1.6 — rebuilt from scratch) ======================
     A pure TRACKING surface — vessels & maturation (THE FLOOR row) · improvements · THE FLIGHT ·
     a goods zone · a bottom RECIPE RACK. No rules text (those live on the separate player-aid card).
     Tile-true: vessel & improvement spaces are 1.25in squares; recipe-rack strips are 1.85in (card width). */
  .board{--pc:#7c2128;width:100%;height:100%;background:var(--parch);color:var(--ink);border:2.5px solid var(--pc);
    border-radius:.12in;padding:.16in;display:flex;flex-direction:column;gap:.13in}
  .board svg,.board .ic{stroke-width:1.8}
  /* --- header: crest · house name · storage zone --- */
  .pb-head{display:flex;align-items:stretch;gap:.16in;flex:0 0 auto}
  .crest{width:.82in;flex:0 0 auto;border-radius:.08in;background:var(--pc);color:#fff;display:flex;align-items:center;justify-content:center}
  .crest svg,.crest .ic{width:.5in;height:.5in}
  .pb-title{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0}
  .pb-name{font-variant:small-caps;font-weight:bold;font-size:.3in;color:var(--pc);line-height:1}
  .pb-sub{font-size:.1in;color:var(--ink2);font-style:italic;margin-top:.03in}
  .pb-store{flex:0 0 auto;display:flex;flex-direction:column;gap:.04in;justify-content:center}
  .pb-store .slbl{font-variant:small-caps;font-weight:bold;font-size:.11in;color:var(--pc);display:flex;align-items:center;gap:.04in}
  .pb-store .slbl svg,.pb-store .slbl .ic{width:.14in;height:.14in}
  .szone{width:3.5in;height:.8in;border:1.6px solid var(--pc);border-radius:.07in;background:rgba(255,255,255,.45);
    display:flex;align-items:center;justify-content:center;gap:.14in;color:var(--pc)}
  .szone .si{display:inline-flex;align-items:center;gap:.04in;font-variant:small-caps;font-weight:bold;font-size:.135in}
  .szone .si svg,.szone .si .ic{width:.22in;height:.22in}
  .szone .cap{display:inline-flex;align-items:baseline;gap:.03in;font-size:.1in;font-style:italic;color:var(--ink2)}
  .szone .cap b{font-size:.17in;font-style:normal;font-weight:900;color:var(--pc)}
  /* --- section header (a zone label — a noun, never a rule) --- */
  .pb-sect{font-variant:small-caps;font-weight:bold;font-size:.125in;color:var(--pc);display:flex;align-items:center;gap:.05in;
    border-bottom:1px solid var(--pc);padding-bottom:.015in;margin-bottom:.05in}
  .pb-sect svg,.pb-sect .ic{width:.15in;height:.15in}
  .pb-sect .sm{font-variant:normal;font-weight:normal;font-style:italic;font-size:.088in;color:var(--ink2);margin-left:auto}
  /* --- THE FLOOR: ONE line of 3 vessels + 4 improvement slots; maturation tracks under the vessels --- */
  .floor{flex:0 0 auto}
  .floor-row{display:flex;align-items:flex-start;gap:.14in}
  .fgrp{display:flex;flex-direction:column}
  .grp-lbl{font-variant:small-caps;font-weight:bold;font-size:.1in;color:var(--pc);display:flex;align-items:center;gap:.04in;margin-bottom:.05in}
  .grp-lbl svg,.grp-lbl .ic{width:.13in;height:.13in}
  .grp-lbl .nn{font-variant:normal;font-weight:normal;font-style:italic;opacity:.8;margin-left:.05in}
  .vgroup,.igroup{display:flex;gap:.1in}
  .vcol{display:flex;flex-direction:column;align-items:center;width:1.25in}
  .vsq{width:1.25in;height:1.25in;border:1.6px solid var(--pc);border-radius:.06in;background:rgba(255,255,255,.5);position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--pc);font-size:.092in;text-align:center;gap:.02in}
  .vsq svg,.vsq .ic{width:.32in;height:.32in;opacity:.42}
  .vsq .vn{position:absolute;top:.05in;left:.07in;font-variant:small-caps;font-weight:bold;font-size:.092in;opacity:.7}
  /* forward-flow arrow between the vessel square and its maturation track (you move RIGHT to Ready) */
  .vflow{width:1.25in;height:.14in;display:flex;align-items:center;justify-content:center;color:var(--pc)}
  .vflow svg,.vflow .ic{width:.17in;height:.13in;stroke-width:2.4}
  /* maturation track: a beer STARTS on the space bearing its name, then advances RIGHT to READY (the last space) */
  .mtrack{display:flex;border:1.3px solid var(--pc);border-radius:.04in;overflow:hidden;width:1.25in}
  .mtrack .ms{flex:1;height:.52in;border-right:1px solid rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.014in;padding:.012in;background:rgba(255,255,255,.5);text-align:center}
  .mtrack .ms:last-child{border-right:none}
  .mtrack .ms .bn{font-variant:small-caps;font-weight:bold;font-size:.057in;line-height:1.05;color:var(--ink)}
  .mtrack .ms.fin{background:rgba(74,107,58,.24)}
  .mtrack .ms.fin .rdy{font-variant:small-caps;font-weight:900;font-size:.086in;color:var(--pc);line-height:1}
  .mtrack .ms.fin .rsub{font-variant:small-caps;font-size:.054in;color:var(--pc);opacity:.85;line-height:1}
  /* V3 (Extra Vessel) is identical to V1/V2 — ONLY its tile outline is dashed */
  .vcol.locked .vsq{border-style:dashed}
  /* improvement slots — host bought improvements (violet) AND displaced/flipped Buildings; tile-true 1.25in squares */
  .isq{width:1.25in;height:1.25in;border:1.5px dashed var(--violet);border-radius:.06in;background:rgba(91,58,142,.07);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.04in;color:var(--violet);font-size:.088in;text-align:center}
  .isq svg,.isq .ic{width:.3in;height:.3in;opacity:.6}
  /* --- THE FLIGHT: one space per beer type; mark each beer you deliver --- */
  .flight{flex:0 0 auto}
  .flight-row{display:flex;gap:.08in}
  .fbeer{flex:1;border:1.4px solid var(--pc);border-radius:.06in;background:rgba(255,255,255,.45);
    display:flex;align-items:center;gap:.07in;padding:.05in .08in}
  .fbeer.exp{border-style:dashed}
  .fdot{width:.4in;height:.4in;flex:0 0 auto;border-radius:50%;border:1.4px solid var(--pc);background:rgba(0,0,0,.03)}
  .fbeer.exp .fdot{border-style:dashed}
  .fmeta{display:flex;flex-direction:column;line-height:1.08;min-width:0}
  .fmeta .fn{font-variant:small-caps;font-weight:bold;font-size:.1in;color:var(--ink)}
  .fmeta .fq{font-size:.078in;color:var(--ink2)}
  /* --- RECIPE RACK: bottom edge — slide export recipe cards up; the exposed strip = the card's brew face.
     Gruit & Hopped are printed here as clones of a recipe card's bottom c-strip. --- */
  .rack{margin:auto -.16in -.16in;padding:.06in .12in 0;border-top:1.6px dashed var(--pc);
    background:repeating-linear-gradient(90deg,rgba(0,0,0,.025) 0 1.85in,transparent 1.85in 3.7in)}
  .rack-h{font-variant:small-caps;font-weight:bold;font-size:.105in;color:var(--pc);display:flex;align-items:center;gap:.05in;margin-bottom:.05in}
  .rack-h svg,.rack-h .ic{width:.13in;height:.13in} .rack-h .sm{font-variant:normal;font-weight:normal;font-style:italic;font-size:.085in;color:var(--ink2);margin-left:auto}
  .rack-row{display:flex;gap:.04in;justify-content:center}
  .rk{width:1.85in;height:.56in;flex:0 0 auto;border-radius:.05in .05in 0 0;border:1.3px solid var(--pc);border-bottom:none;overflow:hidden}
  .rk.tuck{border-style:dashed;background:rgba(255,255,255,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.02in;color:var(--pc);font-size:.092in;text-align:center}
  .rk.tuck svg,.rk.tuck .ic{width:.15in;height:.15in;opacity:.55}
  .rk.printed{background:var(--cc);color:#fff;display:flex;flex-direction:column;justify-content:center;gap:.04in;padding:.05in .12in;text-shadow:0 1px 1.5px rgba(0,0,0,.45)}
  .rk.printed .c-row{display:flex;align-items:center;gap:.06in;line-height:1;white-space:nowrap}
  .rk.printed svg,.rk.printed .ic{width:.14in;height:.14in;flex:0 0 auto}
  .rk.printed .c-rung{display:inline-flex;align-items:center;gap:.015in;background:rgba(255,255,255,.92);color:var(--cc);
    border-radius:.04in;padding:.025in .05in;font-size:.115in;font-weight:bold;text-shadow:none}
  .rk.printed .c-rung svg,.rk.printed .c-rung .ic{width:.13in;height:.13in}
  .rk.printed .c-nm{font-variant:small-caps;font-weight:bold;font-size:.16in}
  .rk.printed .c-lbl{font-size:.085in;font-style:italic;opacity:.85}
  .rk.printed .c-cost{display:inline-flex;align-items:center;gap:.06in;font-weight:bold;font-size:.13in}
  .rk.printed .c-cost .gc{font-size:.13in;gap:.02in}
  .rk.printed .c-cost .gc svg,.rk.printed .c-cost .gc .ic{width:.13in;height:.13in}
  /* ====================== PLAYER BOARD v3 (component-driven · tight die-cut · chrome-stripped) ==========
     A bench sized to the TILES, not the page: 4 building/improvement slots (2in) + a compact Flight strip on
     top; ONE recipe-stack slot + 3 cask-vessel slots (2.46in, hold the 2.5in cask cards) on the bottom. No
     header/storage block, no rules text — just the slots. The die-cut hugs the cluster (see the call site). */
  .pb2{--pc:#7c2128;width:100%;height:100%;background:var(--parch);color:var(--ink);
    border:3px solid var(--pc);border-radius:.18in;padding:.13in;display:flex;flex-direction:column;gap:.1in;
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45)}
  .pb2 svg,.pb2 .ic{stroke-width:1.8}
  /* identity — a small colour crest + house name + a tiny goods-cap reminder (no storage block) */
  .pb2-id{display:flex;align-items:center;gap:.08in;flex:0 0 auto;padding:0 .02in}
  .pb2-crest{width:.32in;height:.32in;border-radius:.05in;background:var(--pc);color:#fff;display:flex;align-items:center;justify-content:center}
  .pb2-crest svg,.pb2-crest .ic{width:.2in;height:.2in}
  .pb2-name{font-variant:small-caps;font-weight:bold;font-size:.18in;color:var(--pc);line-height:1}
  .pb2-goods{margin-left:auto;display:inline-flex;align-items:center;gap:.04in;font-variant:small-caps;font-size:.092in;color:var(--ink2)}
  .pb2-goods svg,.pb2-goods .ic{width:.12in;height:.12in} .pb2-goods b{color:var(--pc);font-size:.105in}
  /* rows */
  .pb2-top,.pb2-bot{display:flex;align-items:stretch;flex:0 0 auto}
  .pb2-top{gap:.1in} .pb2-bot{gap:.1in}
  .pb2-blds{display:flex;gap:.1in;flex:0 0 auto}
  .pb2-vessels{display:flex;gap:.06in;flex:0 0 auto}
  .pb2-slot{position:relative;border:1.6px dashed var(--pc);border-radius:.06in;background:rgba(255,255,255,.35);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.04in;color:var(--pc);text-align:center}
  .pb2-slot .sn{position:absolute;top:.05in;left:0;right:0;font-variant:small-caps;font-weight:bold;font-size:.08in;opacity:.62;line-height:1.05}
  .pb2-slot .si{display:flex;gap:.06in;opacity:.4} .pb2-slot .si svg,.pb2-slot .si .ic{width:.32in;height:.32in}
  .pb2-bld{width:2in;height:2in}
  .pb2-vsl{width:2.46in;height:2.46in;border-style:solid}
  .pb2-vsl.extra{border-style:dashed}
  .pb2-vsl .si svg,.pb2-vsl .si .ic{width:.46in;height:.46in}
  /* flight — a compact tally column, top-right */
  .pb2-flight{flex:1 1 auto;min-width:.95in;display:flex;flex-direction:column;gap:.03in;border:1.6px solid var(--pc);border-radius:.06in;background:rgba(255,255,255,.4);padding:.05in .06in}
  .pb2-flight .fh{font-variant:small-caps;font-weight:bold;font-size:.1in;color:var(--pc);text-align:center;display:flex;align-items:center;justify-content:center;gap:.03in}
  .pb2-flight .fh svg,.pb2-flight .fh .ic{width:.12in;height:.12in}
  .pb2-flight .fsub{font-size:.068in;font-style:italic;color:var(--ink2);text-align:center}
  .pb2-fboxes{flex:1;display:flex;flex-direction:column;gap:.04in}
  .pb2-fbox{flex:1;border:1.2px solid var(--pc);border-radius:.035in;background:rgba(255,255,255,.5);
    display:flex;align-items:center;justify-content:space-between;padding:0 .07in}
  .pb2-fbox .fn{font-weight:900;font-size:.12in;color:var(--pc)}
  .pb2-fbox .fp{display:inline-flex;align-items:center;gap:.015in;font-weight:900;font-size:.105in;color:var(--vp)}
  .pb2-fbox .fp svg,.pb2-fbox .fp .ic{width:.12in;height:.12in}
  .pb2-fbox.z{opacity:.5} .pb2-fbox.z .fp{color:var(--ink2);font-weight:normal}
  /* recipe — ONE slot: cards STACK here (cards are made to stack). Gruit/Hopped printed at the base. */
  .pb2-recipe{width:1.78in;flex:0 0 auto;display:flex;flex-direction:column;gap:.05in;border:1.6px dashed var(--pc);border-radius:.06in;background:rgba(255,255,255,.35);padding:.06in}
  .pb2-recipe .rh{font-variant:small-caps;font-weight:bold;font-size:.095in;color:var(--pc);display:flex;align-items:center;gap:.03in}
  .pb2-recipe .rh svg,.pb2-recipe .rh .ic{width:.11in;height:.11in}
  .pb2-rstack{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.03in;color:var(--pc);font-size:.078in;opacity:.6;

let MODE='full', VIEW='all', LAYER='art';
const cnt=n=>MODE==='proof'?1:n;
function setMode(m){MODE=m;document.getElementById('bproof').classList.toggle('on',m==='proof');document.getElementById('bfull').classList.toggle('on',m==='full');render();}
function setView(v){VIEW=v;const sel=document.getElementById('vsel');if(sel&&sel.value!==v)sel.value=v;render();}
function setLayer(l){LAYER=l;['art','cut','both'].forEach(x=>document.getElementById('l'+x).classList.toggle('on',l===x));
  document.body.classList.toggle('cut',l==='cut');document.body.classList.toggle('both',l==='both');}   // pure CSS — layout never changes between layers

//==================================================================
// ART — piece face generators (the scrutinized tile/card/board art)
//==================================================================
function caskTile(d,act){   // act = the drawn slot-action {ai,act} (v0.12); Gruit passes its pinned Source
  let c=cost(d.g,d.h); if(d.alt)c+='<span style="opacity:.85">/</span>'+cost(d.alt[0],d.alt[1]);
  return '<div class="tile s2" style="--c:'+d.c+'">'   /* printables2: cask → 2.5in */
  +'<div class="q">'+LU(QI)+d.q+'</div>'
  +'<div class="t-nm">'+d.nm+'</div>'
  +'<div class="t-act"><span class="ac">'+LU(act.ai)+'</span><span>'+act.act+'</span></div>'
  +(d.tag?'<div class="t-perk">'+d.tag+'</div>':'')
  +'<div class="t-cost'+(d.alt?' dual':'')+'">'+c+'</div></div>';}
// BUILDING tile (v1.0 keystone) — an OWNED slot modifier: icon + name + verb badge (VALUE/TRANSFORM) +
// the effect + a target glyph (what it modifies: cask/ship/line/owner) + the goods cost. Value = violet, Transform = green.
// BUILDING CARD (printables2 v5) — buildings migrate from flat tiles to 2″ double-sided ART CARDS (same grammar
// as the cask/ship cards). FRONT = full-bleed building art (art/building-<key>.png) behind a scrim, with the name
// + verb badge (Value/Transform) up top and the effect + target glyph + goods cost in a colour foot. The card
// nests in the 2.5″ player-colour owner FRAME, so the coloured edge around it marks ownership.
const BLD_FOOT='rgba(58,51,66,.7)';   // building card foot/base — dark purple-grey (#3a3342) at 70% opacity so the illustration bleeds ~30% through the foot. Same on front & back.
function buildingCard(d){const tg=BTGT[d.tgt];
  // wharfage chip (icons+numbers only) — what YOU bank when a RIVAL docks a cask/ship here; only for dockable
  // buildings (cask/ship targets — the owner-passive Almoner & any line tiles have no occupant to toll).
  const wf=(d.tgt==='cask'||d.tgt==='ship')
    ? '<span class="bc-wf" title="when a rival docks a cask/ship here, you (owner) bank this wharfage on its delivery">'+LU('users-round')+'+'+WHARFAGE+LU('star','st')+'</span>' : '';
  return '<div class="bcard" style="--c:'+BLD_FOOT+'">'
  +artLayer('building-'+d.k+'.png')
  +'<div class="bc-top"><span class="bc-ic">'+LU(d.ic)+'</span><span class="bc-nm">'+d.nm+'</span></div>'
  +'<div class="bc-foot"><div class="bc-eff">'+d.eff+'</div>'
    +'<div class="bc-row"><span class="bc-tgt" title="'+tg.lbl+'">'+LU(tg.ic)+'</span>'+wf+cost(d.g,0)+'</div></div>'
  +'</div>';}
// BUILDING CARD BACK (v6) — the flipped/displaced face: when a RIVAL overbuilds your Building it returns to you
// flipped to its WILD side and parks in an improvement slot (scores +DEVELOP_PTS★ at game end). v6: shows the
// SAME building art + title (muted) so it's identifiable, with the Wild action + the developer ★ in the foot.
function buildingBack(d){
  return '<div class="bcard bc-bk" style="--c:'+BLD_FOOT+'">'
  +artLayer('building-'+d.k+'.png')
  +'<div class="bc-top"><span class="bc-ic">'+LU(d.ic)+'</span><span class="bc-nm">'+d.nm+'</span></div>'
  +'<div class="bc-foot">'
    +'<div class="bc-row"><span class="bc-tgt">'+LU('sparkles')+'</span><span class="bc-wild">a <b>Wild</b> action on your Floor</span></div>'
    +'<div class="bc-row"><span class="bc-sub">displaced<br>Building</span><span class="bc-dev">+'+DEVELOP_PTS+LU('star')+'</span></div>'
  +'</div></div>';}
// NEUTRAL destination-bound ship tile (v0.11): hull + capacity · printed destination + quality gate · commission 2 G
function shipTile(hull,destNm){const cap=HULL[hull].cap;const d=SHIP_DEST[destNm];
  let berths='';for(let i=1;i<=cap;i++)berths+='<div class="bn">'+i+'</div>';   // numbered load-order berths (v0.16)
  return '<div class="tile gen ts s2" style="--c:#6f6253">'   // NEUTRAL hull body; printables2: ship → 2.5in (matches casks & slots)
  +artLayer('ship-'+hull+'.png')
  +'<div class="t-cost-tr">'+cost(2,0)+'</div>'            // commission cost, top-right (no market icon)
  +'<div class="g-head"><span class="bigic">'+LU('sailboat')+'</span><span class="g-nm">'+(hull==='cog'?'Cog':'Hulk')+'</span></div>'
  +'<div class="g-dest-wrap"><div class="g-dest" style="background:'+d.kc+'">'+LU('landmark')+destNm+'</div></div>'
  +'<div class="berths"><span class="sgate">'+LU(QI)+d.req+'+</span>'+berths+'</div></div>';}
function genTile(it,fcls){return '<div class="tile gen '+(fcls||'')+'" style="--c:'+it.c+'">'
  +'<div class="g-head"><span class="bigic">'+LU(it.ic)+'</span><span class="g-nm">'+it.nm+'</span></div>'
  +(it.act?'<div class="g-act">'+it.act+'</div>':'')
  +(it.sub?'<div class="g-sub">'+it.sub+'</div>':'')
  +(it.big?'<div class="g-big">'+it.big+'</div>':'')
  +(it.g?'<div class="g-cost">'+cost(it.g,it.h)+'</div>':'')+'</div>';}
// IMPROVEMENT tile (private upgrade) — icon + cost share a top row, then name, then a short effect box.
// (Dedicated layout so the cost never collides with a wrapping effect — the old genTile 'tu' did.)
// IMPROVEMENT CARD (v9) — a HALF-HEIGHT building card: full-bleed INTERIOR art (improve-<slug>.png) + scrim, the
// name/icon on top, and a GREEN foot bar carrying the effect + cost. Same art-card grammar as the casks/ships/
// buildings. Card bg = the same green as the foot, so any html2canvas foot-edge hairline is green-on-green.
const IMP_FOOT='#46663a';   // improvement foot/base — green (the Cellar, where improvements are bought)
function improveTile(d){const k=slug(d.nm);
  return '<div class="icard" style="--c:'+IMP_FOOT+'">'
  +artLayer('improve-'+k+'.png')
  +'<div class="ic-top"><span class="ic-ic">'+LU(d.ic)+'</span><span class="ic-nm">'+d.nm+'</span></div>'
  +'<div class="ic-foot"><span class="ic-act">'+d.act+'</span><span class="ic-cost">'+cost(d.g,d.h)+'</span></div>'
  +'</div>';}
// printables2 v3: a CASK is a double-sided CARD (2×3). FRONT = the buy/age side: Q+name on the top end, brew
// cost under it, the AGING TRACK in the centre (the card carries its own step count — so the player-board
// maturation track + cellar markers come off the board), and Q+action on the bottom end. BACK = the brewed
// side: Q+name + a die/presence space on the top end, the action just above the bottom end, Q on the bottom.
// (act = the drawn slot-action {ai,act}; Gruit passes its pinned Source — the printed mix IS the brew-draw.)
// ---- background ART slot (printables2) ----
// Flip ART_ON to true once the images exist in art/ (named below). Until then a faint hatch marks the slot.
// Filenames: casks → art/cask-<beer>.png (gruit/hopped/broyhan/keut/mumme/bock/gose/zerbster/duckstein/jopenbier);
//            ships → art/ship-<hull>.png (cog/hulk). Prompts to generate them: art/PROMPTS.md.
const ART_ON=true, ART_DIR='art/';
// art rides an <img> (object-fit:cover) rather than a CSS background — html2canvas rasterizes an <img> at its
// NATIVE source resolution (sharp PNG export), whereas a background-image is upscaled from the element's CSS size.
function artLayer(file){return ART_ON
  ? '<div class="artbg scrim"><img class="artbg-img" src="'+ART_DIR+file+'" alt=""></div>'
  : '<div class="artbg ph" data-art="'+ART_DIR+file+'"></div>';}
function caskCardFront(d,act){
  let c=cost(d.g,d.h);if(d.alt)c+='<span style="opacity:.85">/</span>'+cost(d.alt[0],d.alt[1]);
  // START (place the vessel marker here at brew) → advance one step per turn → READY (ready = the step count)
  // the maturation track on ONE line: a dashed START (place the vessel marker) → numbered steps → a green
  // READY=FLIP endpoint (the flip glyph says "turn the card to its brewed side"). No title/rules text — the
  // brewhouse illustration sits behind it (cc-age background).
  let track='<div class="cc-step start">'+LU('flask-conical')+'</div>';
  for(let i=1;i<d.ready;i++)track+='<div class="cc-step">'+i+'</div>';
  track+='<div class="cc-step rdy">'+LU('undo-2')+'</div>';   // Ready → flip the card to its brewed side
  return '<div class="ccard cc-front" style="--c:'+d.c+'">'
    +'<div class="ce top"><div class="ce-row sb"><span class="cq big">'+LU(QI)+d.q+'</span>'
      +'<span class="ctitle"><span class="cnm">'+d.nm+'</span><span class="ccost">'+c+'</span></span></div></div>'
    +'<div class="cc-age"><div class="cc-agerow">'+track+'</div></div>'
    +'<div class="ce bot"><div class="ce-row sb"><span class="cq">'+LU(QI)+d.q+'</span><div class="cact"><span class="ac">'+LU(act.ai)+'</span><span>'+act.act+'</span></div></div></div>'
  +'</div>';
}
function caskCardBack(d,act){
  // both ends show Q + title; only the BOTTOM end carries the die/presence marker space
  const q='<span class="cq">'+LU(QI)+d.q+'</span><span class="cnm">'+d.nm+'</span>';
  return '<div class="ccard cc-back" style="--c:'+d.c+'">'
    +artLayer('cask-'+d.nm.toLowerCase()+'.png')
    +'<div class="ce top"><div class="ce-row sb">'+q+'</div></div>'
    +'<div class="cc-actfloat"><div class="cact"><span class="ac">'+LU(act.ai)+'</span><span>'+act.act+'</span></div></div>'
    +'<div class="ce bot"><div class="ce-row">'+q+'<span class="cc-mark" title="quality die / presence marker"></span></div></div>'
  +'</div>';
}
// printables2 v4: a SHIP is a full-bleed 2.5″ CARD (was a small tile) — the destination's CITY is the
// background art (wharf-<dest>.png), with the cask-card treatment: hull + commission cost over the art on
// the top end, the quality gate + numbered load-order berths floating low over the wharf, and a gradient
// FOOT in the destination's colour carrying the kontor name (the ship's identity). NO action — a ship is
// just hull size · destination · quality gate · cost.
function shipCard(hull,destNm){const cap=HULL[hull].cap;const d=SHIP_DEST[destNm];
  let berths='';for(let i=1;i<=cap;i++)berths+='<div class="sbn">'+i+'</div>';
  return '<div class="ccard cc-back ship-card" style="--c:'+d.kc+'">'
    +artLayer('wharf-'+destNm.toLowerCase()+'.png')
    +'<div class="ce top"><div class="ce-row sb"><span class="cnm shull">'+LU('sailboat')+(hull==='cog'?'Cog':'Hulk')+'</span><span class="ccost">'+cost(2,0)+'</span></div></div>'
    +'<div class="cc-actfloat"><div class="sberth">'+berths+'</div></div>'
    +'<div class="ce bot"><div class="ce-row sb"><span class="sdest">'+LU('landmark')+destNm+'</span><span class="sgate">'+LU(QI)+d.req+'+</span></div></div>'
  +'</div>';
}
// the SHIP card rear — one shared graphic for every ship (a Hanseatic cog at sea); ships are single-faced/neutral
// img-based art (not a CSS background) so the PNG export bakes it sharp — a CSS background gets upscaled from the
// element's CSS size by html2canvas (blurry). No scrim: the ship-at-sea graphic carries no text overlay.
function shipBack(){return '<div class="ccard ship-back" style="background:#33445a">'
  +'<div class="artbg"><img class="artbg-img" src="'+ART_DIR+'ship-back.png" alt=""></div></div>';}
function tok(d){return '<div class="tok" style="--c:'+d.c+'">'+LU(d.ic)+'</div>';}
function disc(c){return '<div class="disc" style="--c:'+c+'">'+LU('circle')+'</div>';}
// BUILDING OWNERSHIP FRAME (printables2) — a 2.5in player-colour base; a 2in Building tile sits on it, the
// colour edge marking ownership. Drops into a 2.5in wharf slot.
function frameTile(c,nm){return '<div class="frame" style="--c:'+c+'">'+(nm?'<span class="fl">'+nm+'</span>':'')+'</div>';}
function wtok(d){return '<div class="wtok" style="--c:'+d.c+'">'+LU(d.ic)+(d.nm?'<span>'+d.nm+'</span>':'')+'</div>';}

function recipeCard(r){return '<div class="card" style="--cc:'+r.cc+'">'
  +'<div class="c-reach">reaches: '+r.reach+'</div>'
  +'<div class="c-buy"><span class="lbl">'+LU('store')+' acquire at the Market</span>'
    +'<span class="gc">'+cost(r.buy.g,r.buy.h)+'</span>'
    +'<span>permanent — brewing never consumes it</span></div>'
  +'<div class="c-strip">'
    +'<div class="c-row"><span class="c-rung">'+LU(QI)+r.L+'</span><span class="c-nm">'+r.nm+'</span></div>'
    +'<div class="c-row"><span class="c-lbl">brew</span><span class="c-cost">'+cost(r.g,r.h)+'</span></div>'
  +'</div>'
  +'</div>';}

// charter-contract CARD (v0.16) — icon-first: the effect (a cask → a kontor) + the fare; the card IS the contract you spend
function contractCard(){return '<div class="card" style="--cc:#8a6408">'
  +'<div class="c-buy" style="justify-content:center;gap:.1in">'
    +'<div style="display:flex;align-items:center;gap:.06in;font-size:.32in;color:#8a6408">'+LU('beer')+'<span style="font-size:.17in;font-weight:bold">→</span>'+LU('sailboat')+'<span style="font-size:.17in;font-weight:bold">→</span>'+LU('landmark')+'</div>'
    +'<span class="lbl">one cask · single voyage → a kontor</span></div>'
  +'<div class="c-strip">'
    +'<div class="c-row"><span class="c-rung">'+LU('ticket')+'</span><span class="c-nm">Charter</span></div>'
    +'<div class="c-row"><span class="c-lbl">spend + fare</span><span class="c-cost">'+cost(2,0)+'</span></div>'
  +'</div></div>';}

// ---- player brewery board (v1.6 — rebuilt from scratch) ----
// A pure TRACKING surface: header + storage zone · THE FLOOR (3 vessel squares + maturation tracks + 3
// improvement squares) · THE FLIGHT (one space per beer) · a bottom RECIPE RACK (Gruit/Hopped printed as
// card-edge strips + tuck slots for export recipe cards). No rules text — those live on the player-aid card.
// maturation START spaces, by how many ages the beer needs (3 · 2 · 1 steps): place your aging marker on the
// space bearing your beer's name, then advance RIGHT one space per age — READY is always the last space.
const MSTART=[['Mumme','Bock'],['Keut'],['Gruit','Hopped','Broyhan']];
function mtrackCells(){
  let c=MSTART.map(names=>'<div class="ms">'+names.map(n=>'<span class="bn">'+n+'</span>').join('')+'</div>').join('');
  return c+'<div class="ms fin"><span class="rdy">Ready</span><span class="rsub">ship ▸</span></div>';}
function vcol(n,locked){
  return '<div class="vcol'+(locked?' locked':'')+'">'
    +'<div class="vsq"><span class="vn">Vessel '+n+'</span>'+LU('beer')+'<span>cask</span></div>'
    +'<div class="vflow">'+LU('arrow-right')+'</div>'
    +'<div class="mtrack">'+mtrackCells()+'</div></div>';}
function rkPrinted(cc,L,nm,g,h){   // a clone of a recipe card's bottom "c-strip" (the edge that shows when tucked)
  return '<div class="rk printed" style="--cc:'+cc+'">'
    +'<div class="c-row"><span class="c-rung">'+LU(QI)+L+'</span><span class="c-nm">'+nm+'</span></div>'
    +'<div class="c-row"><span class="c-lbl">brew</span><span class="c-cost">'+cost(g,h)+'</span></div></div>';}
// ---- player board v3 — a TILE-SLOT bench sized to the components (not the page), chrome-stripped.
// Top: 4 building/improvement slots (2in) + a compact Flight tally. Bottom: ONE recipe-stack slot (cards
// are made to stack) + 3 cask-vessel slots (2.46in). The die-cut hugs this cluster (see the call site). ----
function pbFlight(){   // distinct beers delivered → (beers−1)², min 3: 1·2 score 0, 3→4, 4→9, 5→16
  const rungs=[[1,0],[2,0],[3,4],[4,9],[5,16]];
  const boxes=rungs.map(r=>'<div class="pb2-fbox'+(r[1]?'':' z')+'"><span class="fn">'+r[0]+'</span>'
    +(r[1]?'<span class="fp">'+LU('star')+r[1]+'</span>':'<span class="fp">—</span>')+'</div>').join('');
  return '<div class="pb2-flight"><div class="fh">'+LU('layers')+'Flight</div>'
    +'<div class="fsub">distinct beers</div><div class="pb2-fboxes">'+boxes+'</div></div>';}
function pbRecipe(){   // ONE slot — recipe cards STACK here; Gruit & Hopped (the starters) printed at the base
  const bar=(cc,L,nm,g,h)=>'<div class="pb2-rbar" style="background:'+cc+'"><span class="rq">'+LU(QI)+L+'</span>'
    +'<span class="rn">'+nm+'</span><span class="rc">'+cost(g,h)+'</span></div>';

// printables2: the WHARF is now a CROSS board on its own (the cut follows the plus). 4×4 grid:
// empty corners · 8 perimeter slots · the 4 stations in the centre 2×2.
// a rounded-corner PLUS outline (objectBoundingBox 0–1) — used both as the cross board's clip-path and,
// chamfered, as its print cut. r = corner radius as a fraction of the board.
// scale/ox/oy let the SAME plus be emitted in objectBoundingBox fractions (defaults — for the clip-path)
// OR in absolute inch coords (for the cut overlay), so the CUT exactly matches the ART edge (the clip).
// r may be a number (same radius everywhere) OR {conv,conc} (different convex/concave radii — needed when
// the path is a uniform OUTWARD OFFSET of another plus, e.g. the art bleed clip vs the cut).
function roundedPlusPath(a,b,r,scale,ox,oy){
  scale=scale||1; ox=ox||0; oy=oy||0;
  const rc=(r&&typeof r==='object')?r:{conv:r,conc:r};
  const P=[[a,0],[b,0],[b,a],[1,a],[1,b],[b,b],[b,1],[a,1],[a,b],[0,b],[0,a],[a,a]];
  const sweep=[1,1,0,1,1,0,1,1,0,1,1,0];   // outer (convex) corners sweep 1, inner (concave) 0
  const n=P.length, V=i=>P[((i%n)+n)%n], f=x=>+x.toFixed(4);
  const nrm=p=>{const L=Math.hypot(p[0],p[1])||1;return[p[0]/L,p[1]/L];};
  const X=v=>f(ox+v*scale), Y=v=>f(oy+v*scale);
  let d='',ch=[];
  for(let i=0;i<n;i++){
    const ri=sweep[i]===1?rc.conv:rc.conc;
    const cur=V(i),pv=V(i-1),nx=V(i+1);
    const inD=nrm([cur[0]-pv[0],cur[1]-pv[1]]), outD=nrm([nx[0]-cur[0],nx[1]-cur[1]]);
    const en=[cur[0]-ri*inD[0],cur[1]-ri*inD[1]], ex=[cur[0]+ri*outD[0],cur[1]+ri*outD[1]];
    const R=f(ri*scale);
    d+=(i===0?'M ':'L ')+X(en[0])+' '+Y(en[1])+' A '+R+' '+R+' 0 0 '+sweep[i]+' '+X(ex[0])+' '+Y(ex[1])+' ';
    ch.push([X(en[0]),Y(en[1])],[X(ex[0]),Y(ex[1])]);
  }
  return {d:d+'Z',ch};
}
const CROSS_A=0.2435, CROSS_B=0.7565, CROSS_R=0.04;
const WHARF_W=11.5;          // the cross board size (in) — the CUT plus is this size; the ART bleeds past it
const CROSS_BLEED=0.125;     // ⚙ art bleed past the cut line (1/8″) for laser-cut tolerance — the cut is unchanged; only the art extends
// the ART clip = the cut plus DILATED outward by CROSS_BLEED, over a bleed-enlarged element (W + 2·bleed).
// A true outward offset: arms longer & wider by the bleed, convex corner radius +bleed, concave −bleed.
const CROSS_ART=(function(){const Wd=WHARF_W+2*CROSS_BLEED, halfArm=(CROSS_B-CROSS_A)/2*WHARF_W+CROSS_BLEED;
  return {a:(Wd/2-halfArm)/Wd, b:(Wd/2+halfArm)/Wd,
    r:{conv:(CROSS_R*WHARF_W+CROSS_BLEED)/Wd, conc:Math.max(.0005,(CROSS_R*WHARF_W-CROSS_BLEED)/Wd)}};})();
function wharfCross(){
  const slot='<div class="wslot">'+LU('barrel')+'</div>';   // empty slot's default action = Deploy (the barrel icon)
  const clip='<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><clipPath id="crossclip" clipPathUnits="objectBoundingBox"><path d="'+roundedPlusPath(CROSS_ART.a,CROSS_ART.b,CROSS_ART.r).d+'"/></clipPath></defs></svg>';
  const OR='<span class="sep">/</span>';
  const AND='<span class="sep">+</span>';   // brew AND deploy (both happen), vs OR alternatives
  const wharf='<div class="wharf">'
    +'<div></div>'+slot+slot+'<div></div>'
    +slot
    +station('A','Market','store','<b>2</b>'+LU('coins')+OR+LU('scroll-text')+OR+LU('building-2')+OR+LU('sailboat'))
    +station('B','Brewhouse','flask-conical',LU('beer')+AND+LU('barrel'))

    +'</div>';
  // padding grows by the bleed so the inner grid stays centered/put while the element (and its clipped art) extends outward
  return clip+'<div class="mboard cross" style="padding:'+(0.3+CROSS_BLEED).toFixed(3)+'in">'+wharf+'</div>';
}

//==================================================================
// PAGINATION — deterministic sheets of absolutely positioned items
//==================================================================
function newPage(pages,section,label,geo){const p={section,label,items:[],cuts:[],circles:[],geo:geo||PG};pages.push(p);return p;}
function packRun(pages,section,label,kind,htmlList,famTag,famPages,geo){
  // pack same-size items in gapless rows; rows flow page to page (one unbroken grid). geo = page geometry (default PG; tiles use TILE_GEO)
  const G=geo||PG;
  const [nw,nh]=SIZE[kind];const w=+(nw*SCALE).toFixed(4),h=+(nh*SCALE).toFixed(4);   // footprint = native × SCALE
  const cols=Math.floor((G.w-0.4)/w);const x0=+( (G.w-cols*w)/2 ).toFixed(4);
  // continue the previous run only if it's the SAME section, SAME page size (geo), AND was itself packed by packRun
  // (_kind set) — so a run never spills onto a mirror-BACKS page or a board page that shares the section.
  let pg=pages.length&&pages[pages.length-1].section===section&&(pages[pages.length-1].geo||PG)===G&&pages[pages.length-1]._kind?pages[pages.length-1]:newPage(pages,section,label,G);
  let cx=pg._cx!==undefined?pg._cx:x0, cy=pg._cy!==undefined?pg._cy:G.y0, rh=pg._rh||0;
  if(pg._kind&&pg._kind!==kind){cx=x0;cy=cy+rh;rh=0;}   // a new size always starts a fresh row
  htmlList.forEach(html=>{
    if(cx+w>x0+cols*w+0.001){cx=x0;cy+=h;}
    if(cy+h>G.yMax){pg._cx=undefined;pg=newPage(pages,section,label,G);cx=x0;cy=G.y0;}
    pg.items.push({x:cx,y:cy,w,h,nat:[nw,nh],html});   // nat = native size; the renderer scales content → footprint
    if(kind==='tok'||kind==='disc'||kind==='wtok')pg.circles.push({cx:cx+w/2,cy:cy+h/2,r:+(CUTR[kind]*SCALE).toFixed(4)});
    else addRectCut(pg,cx,cy,w,h);
    if(famTag)(famPages[famTag]=famPages[famTag]||new Set()).add(pages.indexOf(pg));
    cx+=w;rh=h;
  });
  pg._cx=cx;pg._cy=cy;pg._rh=rh;pg._kind=kind;
}
function addRectCut(pg,x,y,w,h){  // dedupe shared edges → each grid line cuts ONCE
  const seg=(x1,y1,x2,y2)=>{const k=[x1,y1,x2,y2].map(v=>v.toFixed(3)).join(',');
    if(!pg._segs)pg._segs={};if(pg._segs[k])return;pg._segs[k]=1;pg.cuts.push([x1,y1,x2,y2]);};
  seg(x,y,x+w,y);seg(x,y+h,x+w,y+h);seg(x,y,x,y+h);seg(x+w,y,x+w,y+h);
}
function addPolyCut(pg,pts){   // a closed polygon cut (the Wharf cross) — consecutive vertices → cut segments
  for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];pg.cuts.push([a[0],a[1],b[0],b[1]]);}
}
function boardPage(pages,section,label,html,h){
  const H=h||7.3;   // player boards pass a shorter height → the board is compact, leaving page white space
  const pg=newPage(pages,section,label);
  const sw=+(9.8*SCALE).toFixed(4),sh=+(H*SCALE).toFixed(4),x=+((PG.w-sw)/2).toFixed(4);   // scaled board, centred on the sheet
  pg.items.push({x,y:0.32,w:sw,h:sh,nat:[9.8,H],html});
  pg.rrect={x,y:0.32,w:sw,h:sh,r:+(0.12*SCALE).toFixed(4)};
}
// printables2: a LARGE-FORMAT (22×15) board sheet — the scaled Wharf (2.5in slots) is too big for letter.
// Centred on the sheet, with room to drop other boards alongside it later (paper efficiency).
function boardPageLg(pages,section,label,html,w,h){
  const G=TILE_GEO;const pg=newPage(pages,section,label,G);
  const x=+((G.w-w)/2).toFixed(3),y=+((G.h-h)/2).toFixed(3);
  pg.items.push({x,y,w,h,html});
  pg.rrect={x,y,w,h,r:0.14};
}
// printables2: the Wharf (a CROSS) + the Supply board, side by side on ONE large 22×15 sheet.
function wharfSupplySheet(pages){
  const G=TILE_GEO;const pg=newPage(pages,'boards','Main board — the Wharf (cross) + Supply board',G);
  // WHARF cross — the 4×4 grid (2.5in cells + .3in gaps) is 10.9in; +.3in outline padding → an 11.5in board.
  const W=WHARF_W, wx=0.4, wy=1.9, bl=CROSS_BLEED;
  // the board element extends OUTWARD by the bleed on every side (grid stays centered via the +bleed padding),
  // so the clipped art bleeds past the cut. The CUT itself is the original-size plus at (wx,wy) — unchanged.
  const Ox=+(wx-bl).toFixed(4),Oy=+(wy-bl).toFixed(4),wn=W+2*bl;
  pg.items.push({x:Ox,y:Oy,w:+(wn*SCALE).toFixed(4),h:+(wn*SCALE).toFixed(4),nat:[wn,wn],html:wharfCross()});
  pg.cutPath=roundedPlusPath(CROSS_A,CROSS_B,CROSS_R,W,wx,wy).d;   // native cross outline; scaled to match the content via cutXform
  pg.cutXform='matrix('+SCALE+',0,0,'+SCALE+','+(+(Ox*(1-SCALE)).toFixed(4))+','+(+(Oy*(1-SCALE)).toFixed(4))+')';
  // SUPPLY board (right) — the two market displays + the three shared tracks.
  const sx=12.2, sy=1.0, sw=9.3, sh=13.5;
  pg.items.push({x:sx,y:sy,w:+(sw*SCALE).toFixed(4),h:+(sh*SCALE).toFixed(4),nat:[sw,sh],html:supplyBoard()});
  pg.rrect={x:sx,y:sy,w:+(sw*SCALE).toFixed(4),h:+(sh*SCALE).toFixed(4),r:0.14};
}
// double-sided player aid: N IDENTICAL cards on a centred, SYMMETRIC 2×2 grid (full) or 1 centred (proof).
// Because the cards are identical and the grid is symmetric on both axes, the FRONT and BACK sheets register
// under either duplex flip edge — so "front aligns with back" holds regardless of the printer's flip setting.
function aidSheet(pages,label,faceHtml){
  const W=4.7,H=3.4;
  const pos=MODE==='proof'?[[(PG.w-W)/2,(PG.h-H)/2]]:[[0.35,0.4],[5.35,0.4],[0.35,4.1],[5.35,4.1]];
  const pg=newPage(pages,'cards',label);
  pos.forEach(([x,y])=>{pg.items.push({x,y,w:W,h:H,html:faceHtml});addRectCut(pg,x,y,W,H);});
}

function buildPages(){
  const pages=[],famPages={};
  // --- BOARDS ---
  wharfSupplySheet(pages);   // printables2: the Wharf (cross) + the Supply board on one 22×15 sheet
  boardPage(pages,'boards','Destinations board',dboard(),7.5);
  boardPage(pages,'boards','Trade Roads — Overland (back of Destinations)',olboard(),7.5);
  // (player brewery boards are generated LAST — at the bottom of the page — see below)
  // --- CARDS vs TILES — split by HOW they print (the user's two production paths):
  //   • CARDS    → LETTER (8.5×11) on a HOME duplex printer: casks & ships (2″ double-sided), recipes,
  //                contracts, player aids. Each FRONTS sheet has a matching BACKS sheet that is its LEFT↔RIGHT
  //                mirror, so a duplex flip on the SHORT edge lands each card's back square on its front; cut once.
  //   • TILES &  → the 22×15 PLOTTER (24″ large-format, SINGLE-SIDED): buildings (+ their Wild/★ back tiles),
  //     TOKENS     improvements, goods, workers, ownership discs, owner frames — all packed densely on the big
  //                sheet to save media. No duplex mirror (a plotter is one-sided): building backs are their own
  //                tiles; cut both and mount each front to its back around a chipboard core.
  const TG=TILE_GEO;
  // CASKS & SHIPS are double-sided 2″ CARDS on LETTER (8.5×11) for HOME double-sided printing — a centred grid
  // whose BACKS sheet is the LEFT↔RIGHT mirror of the fronts, so a duplex flip on the SHORT edge lands each
  // card's back on its front; then cut. Each cask front records its data+action so the BACKS pass prints the
  // brewed side. (Buildings/improvements/tokens are TILES → the plotter; see the TILES & TOKENS block below.)
  // helper: append a BACKS page mirroring each FRONT page LEFT↔RIGHT about that page's width (geo.w)
  function mirrorBackPages(frontPages,meta,geo,label,section){let i=0;frontPages.forEach(fp=>{
    const bp=newPage(pages,section||'tiles',label,geo);
    fp.items.forEach(it=>{const f=meta[i++];const mx=+(geo.w-it.x-it.w).toFixed(4);
      addRectCut(bp,mx,it.y,it.w,it.h);                                            // mirrored cut grid → registers the duplex sandwich
      if(f.cask)bp.items.push({x:mx,y:it.y,w:it.w,h:it.h,nat:it.nat,html:caskCardBack(f.d,f.act)});
      else if(f.bld)bp.items.push({x:mx,y:it.y,w:it.w,h:it.h,nat:it.nat,html:buildingBack(f.d)});
      else if(f.ship)bp.items.push({x:mx,y:it.y,w:it.w,h:it.h,nat:it.nat,html:shipBack()});});
    (famPages['Card/tile backs']=famPages['Card/tile backs']||new Set()).add(pages.indexOf(bp));
  });}
  // tag each front family by pack order (item order across the pages == meta order)
  function tagFamilies(frontPages,meta){let i=0;frontPages.forEach(fp=>fp.items.forEach(()=>{
    if(i>=meta.length)return;   // stop after the meta items — later kinds (e.g. building backs) share the page
    const fam=meta[i++].fam;(famPages[fam]=famPages[fam]||new Set()).add(pages.indexOf(fp));}));}

  // --- CASK & SHIP CARDS → LETTER (8.5×11), double-sided (flip LEFT↔RIGHT) ---
  // cask cards: Gruit all-Source (pinned); Q2+ cycle the draw-pool (Q4/Q5 include Wild) — the printed mix IS the brew-draw
  const cardFronts=[];
  CASKS.forEach(d=>{const pool=d.pin?[d.pin]:(d.wild?CASK_POOL.concat([CASK_WILD]):CASK_POOL);
    for(let i=0;i<cnt(d.n);i++){const act=pool[i%pool.length];cardFronts.push({fam:'Cask cards',kind:'caskc',cask:true,d,act,html:caskCardFront(d,act)});}});
  const shipList=MODE==='proof'?[['cog','Bruges'],['hulk','Novgorod']]:SHIP_DECK;
  shipList.forEach(([hull,dest])=>cardFronts.push({fam:'Ships',kind:'ship',ship:true,html:shipCard(hull,dest)}));   // ships = full-bleed 2.5″ cards
  const CLBL='Cask &amp; Ship CARDS — fronts · LETTER 8.5×11 · 2″, centred — print DOUBLE-SIDED, flip on the SHORT edge (LEFT↔RIGHT)';
  const cStart=pages.length;
  ['caskc','ship'].forEach(k=>packRun(pages,'tiles',CLBL,k,cardFronts.filter(f=>f.kind===k).map(f=>f.html),null,famPages,CARD_GEO));
  const cardFrontPages=pages.slice(cStart);
  tagFamilies(cardFrontPages,cardFronts);
  mirrorBackPages(cardFrontPages,cardFronts,CARD_GEO,'Cask &amp; Ship CARD BACKS · LETTER 8.5×11 (mirror — flip LEFT↔RIGHT): cask brewed-side · a ship at sea behind ships');

  // --- TILES & TOKENS → the 22×15 PLOTTER (24″ large-format) sheet-set: buildings (front art + their Wild/★
  // back) · improvements · goods · workers · ownership discs · building ownership rings — all packed densely on
  // the large sheet so we waste as little media as possible. A plotter prints SINGLE-SIDED, so building backs are
  // laid as their own tiles (cut both, mount each building front to its Wild/★ back around a chipboard core) —
  // not a duplex mirror sheet (that's for the home-printer CARDS above). Casks/ships/recipes stay on Letter. ---
  const TLBL='Tiles &amp; tokens — buildings · improvements · goods · ownership rings (22×15 PLOTTER · single-sided · cut apart)';
  const bldFronts=[];
  BUILDINGS.forEach(d=>{for(let i=0;i<cnt(d.n);i++)bldFronts.push({fam:d.verb==='value'?'Value Buildings':'Transform Buildings',html:buildingCard(d)});});
  const bStart=pages.length;
  packRun(pages,'bits',TLBL,'bld',bldFronts.map(f=>f.html),null,famPages,TG);
  tagFamilies(pages.slice(bStart),bldFronts);   // capped at meta.length → only the front tiles get the Value/Transform family
  const bldBacks=[];BUILDINGS.forEach(d=>{for(let i=0;i<cnt(d.n);i++)bldBacks.push(buildingBack(d));});
  packRun(pages,'bits',TLBL,'bld',bldBacks,'Building backs (Wild + '+DEVELOP_PTS+'★)',famPages,TG);
  // the single-sided tiles & tokens flow onto the same plotter sheets, densely
  const imps=[];IMPROVE.forEach(d=>{for(let i=0;i<cnt(d.n);i++)imps.push(improveTile(d));});
  packRun(pages,'bits',TLBL,'imp',imps,'Improvements',famPages,TG);
  const toks=[];GOODS.forEach(d=>{for(let i=0;i<cnt(d.n);i++)toks.push(tok(d));});
  packRun(pages,'bits',TLBL,'tok',toks,'Goods tokens',famPages,TG);
  const wt=[];PLAYERS.forEach(p=>wt.push(wtok({ic:'user-round',c:p.c})));
  wt.push(wtok({ic:'anchor',nm:'first player (fixed)',c:'#b8860b'}));
  wt.push(wtok({ic:'hourglass',nm:'round marker',c:'#5b4a37'}));
  packRun(pages,'bits',TLBL,'wtok',MODE==='proof'?wt.slice(0,3):wt,'Workers & markers',famPages,TG);
  const ds=[];PLAYERS.forEach(p=>{for(let i=0;i<cnt(OWN_DISCS);i++)ds.push(disc(p.c));});
  packRun(pages,'bits',TLBL,'disc',ds,'Ownership discs',famPages,TG);
  const frames=[];PLAYERS.forEach(p=>{for(let i=0;i<cnt(6);i++)frames.push(frameTile(p.c,p.nm));});
  packRun(pages,'bits',TLBL,'frame',frames,'Building frames',famPages,TG);
  // --- RECIPE CARDS (cardstock — do not mount; they tuck under the board edge) ---
  const cards=[];const sets=MODE==='proof'?1:PLAYERS.length;
  for(let s=0;s<sets;s++)RECIPES.forEach(r=>cards.push(recipeCard(r)));
  packRun(pages,'cards','Export recipe cards — 1 set per player','card',cards,'Recipe cards',famPages);
  const contractCards=[];for(let i=0;i<cnt(CONTRACTS.n);i++)contractCards.push(contractCard());   // v0.16 charter contracts = cards
  packRun(pages,'cards','Charter contract cards','card',contractCards,'Charter contracts',famPages);
  // PLAYER AID — a double-sided reference card (front: a turn · back: icon reference); 2 sheets, duplex
  aidSheet(pages,'Player aid — FRONT (a turn)',aidFront());
  aidSheet(pages,'Player aid — BACK (icon reference)',aidBack());
  // cardstock + paper cutter: cut lines print on the ART layer as grey guides (no laser pass)
  pages.filter(p=>p.section==='cards').forEach(p=>p.papercut=true);
  // --- PLAYER BOARDS (moved to the BOTTOM of the page, just before the checklist) ---
  PLAYERS.slice(0,cnt(PLAYERS.length)).forEach(p=>{   // tight die-cut hugging the slot cluster (not a page-filling rect)
    const W=9.64,H=5.25,sw=+(W*SCALE).toFixed(4),sh=+(H*SCALE).toFixed(4),X=+((PG.w-sw)/2).toFixed(2),Y=0.55,pg=newPage(pages,'boards','Player board — '+p.nm);
    pg.items.push({x:X,y:Y,w:sw,h:sh,nat:[W,H],html:pboard(p)});
    pg.rrect={x:X,y:Y,w:sw,h:sh,r:+(0.18*SCALE).toFixed(4)};
  });
  // --- CHECKLIST (always last; carries no cuts, so earlier sheets stay page-aligned) ---
  const pg=newPage(pages,'list','Component checklist');
  pages.forEach((p,i)=>p.no=i+1);   // number sheets BEFORE building the checklist's sheet refs
  pg.items.push({x:0,y:0,w:10.4,h:7.9,html:checklist(pages,famPages)});
  return pages;
}

function pgRef(pages,famPages,fam){const s=famPages[fam];if(!s)return '—';
  return 'S'+[...s].map(i=>pages[i].no).sort((a,b)=>a-b).join(', S');}
function checklist(pages,famPages){
