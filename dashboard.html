<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brewhouses of the Hanse — Sim Dashboard</title>
<style>
  :root{
    --bg:#f4ecd9; --panel:#fffaf0; --ink:#3a2f1e; --muted:#8a7a5c; --line:#e0d4ba;
    --gold:#b8860b; --green:#3f7d4f; --red:#b4493a; --blue:#3a6ea5; --purple:#5b3a8e; --amber:#c8841a;
    --good:#3f7d4f; --bad:#b4493a; --fair:#9a8a6a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background-image:radial-gradient(transparent 60%,rgba(0,0,0,.02))}
  header{padding:20px 26px 14px;border-bottom:3px double var(--gold);background:var(--panel)}
  h1{margin:0;font-size:1.5rem;letter-spacing:.3px}
  h1 .v{color:var(--gold)}
  .sub{color:var(--muted);font-size:.84rem;margin-top:4px}
  .note{color:var(--muted);font-size:.8rem}
  main{max-width:1180px;margin:0 auto;padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:0 1px 3px rgba(80,60,20,.06)}
  .card.wide{grid-column:1/-1}
  .card h2{margin:0 0 2px;font-size:1.02rem;display:flex;align-items:center;gap:8px}
  .card h2 .tag{font-size:.62rem;text-transform:uppercase;letter-spacing:.5px;color:#fff;background:var(--gold);padding:2px 6px;border-radius:99px;font-weight:700}
  .finding{font-size:.82rem;color:#5c4d33;margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  .finding b{color:var(--ink)}
  /* grouped bars */
  .grp{margin-top:10px}
  .grow{display:grid;grid-template-columns:88px 1fr 46px;align-items:center;gap:8px;margin:5px 0}
  .glabel{font-size:.8rem;text-align:right;color:#5c4d33;text-transform:capitalize}
  .gtrack{position:relative;height:16px;background:#efe6d0;border-radius:4px;overflow:hidden}
  .gbar{position:absolute;left:0;top:0;height:100%;border-radius:4px}
  .gval{font-size:.76rem;font-variant-numeric:tabular-nums;color:#5c4d33;text-align:left}
  .fairline{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fair);z-index:2}
  .countpills{display:flex;gap:6px;margin:6px 0 2px;justify-content:flex-end}
  .pill{font-size:.68rem;color:var(--muted);background:#efe6d0;border-radius:99px;padding:1px 8px}
  /* per-count small multiples */
  .smwrap{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
  .sm{flex:1;min-width:130px}
  .sm h3{margin:0 0 4px;font-size:.78rem;color:var(--muted);font-weight:600}
  /* diverging (improvements) */
  .dvrow{display:grid;grid-template-columns:84px 1fr 1fr;align-items:center;gap:4px;margin:4px 0}
  .dvneg,.dvpos{height:14px;display:flex;align-items:center}
  .dvneg{justify-content:flex-end}
  .dvbar{height:100%;border-radius:3px}
  .dvtxt{font-size:.72rem;padding:0 4px;color:#5c4d33;font-variant-numeric:tabular-nums}
  /* timeline */
  .tl{position:relative;margin:14px 6px 6px;height:48px;border-left:2px solid var(--line)}
  .tlnode{position:absolute;top:0;transform:translateX(-50%);text-align:center}
  .tldot{width:11px;height:11px;border-radius:50%;background:var(--amber);margin:0 auto;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--amber)}
  .tlend .tldot{background:var(--red);box-shadow:0 0 0 1px var(--red)}
  .tllbl{font-size:.64rem;color:var(--muted);margin-top:3px;white-space:nowrap;transform:rotate(-12deg);transform-origin:top center}
  .tlaxis{position:absolute;bottom:-14px;left:0;right:0;height:2px;background:var(--line)}
  /* seat */
  .seatcmp{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
  .seatbox{flex:1;min-width:150px}
  .seatbar{display:flex;height:26px;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
  .seatseg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:.72rem;font-weight:700;font-variant-numeric:tabular-nums}
  /* feel stat row */
  .stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
  .stat{background:#efe6d0;border-radius:8px;padding:8px 12px;text-align:center;min-width:92px}
  .stat .n{font-size:1.3rem;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
  .stat .l{font-size:.68rem;color:var(--muted)}
  .miss{padding:40px;text-align:center;color:var(--muted)}
  footer{max-width:1180px;margin:0 auto;padding:8px 18px 30px;color:var(--muted);font-size:.76rem}
  a{color:var(--blue)}
</style>
</head>
<body>
<header>
  <h1>🍺 Brewhouses of the Hanse — <span class="v" id="ver">Simulation Dashboard</span></h1>
  <div class="sub" id="sub"></div>
</header>
<main id="main"><div class="miss">Loading <code>dashboard-data.js</code>…</div></main>
<footer id="foot"></footer>

<script src="dashboard-data.js"></script>
<script>
const LANE_COLOR={prestige:'#5b3a8e',deep:'#7a4a1e',volume:'#3a6ea5',majority:'#b8860b',demand:'#3f7d4f'};
const COUNTS=['2','3','4'];
const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function card(title,tag,wide){const c=$('div','card'+(wide?' wide':''));c.appendChild($('h2',null,title+(tag?' <span class="tag">'+tag+'</span>':'')));return c;}
function finding(txt){return $('div','finding',txt);}
function maxOf(arr){return Math.max.apply(null,arr.filter(x=>!isNaN(x)));}

// grouped horizontal bars for one player count: rows of {label,val} vs a fair line, scaled to `scale`
function barGroup(rows,fair,scale,colorFn){
  const g=$('div','grp');
  rows.forEach(r=>{
    const row=$('div','grow');
    row.appendChild($('div','glabel',r.label));
    const track=$('div','gtrack');
    const bar=$('div','gbar');bar.style.width=Math.max(1,Math.min(100,100*r.val/scale))+'%';
    bar.style.background=colorFn?colorFn(r):(r.val>=fair?'var(--good)':'var(--bad)');
    track.appendChild(bar);
    if(fair!=null){const fl=$('div','fairline');fl.style.left=(100*fair/scale)+'%';track.appendChild(fl);}
    row.appendChild(track);
    row.appendChild($('div','gval',r.val.toFixed(1)+(r.suffix||'')));
    g.appendChild(row);
  });
  return g;
}

function renderLanes(D){
  const c=card('Lane balance','win-rate vs fair');
  const wrap=$('div','smwrap');
  COUNTS.forEach(n=>{
    const sm=$('div','sm');sm.appendChild($('h3',null,n+'p &nbsp;<span class="note">(fair '+D.fair[n]+'%)</span>'));
    const rows=D.rows.map(k=>({label:k,val:D.data[k][n],key:k})).sort((a,b)=>b.val-a.val);
    sm.appendChild(barGroup(rows,D.fair[n],Math.max(60,maxOf(rows.map(r=>r.val))+5),r=>LANE_COLOR[r.key]||'var(--gold)'));
    wrap.appendChild(sm);
  });
  c.appendChild(wrap);c.appendChild(finding(D.finding));return c;
}

function renderScores(D){
  const c=card('Typical scores','by player count');
  const st=$('div','stats');
  COUNTS.forEach(n=>{const s=$('div','stat');s.appendChild($('div','n',D.winner[n]));s.appendChild($('div','l',n+'p winner avg'));s.appendChild($('div','l',D.range[n]));st.appendChild(s);});
  c.appendChild(st);
  // per-lane avg totals at 3p (representative)
  const sm=$('div','sm');sm.appendChild($('h3',null,'avg total by lane (3p)'));
  const rows=Object.keys(D.laneAvg).map(k=>({label:k,val:D.laneAvg[k]['3'],key:k})).sort((a,b)=>b.val-a.val);
  sm.appendChild(barGroup(rows,null,Math.max(45,maxOf(rows.map(r=>r.val))+3),r=>LANE_COLOR[r.key]||'var(--gold)'));
  const w=$('div','smwrap');w.appendChild(sm);c.appendChild(w);
  c.appendChild(finding(D.finding));return c;
}

function renderLadder(D){
  const c=card('Strength ladder','strong-AI head-to-head');
  D.rows.forEach(r=>{
    const sm=$('div','sm');sm.style.marginTop='8px';
    sm.appendChild($('h3',null,r.name+' &nbsp;<span class="note">('+r.hi+' win-rate)</span>'));
    const rows=COUNTS.map(n=>({label:n+'p',val:r[n]}));
    sm.appendChild(barGroup(rows,50,100,rr=>rr.val>=50?'var(--green)':'var(--red)'));
    c.appendChild(sm);
  });
  c.appendChild(finding(D.finding));return c;
}

function renderSeat(D){
  const c=card('Turn-order fairness','the v1.7 fix');
  const wrap=$('div','seatcmp');
  [['before',D.before],['after',D.after]].forEach(([k,grp])=>{
    const box=$('div','seatbox');box.appendChild($('h3',null,grp.label));
    COUNTS.forEach(n=>{if(!grp[n])return;
      const seats=grp[n];const bar=$('div','seatbar');bar.style.marginBottom='5px';
      seats.forEach((v,i)=>{const seg=$('div','seatseg','P'+(i+1)+' '+v+'%');seg.style.width=v+'%';
        seg.style.background=Math.abs(v-100/seats.length)<6?'var(--green)':(v>100/seats.length?'var(--blue)':'var(--red)');bar.appendChild(seg);});
      box.appendChild($('div','note',n+'p'));box.appendChild(bar);
    });
    wrap.appendChild(box);
  });
  c.appendChild(wrap);c.appendChild(finding(D.finding));return c;
}

function renderClimb(D){
  const c=card('The quality climb','Q4/Q5 reach + timeline');
  // deliver rates
  const sm=$('div','sm');sm.appendChild($('h3',null,'deliver-rate (% of player-games)'));
  const rows=[];COUNTS.forEach(n=>rows.push({label:'Q5 @'+n+'p',val:D.deliverRate.q5[n],key:'q5'}));
  COUNTS.forEach(n=>rows.push({label:'Q4+ @'+n+'p',val:D.deliverRate.q4plus[n],key:'q4'}));
  sm.appendChild(barGroup(rows,null,40,r=>r.key==='q5'?'var(--purple)':'var(--amber)'));
  const w=$('div','smwrap');w.appendChild(sm);c.appendChild(w);
  // timeline
  const maxR=maxOf(D.timeline.map(t=>t.r));
  const tl=$('div','tl');
  D.timeline.forEach(t=>{const node=$('div','tlnode'+(t.ev==='game ends'?' tlend':''));node.style.left=(100*t.r/maxR)+'%';
    node.innerHTML='<div class="tldot"></div><div class="tllbl">R'+t.r+' '+t.ev+'</div>';tl.appendChild(node);});
  tl.appendChild($('div','tlaxis'));
  const tlwrap=$('div');tlwrap.style.marginTop='20px';tlwrap.appendChild($('h3',null,'<span class="note">Trader median timeline →</span>'));tlwrap.appendChild(tl);
  c.appendChild(tlwrap);
  c.appendChild(finding(D.finding));return c;
}

function renderImprovements(D){
  const c=card('Improvements','free-start win-rate Δ vs fair');
  const sm=$('div');sm.style.marginTop='6px';
  const rows=D.rows.map(k=>({k,avg:(D.data[k]['2']+D.data[k]['3']+D.data[k]['4'])/3,d:D.data[k]})).sort((a,b)=>b.avg-a.avg);
  const lim=13;
  rows.forEach(r=>{
    const row=$('div','dvrow');row.appendChild($('div','glabel',D.label[r.k]));
    const neg=$('div','dvneg');const pos=$('div','dvpos');
    const v=r.avg;
    if(v<0){const b=$('div','dvbar');b.style.width=Math.min(100,100*(-v)/lim)+'%';b.style.background='var(--red)';neg.appendChild($('div','dvtxt',v.toFixed(1)));neg.appendChild(b);}
    else{const b=$('div','dvbar');b.style.width=Math.min(100,100*v/lim)+'%';b.style.background='var(--green)';pos.appendChild(b);pos.appendChild($('div','dvtxt','+'+v.toFixed(1)));}
    row.appendChild(neg);row.appendChild(pos);sm.appendChild(row);
  });
  c.appendChild(sm);c.appendChild(finding(D.finding));return c;
}

function renderFeel(D){
  const c=card('Turn feel','turn-by-turn log');
  const st=$('div','stats');
  st.appendChild((()=>{const s=$('div','stat');s.appendChild($('div','n',D.decisionsPerTurn));s.appendChild($('div','l','decisions / turn'));return s;})());
  st.appendChild((()=>{const s=$('div','stat');s.appendChild($('div','n',D.skipPct+'%'));s.appendChild($('div','l','no-op skips'));return s;})());
  st.appendChild((()=>{const s=$('div','stat');s.appendChild($('div','n',D.roundsAvg));s.appendChild($('div','l','avg rounds'));return s;})());
  c.appendChild(st);
  // occupied-station fork: how often offered, and who works the Floor
  const w=$('div','smwrap');
  const sm=$('div','sm');sm.appendChild($('h3',null,'fork offered <span class="note">(% of turns)</span>'));
  sm.appendChild(barGroup(COUNTS.map(n=>({label:n+'p',val:D.floorToll[n].forks,suffix:'%'})),null,40,()=>'var(--blue)'));
  w.appendChild(sm);
  if(D.floorSearch){const sm2=$('div','sm');sm2.appendChild($('h3',null,'Floor-worked <span class="note">(Trader 0% · '+D.floorSearch.label+')</span>'));
    sm2.appendChild(barGroup(COUNTS.map(n=>({label:n+'p',val:D.floorSearch[n],suffix:'%'})),null,40,()=>'var(--purple)'));
    w.appendChild(sm2);}
  c.appendChild(w);
  c.appendChild(finding(D.finding));return c;
}

function render(){
  const D=window.DASH;const main=document.getElementById('main');main.innerHTML='';
  if(!D){main.innerHTML='<div class="miss">No data — run <code>node playtests/dashboard-gen.js</code> to create <code>dashboard-data.js</code>.</div>';return;}
  document.getElementById('ver').textContent=D.meta.version+' · '+D.meta.key;
  document.getElementById('sub').innerHTML=D.meta.date+' · '+D.meta.games;
  document.getElementById('foot').innerHTML=D.meta.note+' &nbsp;·&nbsp; Regenerate fast sections: <code>node playtests/dashboard-gen.js</code>';
  main.appendChild(renderLanes(D.lanes));
  main.appendChild(renderScores(D.scores));
  main.appendChild(renderLadder(D.ladder));
  main.appendChild(renderSeat(D.seat));
  main.appendChild(renderClimb(D.climb));
  main.appendChild(renderImprovements(D.improvements));
  main.appendChild(renderFeel(D.feel));
}
render();
</script>
</body>
</html>
