//==================================================================
// PAGINATION — deterministic sheets of absolutely positioned items
//==================================================================
function newPage(pages,section,label,geo){const p={section,label,items:[],cuts:[],circles:[],geo:geo||PG};pages.push(p);return p;}
function packRun(pages,section,label,kind,htmlList,famTag,famPages,geo){
  // pack same-size items in gapless rows; rows flow page to page (one unbroken grid). geo = page geometry (default PG; tiles use TILE_GEO)
  const G=geo||PG;
  const [nw,nh]=SIZE[kind];const w=+(nw*SCALE).toFixed(4),h=+(nh*SCALE).toFixed(4);   // footprint = native × SCALE
  const cols=Math.floor((G.w-0.4)/w);const x0=+( (G.w-cols*w)/2 ).toFixed(4);
  // continue the previous run only if it's the SAME section, SAME page size (geo), AND was itself packed by packRun
  // (_kind set) — so a run never spills onto a mirror-BACKS page or a board page that shares the section.
  let pg=pages.length&&pages[pages.length-1].section===section&&(pages[pages.length-1].geo||PG)===G&&pages[pages.length-1]._kind?pages[pages.length-1]:newPage(pages,section,label,G);
  let cx=pg._cx!==undefined?pg._cx:x0, cy=pg._cy!==undefined?pg._cy:G.y0, rh=pg._rh||0;
  if(pg._kind&&pg._kind!==kind){cx=x0;cy=cy+rh;rh=0;}   // a new size always starts a fresh row
  htmlList.forEach(html=>{
    if(cx+w>x0+cols*w+0.001){cx=x0;cy+=h;}
    if(cy+h>G.yMax){pg._cx=undefined;pg=newPage(pages,section,label,G);cx=x0;cy=G.y0;}
    pg.items.push({x:cx,y:cy,w,h,nat:[nw,nh],html});   // nat = native size; the renderer scales content → footprint
    if(kind==='tok'||kind==='disc'||kind==='wtok')pg.circles.push({cx:cx+w/2,cy:cy+h/2,r:+(CUTR[kind]*SCALE).toFixed(4)});
    else addRectCut(pg,cx,cy,w,h);
    if(kind==='frame'){   // owner RINGS: also cut the interior hole (sized to a building tile, so the ring frames it)
      const hw=+(SIZE.bld[0]*SCALE).toFixed(4),hh=+(SIZE.bld[1]*SCALE).toFixed(4),ix=+((w-hw)/2).toFixed(4),iy=+((h-hh)/2).toFixed(4);
      if(ix>0.02)addRectCut(pg,+(cx+ix).toFixed(4),+(cy+iy).toFixed(4),hw,hh);}
    if(famTag)(famPages[famTag]=famPages[famTag]||new Set()).add(pages.indexOf(pg));
    cx+=w;rh=h;
  });
  pg._cx=cx;pg._cy=cy;pg._rh=rh;pg._kind=kind;
}
function addRectCut(pg,x,y,w,h){  // dedupe shared edges → each grid line cuts ONCE
  const seg=(x1,y1,x2,y2)=>{const k=[x1,y1,x2,y2].map(v=>v.toFixed(3)).join(',');
    if(!pg._segs)pg._segs={};if(pg._segs[k])return;pg._segs[k]=1;pg.cuts.push([x1,y1,x2,y2]);};
  seg(x,y,x+w,y);seg(x,y+h,x+w,y+h);seg(x,y,x,y+h);seg(x+w,y,x+w,y+h);
}
// pack same-size items (a single kind) into a sub-rectangle [x0,y0]→[x1,y1] of an EXISTING page — used to tuck the
// small TOKENS into the empty corners of the main board sheet. Rows flow within the box; round tokens get a cut circle.
function packRegion(pages,pg,kind,htmlList,x0,y0,x1,y1,famTag,famPages,bleed){
  // bleed=true packs like packSpaced: box = tile + 1.5mm bleed/side (.bl wrapper extends the
  // colours), boxes touch (bleeds = the 3mm cut gap), each piece cut on its own rounded rect
  const [nw0,nh0]=SIZE[kind];
  const nw=bleed?+(nw0+2*TILE_BLEED_N).toFixed(3):nw0, nh=bleed?+(nh0+2*TILE_BLEED_N).toFixed(3):nh0;
  const w=+(nw*SCALE).toFixed(4),h=+(nh*SCALE).toFixed(4);
  const cols=Math.max(1,Math.floor((x1-x0)/w));let cx=x0,cy=y0,n=0,over=0;
  htmlList.forEach(html=>{
    if(n&&n%cols===0){cx=x0;cy=+(cy+h).toFixed(4);}
    if(cy+h>y1+0.01)over++;
    pg.items.push({x:+cx.toFixed(4),y:+cy.toFixed(4),w,h,nat:[nw,nh],html:bleed?'<div class="bl">'+html+'</div>':html});
    if(kind==='tok'||kind==='disc'||kind==='wtok')pg.circles.push({cx:+(cx+w/2).toFixed(4),cy:+(cy+h/2).toFixed(4),r:+(CUTR[kind]*SCALE).toFixed(4)});
    else if(bleed)(pg.rrects=pg.rrects||[]).push({x:+(cx+TILE_BLEED).toFixed(3),y:+(cy+TILE_BLEED).toFixed(3),w:+(w-2*TILE_BLEED).toFixed(3),h:+(h-2*TILE_BLEED).toFixed(3),r:TILE_CUT_R});
    else addRectCut(pg,cx,cy,w,h);
    cx=+(cx+w).toFixed(4);n++;
  });
  if(famTag)(famPages[famTag]=famPages[famTag]||new Set()).add(pages.indexOf(pg));
  if(over)console.warn('packRegion '+kind+': '+over+' items overflow the box bottom ('+y1+')');
}
function addPolyCut(pg,pts){   // a closed polygon cut (the Wharf cross) — consecutive vertices → cut segments
  for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];pg.cuts.push([a[0],a[1],b[0],b[1]]);}
}
// ---- SPACED tile sheets (2026-07-19) — casks · ships · buildings are laser-cut TILES on the 22″ plotter:
// one FAMILY per call → ONE fronts sheet (22in wide, height fitted to the content) + its BACKS sheet (the
// LEFT↔RIGHT mirror — flip / mount around chipboard, cut the sandwich once). EVERY piece is cut on its OWN
// ROUNDED-RECT path — one joined laser line whose radius matches the tile art's .09in corner (× SCALE) —
// and carries a 1.5mm BLEED all round (the .bl wrapper extends the colours/art past the cut; the content
// never moves). Adjacent bleed boxes TOUCH: 1.5 + 1.5mm of bleed IS the 3mm gap between cut lines, so the
// sheet interior is solid ink and a slightly misaligned laser still lands on colour.
// runs = [{kind, items:[{html,back,fam}]}] (two footprints — the Cog/Hulk carriers — pack as consecutive runs).
const TILE_CUT_R=+(0.09*SCALE).toFixed(3), TILE_MAX_H=15, TILE_W=22;
const TILE_BLEED=0.059, TILE_BLEED_N=+(0.059/SCALE).toFixed(3);   // 1.5mm print bleed per side · its native size (1.5mm ÷ SCALE)
function packSpaced(pages,section,label,runs,famPages){
  // 2026-08-18 (designer: "wrap the tiles — less wasted white space"): the runs FLOW as one
  // continuous stream — a new run continues the current row while width remains, and each
  // row advances by its TALLEST tile. Mixed heights in a row cut fine (every tile carries
  // its own rounded-rect path; side bleeds still touch along the shared edges). The backs
  // sheet mirrors per item, so duplex registration is unaffected.
  const B=TILE_BLEED,W=TILE_W;const items=[];
  let cx=0.4, cy=0.45, rh=0;
  runs.forEach(run=>{
    if(!run.items.length)return;
    const [nw0,nh0]=SIZE[run.kind];
    const nw=+(nw0+2*TILE_BLEED_N).toFixed(3),nh=+(nh0+2*TILE_BLEED_N).toFixed(3);   // the packed box = tile + bleed
    const w=+(nw*SCALE).toFixed(3),h=+(nh*SCALE).toFixed(3);
    run.items.forEach(it=>{
      if(cx+w>W-0.4+0.001){cx=0.4;cy=+(cy+rh).toFixed(3);rh=0;}   // wrap: the row closes at its tallest tile
      items.push({x:+cx.toFixed(3),y:cy,w,h,nat:[nw,nh],
        html:'<div class="bl">'+it.html+'</div>',back:it.back?'<div class="bl">'+it.back+'</div>':null,fam:it.fam});
      cx=+(cx+w).toFixed(3);rh=Math.max(rh,h);
    });
  });
  cy=+(cy+rh).toFixed(3);
  const H=+(cy+0.45).toFixed(2);
  if(H>TILE_MAX_H)console.warn('packSpaced: "'+label+'" exceeds the '+TILE_MAX_H+'in laser bed ('+H+'in)');
  const geo={w:W,h:H,y0:0.45,yMax:+(H-0.28).toFixed(2)};
  const cut=it=>({x:+(it.x+B).toFixed(3),y:+(it.y+B).toFixed(3),w:+(it.w-2*B).toFixed(3),h:+(it.h-2*B).toFixed(3),r:TILE_CUT_R});   // the cut hugs the TILE edge, inset past the bleed
  const fp=newPage(pages,section,label,geo);
  items.forEach(it=>{fp.items.push({x:it.x,y:it.y,w:it.w,h:it.h,nat:it.nat,html:it.html});
    (fp.rrects=fp.rrects||[]).push(cut(it));
    if(it.fam)(famPages[it.fam]=famPages[it.fam]||new Set()).add(pages.indexOf(fp));});
  if(items.some(it=>it.back)){
    const bp=newPage(pages,section,label.replace(' FRONTS','')+' — BACKS (the horizontal mirror: flip LEFT↔RIGHT / mount around chipboard, cut once)',geo);
    items.forEach(it=>{if(!it.back)return;const mx=+(W-it.x-it.w).toFixed(3);
      bp.items.push({x:mx,y:it.y,w:it.w,h:it.h,nat:it.nat,html:it.back});
      (bp.rrects=bp.rrects||[]).push(cut({x:mx,y:it.y,w:it.w,h:it.h}));});
    (famPages['Card/tile backs']=famPages['Card/tile backs']||new Set()).add(pages.indexOf(bp));
  }
}
// a LETTER (8.5×11 landscape) board: designed at 9.8×7.0 and printed — like EVERY component in the kit —
// at the one global SCALE (×0.8), centred on the sheet. Consistency ruling (2026-07-13): nothing in the
// kit prints at its own bespoke scale; the sheets keep their paper sizes, the content rides SCALE.
function letterBoard(pages,section,label,html){
  const pg=newPage(pages,section,label);   // default PG geo = letter landscape (10.4×7.9 printable)
  const NW=9.8,NH=7.0, sc=SCALE;
  const w=+(NW*sc).toFixed(3),h=+(NH*sc).toFixed(3),x=+((PG.w-w)/2).toFixed(3),y=+((PG.h-h)/2).toFixed(3);
  pg.items.push({x,y,w,h,nat:[NW,NH],html});   // nat = the design size → itDiv scales the whole board by sc
  (pg.rrects=pg.rrects||[]).push({x,y,w,h,r:0.14});   // the board's die-cut, like its table-board siblings
}
// printables2: the Wharf (a CROSS) on its own trimmed 22-wide sheet (the Supply board moved to its own sheet).
function wharfBoardSheet(pages){
  const G=WHARF_GEO;const pg=newPage(pages,'boards','Main board — the Wharf (cross) + Destinations board (cut both)',G);
  // WHARF cross — 1.32in slot bands + 2.5in station tracks + .3in gaps → an 8.84in native board (7.07 print).
  // wy sits the cross near the top so the trimmed sheet has minimal margin (the Specialists tuck into the open right).
  const W=WHARF_W, wx=0.4, wy=0.7, bl=CROSS_BLEED;
  // the board element extends OUTWARD by the bleed on every side (grid stays centered via the +bleed padding),
  // so the clipped art bleeds past the cut. The CUT itself is the original-size plus at (wx,wy) — unchanged.
  const Ox=+(wx-bl).toFixed(4),Oy=+(wy-bl).toFixed(4),wn=W+2*bl;
  pg.items.push({x:Ox,y:Oy,w:+(wn*SCALE).toFixed(4),h:+(wn*SCALE).toFixed(4),nat:[wn,wn],html:wharfCross()});
  pg.cutPath=roundedPlusPath(CROSS_A,CROSS_B,CROSS_R,W,wx,wy).d;   // native cross outline; scaled to match the content via cutXform
  pg.cutXform='matrix('+SCALE+',0,0,'+SCALE+','+(+(Ox*(1-SCALE)).toFixed(4))+','+(+(Oy*(1-SCALE)).toFixed(4))+')';
  // the DESTINATIONS board rides the cross's right band (2026-08-18 — at native scale it broke the Market sheet's 22in)
  const DW=+(DEST2_NW*SCALE).toFixed(4),DH=+(DEST2_NH*SCALE).toFixed(4);
  const dx=+(wx+(W+2*bl)*SCALE+0.5).toFixed(3), dy=+((G.h-DH)/2).toFixed(3);
  pg.items.push({x:dx,y:dy,w:DW,h:DH,nat:[DEST2_NW,DEST2_NH],html:destBoard()});
  (pg.rrects=pg.rrects||[]).push({x:dx,y:dy,w:DW,h:DH,r:0.14});
  return pg;
}
const DEST2_NW=7.6,DEST2_NH=9.0;   // the Destinations board: the Kontore 2×2 + the Orders row
// the MARKET & STORES board + the DESTINATIONS & HALL board — the table pair, on ONE trimmed 22in sheet.
// (labels stay PLAIN TEXT — every consumer escapes for itself.)
function supplyBoardSheet(pages){
  const G=SUPPLY_GEO;const pg=newPage(pages,'boards','Market & Stores board',G);
  const w1=+(SUPPLY_NW*SCALE).toFixed(4),h1=+(SUPPLY_NH*SCALE).toFixed(4);
  const x1=+((G.w-w1)/2).toFixed(3), y1=+((G.h-h1)/2).toFixed(3);
  pg.items.push({x:x1,y:y1,w:w1,h:h1,nat:[SUPPLY_NW,SUPPLY_NH],html:supplyBoard()});
  pg.rrects=[{x:x1,y:y1,w:w1,h:h1,r:0.14}];
}
// the PLAYER AID tri-fold sheets: ONE full-bleed letter sheet each (front + mirrored back),
// three panels per sheet, TWO printed cut lines at the thirds (paper-cutter grey — the
// cards convention). Unscaled like the checklist: the sheet IS the component.
function aidTrifoldSheets(pages){
  const W=+(PG.w/3).toFixed(4), panels=aid3Panels();
  const mk=(label,list)=>{const pg=newPage(pages,'cards',label);
    list.forEach((html,i)=>pg.items.push({x:+(i*W+0.14).toFixed(3),y:0.3,w:+(W-0.28).toFixed(3),h:7.9,html}));
    pg.cuts.push([W,0.12,W,8.38],[+(2*W).toFixed(4),0.12,+(2*W).toFixed(4),8.38]);
    return pg;};
  mk('Player aid \u2014 FRONTS \u00d73 (identical panels \u00b7 two cuts at the lines \u2192 three complete aids per sheet)',panels.front);
  mk('Player aid \u2014 BACKS \u00d73 (identical panels \u2014 any duplex flip registers)',panels.back);
}

function buildPages(){
  const pages=[],famPages={};
  // --- BOARDS ---
  wharfBoardSheet(pages);   // the Wharf (cross) — its own trimmed 22-wide sheet
  // (kit pass 2026-08-18, SCALE 1.0: the Specialists + Order strips LEFT the Wharf sheet's
  // right band — the Destinations board rides there now; they pack their own trimmed sheet)
  const wimps=[];IMPROVE.forEach(d=>{for(let i=0;i<cnt(d.n);i++)wimps.push({fam:'Improvements',html:improveTile(d)});});
  const wlds=(MODE==='proof'?LADINGS.slice(0,3):LADINGS).map(d=>({fam:'Ladings',html:ladingTile(d)}));
  packSpaced(pages,'bits','Specialist tiles + Order strips (single-sided) · 22″ plotter · 1.5mm bleed · cuts 3mm apart',[{kind:'imp',items:wimps},{kind:'ld',items:wlds}],famPages);
  supplyBoardSheet(pages);   // the Supply & Tracks board — its own sheet
  // (v4.0: the Trade Roads board is TABLED with the expansions — olboard() stays for its return)
  // (player brewery boards are generated LAST — at the bottom of the page — see below)
  // --- TILES vs CARDS — split by HOW they print (2026-07-19: casks & ships are TILES again):
  //   • TILES    → 22-wide PLOTTER sheets via packSpaced: CASKS · SHIPS · BUILDINGS each on their OWN
  //                fronts sheet + its LEFT↔RIGHT mirrored BACKS sheet, a 3mm gap between pieces, every
  //                piece cut on its own rounded-rect path (mount around chipboard, cut the sandwich once).
  //   • CARDS    → LETTER (8.5×11) cardstock on a HOME duplex printer: recipes, contracts, player aids
  //                (each fronts sheet keeps its mirrored backs sheet; flip on the SHORT edge).
  //   • TOKENS   → single-sided, their own trimmed 22-wide sheet (the Wharf sheet's right side holds the Specialists).
  // helper: append a BACKS page mirroring each FRONT page LEFT↔RIGHT about that page's width (geo.w)
  function mirrorBackPages(frontPages,meta,geo,label,section){let i=0;frontPages.forEach(fp=>{
    const bp=newPage(pages,section||'tiles',label,geo);
    fp.items.forEach(it=>{const f=meta[i++];const mx=+(geo.w-it.x-it.w).toFixed(4);
      addRectCut(bp,mx,it.y,it.w,it.h);                                            // mirrored cut grid → registers the duplex sandwich
      if(f.cask)bp.items.push({x:mx,y:it.y,w:it.w,h:it.h,nat:it.nat,html:caskCardBack(f.d,f.act)});
      else if(f.bld)bp.items.push({x:mx,y:it.y,w:it.w,h:it.h,nat:it.nat,html:buildingBack(f.d)});
      else if(f.ship)bp.items.push({x:mx,y:it.y,w:it.w,h:it.h,nat:it.nat,html:shipBack(f.hull)});
      else if(f.rec)bp.items.push({x:mx,y:it.y,w:it.w,h:it.h,nat:it.nat,html:recipeCard(f.d,true)});});
    (famPages['Card/tile backs']=famPages['Card/tile backs']||new Set()).add(pages.indexOf(bp));
  });}
  // tag each front family by pack order (item order across the pages == meta order)
  function tagFamilies(frontPages,meta){let i=0;frontPages.forEach(fp=>fp.items.forEach(()=>{
    if(i>=meta.length)return;   // stop after the meta items — later kinds (e.g. building backs) share the page
    const fam=meta[i++].fam;(famPages[fam]=famPages[fam]||new Set()).add(pages.indexOf(fp));}));}

  // --- CASK TILES → their own 22″ plotter sheet pair (fronts + mirrored backs) ---
  // Gruit all-Source (pinned); Q2+ cycle their quality's GATED pool (survey/hire/brew Q3+ — v4.12) — the printed mix IS the brew-draw; the per-beer offsets guarantee each Q3+ beer ONE brew tile
  const caskItems=[];
  CASKS.filter(d=>!d.exp).forEach(d=>{const pool=d.pin?[d.pin]:poolFor(d.q);   // the base beers; the pool mix IS the brew-draw
    for(let i=0;i<cnt(d.n);i++){const act=pool[(i+(d.off||0))%pool.length];
      caskItems.push({fam:'Cask tiles',html:caskCardBack(d,act)});}});   // v4.0 SINGLE-FACED: the wharf/die side is the whole tile (the die is the aging marker — no aging face)
  packSpaced(pages,'tiles','Cask tiles — SINGLE-FACED (the die seat · printed START value · quality · load bonus) · 22″ plotter · 1.5mm bleed · cuts 3mm apart',[{kind:'caskc',items:caskItems}],famPages);
  // v4.14 "Beer Atlas": the EXPANSION cask tiles — their own sheet, so the base kit cuts clean without them.
  // Every specialty beer is PINNED (one printed load bonus on every tile of its pile).
  const expCaskItems=[];
  CASKS.filter(d=>d.exp).forEach(d=>{for(let i=0;i<cnt(d.n);i++)
    expCaskItems.push({fam:'Expansion casks',html:caskCardBack(d,d.pin||poolFor(d.q)[0])});});
  packSpaced(pages,'tiles','EXPANSION cask tiles — Specialty Beers (Gose · Zerbster · Duckstein) + the Jopenbier capstone · pinned bonuses · 22″ plotter · 1.5mm bleed',[{kind:'caskc',items:expCaskItems}],famPages);
  // --- v4.15 THE GUILDHALL (expansion): the board (letter) + Invitations + the eased Order set (plotter) ---
  letterBoard(pages,'boards','EXPANSION — The Guild Tastings board (data + slots: the open row · the Taproom floor · the deck & ⚜-card wells)',hallBoardHtml());
  // v4.17: the eased 20-Order set is CUT (hall mode plays the base 15) — the TASTING tiles print instead
  // (kit pass 2026-08-18: the ⚜ Invitations left this plotter sheet — they are CARDS now, see the cards section)
  const contTiles=(MODE==='proof'?CONTESTS_P.slice(0,3):CONTESTS_P).map(t=>({fam:'Tastings',html:contestTile(t)}));
  // v4.16b: the GUILD CHANCERY building prints here, not on the base sheet — hall mode deals it guaranteed (17 of 21)
  const hallBld=BUILDINGS.filter(b=>b.hall).map(d=>({fam:'Hall building',html:buildingCard(d)}));
  packSpaced(pages,'bits','EXPANSION — Tastings tiles: the 12-Tasting contest deck (v4.17) + the Guild Chancery building · 22″ plotter · 1.5mm bleed',[{kind:'bld',items:contTiles.concat(hallBld)}],famPages);
  // --- SHIP TILES → their own sheet pair; the Cog and Hulk carriers pack as two runs (different heights) ---
  const skutes=[],cogs=[],hulks=[];
  (MODE==='proof'?[['skute','Bruges'],['cog','London'],['hulk','Novgorod']]:SHIP_DECK).forEach(([hull,dest])=>{
    (hull==='skute'?skutes:hull==='cog'?cogs:hulks).push({fam:'Ships',html:shipCard(hull,dest),back:shipBack(hull)});});
  packSpaced(pages,'tiles','Ship tile FRONTS — the carriers (Skute 1 · Cog 2 · Hulk 3 berths · 22″ plotter · 1.5mm bleed · cuts 3mm apart · double-sided)',[{kind:'shipk',items:skutes},{kind:'shipc',items:cogs},{kind:'shiph',items:hulks}],famPages);
  // --- BUILDING TILES → their own sheet pair (front art / Wild back) ---
  const bldItems=[];
  BUILDINGS.forEach(d=>{if(d.hall)return;for(let i=0;i<cnt(d.n);i++)
    bldItems.push({fam:'Buildings',html:buildingCard(d)});});   // v4.0 SINGLE-FACED: no owner, no WILD flip — displaced tiles are boxed · v4.16b: the Chancery prints on the GUILDHALL sheet
  packSpaced(pages,'bits','Building tiles — SINGLE-FACED, one green family (print 20 · SETUP DEALS 17/game, v4.6 · 22″ plotter · 1.5mm bleed · cuts 3mm apart · v45d power ladder: fees in grain only)',[{kind:'bld',items:bldItems}],famPages);
  // (the CONTRACT strips print on S1 — the Wharf sheet's open right band, above)
  // (2026-07-19: the UNLOCK-COVER sheet left the kit — sourced, any opaque square, like the tally dice.
  //  v3.4c: the owner frames are RETIRED — little house tokens mark building ownership; store-bought.)
  // --- TOKENS → their own single-sided trimmed sheet (moved off the Wharf sheet, 2026-07-14) ---
  const TLBL_TOK='Tokens (single-sided · cut circles) — goods. (The quality dice are real d6 — provide '+PRES_DISCS+'/colour; the die IS the aging marker, so the cask cubes and aging markers left the kit. Score movers: 1 disc/colour, sourced.)';
  const wtok=[];GOODS.forEach(d=>{for(let i=0;i<cnt(d.n);i++)wtok.push(tok(d));});
  packRun(pages,'bits',TLBL_TOK,'tok',wtok,'Goods tokens',famPages,TOK_GEO);
  // --- RECIPE CARDS (cardstock — do not mount) — DOUBLE-SIDED since v3.2d: cost face / BREWED face.
  // One set per player of STARTERS (Gruit · Hopped) + every export; flip a card on your first brew of it.
  const recMeta=[];const sets=MODE==='proof'?1:PLAYERS.length;
  for(let s=0;s<sets;s++)STARTERS.concat(RECIPES.filter(r=>!r.exp)).forEach(r=>recMeta.push({fam:'Recipe cards',rec:true,d:r}));   // the base set (v4.14: the expansions print on their own run below)
  const rStart=pages.length;
  packRun(pages,'cards','Recipe cards — fronts (starters + exports, 1 set per player) — print DOUBLE-SIDED, flip LEFT↔RIGHT','card',recMeta.map(f=>recipeCard(f.d)),'Recipe cards',famPages);
  const recFrontPages=pages.slice(rStart);
  mirrorBackPages(recFrontPages,recMeta,PG,'Recipe card BACKS (mirror — flip LEFT↔RIGHT): the BREWED face — flip on your first brew; your flipped cards ARE the Flight','cards');
  // v4.14 "Beer Atlas": the EXPANSION recipe cards (Gose · Zerbster · Duckstein · Jopenbier), 1 set/player
  const expRecMeta=[];
  for(let s=0;s<sets;s++)RECIPES.filter(r=>r.exp).forEach(r=>expRecMeta.push({fam:'Expansion recipes',rec:true,d:r}));
  const erStart=pages.length;
  packRun(pages,'cards','EXPANSION recipe cards — fronts (Specialty Beers + the Jopenbier capstone, 1 set per player) — DOUBLE-SIDED, flip LEFT↔RIGHT','card',expRecMeta.map(f=>recipeCard(f.d)),'Expansion recipes',famPages);
  mirrorBackPages(pages.slice(erStart),expRecMeta,PG,'EXPANSION recipe card BACKS (mirror): the BREWED face','cards');
  // v4.17 kit pass (2026-08-18): the ⚜ Invitations print as CARDS — sealed letters, single-sided cardstock
  const invCards=[];for(let i=0;i<cnt(18);i++)invCards.push(invitationCard());
  packRun(pages,'cards','EXPANSION — ⚜ Invitation cards (18 ⚙ · the sealed letter · SINGLE-SIDED cardstock)','card',invCards,'Invitations',famPages);
  // (v4.0: the charter contracts LEFT the box — the 1-berth Skute is the relief valve, as a component)
  // PLAYER AID — a double-sided reference card (front: a turn · back: icon reference); 2 sheets, duplex
  aidTrifoldSheets(pages);   // 2026-08-18: the aid is a LETTER TRI-FOLD — one sheet per player, two cuts
  // cardstock + paper cutter: cut lines print on the ART layer as grey guides (no laser pass)
  pages.filter(p=>p.section==='cards').forEach(p=>p.papercut=true);
  // --- PLAYER BOARDS (moved to the BOTTOM of the page, just before the checklist) ---
  {  // tight die-cut hugging the slot cluster — TWO boards per sheet (designer, 2026-08-03)
    const W=7.65,H=3.85,sw=+(W*SCALE).toFixed(4),sh=+(H*SCALE).toFixed(4),X=+((PG.w-sw)/2).toFixed(2);
    const ps=PLAYERS.slice(0,cnt(PLAYERS.length));let bpg=null;
    ps.forEach((p,i)=>{
      if(i%2===0)bpg=newPage(pages,'boards','Player boards — '+p.nm+(ps[i+1]?' + '+ps[i+1].nm:''));
      const Y=+(((PG.h-2*sh-0.3)/2)+(i%2)*(sh+0.3)).toFixed(3);   // native boards: symmetric margins, .3in gap (2026-08-18)
      bpg.items.push({x:X,y:Y,w:sw,h:sh,nat:[W,H],html:pboard(p)});
      (bpg.rrects=bpg.rrects||[]).push({x:X,y:Y,w:sw,h:sh,r:+(0.18*SCALE).toFixed(4)});
    });
  }
  // --- CHECKLIST (always last; carries no cuts, so earlier sheets stay page-aligned) ---
  const pg=newPage(pages,'list','Component checklist');
  pages.forEach((p,i)=>p.no=i+1);   // number sheets BEFORE building the checklist's sheet refs
  pg.items.push({x:0.3,y:0.3,w:10.4,h:7.9,html:checklist(pages,famPages)});
  return pages;
}

// OVERLAY SVG — registration marks (both layers) + cut lines (CUT)
//==================================================================
function regmarkSvg(g){g=g||PG;const m=0.15;const regs=[[m,m],[g.w-m,m],[m,g.h-m],[g.w-m,g.h-m]];let s='';regs.forEach(([x,y])=>{
  s+='<line x1="'+(x-0.15)+'" y1="'+y+'" x2="'+(x+0.15)+'" y2="'+y+'" stroke="#000" stroke-width="0.012" fill="none"/>'
    +'<line x1="'+x+'" y1="'+(y-0.15)+'" x2="'+x+'" y2="'+(y+0.15)+'" stroke="#000" stroke-width="0.012" fill="none"/>'
    +'<circle cx="'+x+'" cy="'+y+'" r="0.07" stroke="#000" stroke-width="0.012" fill="none"/>';});
  return s;}
function marksSvg(pg){  // ONE fragment shared by the on-page overlay and BOTH SVG exports → guaranteed alignment
  const g=pg.geo||PG;
  const bx2=+(g.w-0.5).toFixed(2), bx1=+(bx2-3).toFixed(2), bxm=+((bx1+bx2)/2-0.32).toFixed(2);  // a 3.00in scale-check bar at the top-right of any page size
  return regmarkSvg(g)
    +'<text x="0.45" y="0.22" font-size="0.11" font-family="Georgia,serif" fill="#000">Brewhouses of the Hanse · S'+pg.no+' · '+MODE+' · '+esc(pg.label)+'</text>'
    +'<line x1="'+bx1+'" y1="0.16" x2="'+bx2+'" y2="0.16" stroke="#000" stroke-width="0.014"/>'
    +'<line x1="'+bx1+'" y1="0.1" x2="'+bx1+'" y2="0.22" stroke="#000" stroke-width="0.014"/>'
    +'<line x1="'+bx2+'" y1="0.1" x2="'+bx2+'" y2="0.22" stroke="#000" stroke-width="0.014"/>'
    +'<text x="'+bxm+'" y="0.12" font-size="0.09" font-family="Georgia,serif" fill="#000">3.00 in</text>';}
function cutsSvg(pg){
  const cc=pg.papercut?'#888':'#f00';   // paper-cutter guides print grey with the art; laser cuts are red
  let s='';
  pg.cuts.forEach(c=>{s+='<line x1="'+c[0]+'" y1="'+c[1]+'" x2="'+c[2]+'" y2="'+c[3]+'" stroke="'+cc+'" stroke-width="0.008" fill="none"/>';});
  pg.circles.forEach(c=>{s+='<circle cx="'+c.cx+'" cy="'+c.cy+'" r="'+c.r+'" stroke="'+cc+'" stroke-width="0.008" fill="none"/>';});
  const rrs=(pg.rrects||[]).concat(pg.rrect?[pg.rrect]:[]);
  rrs.forEach(r=>{s+='<rect x="'+r.x+'" y="'+r.y+'" width="'+r.w+'" height="'+r.h+'" rx="'+r.r+'" stroke="'+cc+'" stroke-width="0.008" fill="none"/>';});
  if(pg.cutPath)s+='<path d="'+pg.cutPath+'"'+(pg.cutXform?' transform="'+pg.cutXform+'"':'')+' stroke="'+cc+'" stroke-width="0.008" fill="none"/>';
  return s;}
function overlaySvg(pg){const g=pg.geo||PG;
  return '<svg class="ov" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+g.w+' '+g.h+'">'
    +'<g class="marks">'+marksSvg(pg)+'</g>'
    +'<g class="cuts'+(pg.papercut?' always':'')+'">'+cutsSvg(pg)+'</g></svg>';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

//==================================================================
// RENDER + DOWNLOADS
//==================================================================
//==================================================================
// PNG EXPORT — rasterize any component to a PNG (html2canvas) ·
// download individually, or a whole type as a .zip (JSZip).
// Filenames: <type>-<name>-<front|back>.png. High-res (×6) so the output meets/exceeds the 1024px source art.
//
// ---- REVIEW NOTE from a parallel session (2026-06-28) — findings on the export "seam line" ----
// I was chasing the same exported-card horizontal seam this `bakeArt()` flatten apparently fixes. Notes
// in case they're useful for review / future tweaks (no code change here — this is just a comment):
//  • ROOT CAUSE: html2canvas leaves a 1px seam at CSS linear-gradient COLOUR-STOPS. The visible line on
//    card backs was the coloured `var(--c) → transparent` end/foot gradients (.cc-back .ce.top/.ce.bot,
//    .bcard .bc-foot, ship foot), seaming at their stop (cask-gose-back: ~y34% = the .ce.top 36% stop).
//    If any seam survives bakeArt on cards whose gradient is a real DOM element (not part of the baked art
//    layer), converting that gradient to an inline SVG linearGradient (baked colour, stop-opacity not the
//    `transparent` keyword) renders seam-free — same trick already used for the scrim / station roof.
//  • DO NOT swap in html2canvas-pro to "fix gradients": tested — it renders gradients cleanly BUT TAINTS
//    the export canvas ("getImageData/toBlob … tainted by cross-origin data"), which breaks the download.
//  • html2canvas also ignores radial-gradients (station roof → SVG pattern), CSS filter (building-back
//    grey), and clip-path:url() (wharf board → re-clip via Path2D) — keep those SVG/Path2D workarounds.
//  • VERIFYING the export in a headless sandbox: reading full-res card screenshots trips a 32MB media
//    limit. Verify with a small render (scale 2) + a NUMERIC metric (2nd-difference of row brightness in
//    the 20–48% band) POSTed back via the local http server's request log — never read a big card image.
// ------------------------------------------------------------------------------------------------------
//==================================================================
const PNG_SCALE=6;   // ⚙ a 2″ card → 1152px, a 2.5″ card → 1440px — both ≥ the 1024² source art (no soft upscaling)
const SHEET_DPI=410; // ⚙ full-sheet PNG export resolution. 410 ≈ the source art's native density (1024px ÷ 2.5in) → no
                     // data loss; a 22×15 sheet → ~9020×6150px. Lower it (≈300) for smaller files if a browser struggles.
let EXPORT=[];   // current export registry (index = onclick handle)
function exportItems(){
  const it=[];
  it.push({type:'board',name:'wharf',side:'',w:WHARF_W+2*CROSS_BLEED,h:WHARF_W+2*CROSS_BLEED,scale:2,clip:'cross',html:wharfCross()});
  // CASKS — v4.0 single-faced (the wharf/die side); one asset per DISTINCT beer × load-bonus
  // (v4.14: the expansion beers export too — each is pinned, so one asset per beer)
  CASKS.forEach(d=>{const pool=d.pin?[d.pin]:poolFor(d.q);
    const seen=new Set();
    for(let i=0;i<d.n;i++){const act=pool[(i+(d.off||0))%pool.length];if(seen.has(act.k))continue;seen.add(act.k);
      it.push({type:'cask',name:slug(d.nm)+'-'+act.k,side:'front',w:2.5,h:1,html:caskCardBack(d,act)});}});
  // SHIPS — one per distinct hull+destination + the shared back
  const seen=new Set();
  SHIP_DECK.forEach(([hull,dest])=>{const key=hull+'-'+slug(dest);if(seen.has(key))return;seen.add(key);
    it.push({type:'ship',name:key,side:'front',w:2.5,h:HULL[hull].cap,html:shipCard(hull,dest)});
    it.push({type:'ship',name:key,side:'back', w:2.5,h:HULL[hull].cap,html:shipBack(hull)});});
  // BUILDINGS — v4.0 single-faced, one green family
  BUILDINGS.forEach(d=>it.push({type:'building',name:d.k,side:'front',w:2.5,h:1.32,html:buildingCard(d)}));
  IMPROVE.forEach(d=>it.push({type:'improvement',name:slug(d.nm),side:'front',w:2,h:2,html:improveTile(d)}));
  STARTERS.concat(RECIPES).forEach(r=>{   // v4.14: the expansion recipe cards export too
    it.push({type:'recipe',name:slug(r.nm),side:'front',w:1.85,h:2.55,html:recipeCard(r)});
    it.push({type:'recipe',name:slug(r.nm),side:'back', w:1.85,h:2.55,html:recipeCard(r,true)});});
  {const p3=aid3Panels();const W=+(11/3-0.28).toFixed(3);
   it.push({type:'aid',name:'panel',side:'front',w:W,h:7.9,html:p3.front[0]});
   it.push({type:'aid',name:'panel',side:'back', w:W,h:7.9,html:p3.back[0]});}
  return it;
}
const fname=it=>it.type+'-'+it.name+(it.side?'-'+it.side:'')+'.png';
// BAKE the art layer to a flat <canvas> before html2canvas runs. Each art slot is a full-bleed <img object-fit:cover>
// sitting over the card's coloured background, with a scrim ::after on top (and, on displaced backs, a grayscale
// filter). html2canvas/WebKit can leave a hairline sub-pixel gap when it redraws the scaled <img>, through which the
// card background colour peeks (the orange/grey centre seam on cask & building BACKS). It also ignores the CSS
// grayscale filter (backs export in full colour). Compositing img + scrim (+ grayscale) into ONE opaque, slightly
// overscanned canvas hands html2canvas a single bitmap — no object-fit, no gradient, no filter, no centre gap.
function bakeRGB(css){                                    // resolve any CSS colour → [r,g,b]
  const t=document.createElement('span');t.style.color=css||'#777';document.body.appendChild(t);
  const m=getComputedStyle(t).color.match(/\d+/g);t.remove();return m?[+m[0],+m[1],+m[2]]:[119,119,119];}
function bakeArt(root,scale){
  root.querySelectorAll('.artbg>img.artbg-img').forEach(img=>{
    if(!img.complete||!img.naturalWidth)return;
    const layer=img.parentElement;                       // .artbg — inset:0, full card
    const ow=layer.offsetWidth,oh=layer.offsetHeight;if(!ow||!oh)return;
    const OB=2;                                           // overscan (CSS px each side) so no edge/centre gap exposes the card bg
    const w=Math.round((ow+2*OB)*scale),h=Math.round((oh+2*OB)*scale);
    const top=OB*scale,ch=oh*scale;                       // the card's own band inside the overscanned canvas
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');
    const cover=Math.max(w/img.naturalWidth,h/img.naturalHeight),dw=img.naturalWidth*cover,dh=img.naturalHeight*cover;
    cx.imageSmoothingQuality='high';
    if(layer.closest('.bc-bk'))cx.filter='grayscale(.55) brightness(.78)';   // displaced building back (CSS filter html2canvas drops)
    const shipT=layer.closest('.stile')&&!layer.closest('.ship-back');
    if(shipT){   // mirror the live CSS (2026-08-17): the wharf art rides 125% tall, shifted up 13% — the cream mats crop off
      const bh2=1.25*ch, by2=top-0.13*ch;
      const cov2=Math.max(w/img.naturalWidth,bh2/img.naturalHeight);
      const sw2=img.naturalWidth*cov2,sh2=img.naturalHeight*cov2;
      cx.drawImage(img,(w-sw2)/2,by2+(bh2-sh2)/2,sw2,sh2);
    }else cx.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);
    cx.filter='none';
    // ship tiles suppress the scrim on screen (.stile>.artbg.scrim::after{content:none}) — don't bake it in
    if(layer.classList.contains('scrim')&&!layer.closest('.stile')){   // bake the scrim gradient in card-space (not the overscanned canvas)
      const g=cx.createLinearGradient(0,top,0,top+ch);
      g.addColorStop(0,'rgba(0,0,0,.5)');g.addColorStop(.28,'rgba(0,0,0,.12)');
      g.addColorStop(.72,'rgba(0,0,0,.12)');g.addColorStop(1,'rgba(0,0,0,.55)');
      cx.fillStyle=g;cx.fillRect(0,top,w,ch);
    }
    // CASK BACK colour foot — the top/bottom var(--c) fades live on .ce.top/.ce.bot as element backgrounds; html2canvas
    // leaves a hairline at each element-box edge (34%/70%) that lets the card bg show through (the orange/grey seam).
    // Bake the SAME fade as one full-card gradient here (canvas API → no box edge, no stop seam); .baked-fg drops the CSS.
    const cb=layer.closest('.cc-back');
    if(cb&&!cb.classList.contains('ship-card')){
      const [r,g2,b2]=bakeRGB(getComputedStyle(cb).getPropertyValue('--c').trim());
      const C='rgba('+r+','+g2+','+b2+',1)',T='rgba('+r+','+g2+','+b2+',0)';
      const gc=cx.createLinearGradient(0,top,0,top+ch);
      gc.addColorStop(0,C);gc.addColorStop(.124,C);gc.addColorStop(.344,T);
      gc.addColorStop(.696,T);gc.addColorStop(.884,C);gc.addColorStop(1,C);
      cx.fillStyle=gc;cx.fillRect(0,top,w,ch);cb.classList.add('baked-fg');
    }
    cv.className='artbg-img';cv.style.cssText='position:absolute;inset:-'+OB+'px;width:calc(100% + '+(2*OB)+'px);height:calc(100% + '+(2*OB)+'px);display:block';
    layer.classList.add('baked');img.replaceWith(cv);     // .baked suppresses the now-redundant CSS scrim
  });
  // CASK TILE art fade — .ct-art masks its <img> with a linear-gradient (mask-image), which html2canvas
  // IGNORES → the export shows a hard-edged art rectangle instead of the fade into the beer colour.
  // Bake img + fade into one canvas (alpha via destination-in); the container's ignored mask stays inert.
  root.querySelectorAll('.ct-art>img').forEach(img=>{
    if(!img.complete||!img.naturalWidth)return;
    const box=img.parentElement;const ow=box.offsetWidth,oh=box.offsetHeight;if(!ow||!oh)return;
    const w=Math.round(ow*scale),h=Math.round(oh*scale);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');
    const bw=w*1.12,bh=h*1.52,bx=-.06*w,by=-.26*h;      // the img's CSS layout box (112%×152% at −6%/−26%)
    const cover=Math.max(bw/img.naturalWidth,bh/img.naturalHeight),dw=img.naturalWidth*cover,dh=img.naturalHeight*cover;
    cx.imageSmoothingQuality='high';
    cx.drawImage(img,bx+(bw-dw)/2,by+(bh-dh)/2,dw,dh);
    const rtl=!!box.closest('.ctB');                     // wharf side: art on the RIGHT, fading leftward (270deg)
    const g=cx.createLinearGradient(rtl?w:0,0,rtl?0:w,0);
    g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.24,'rgba(0,0,0,1)');
    g.addColorStop(.94,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0)');
    cx.globalCompositeOperation='destination-in';cx.fillStyle=g;cx.fillRect(0,0,w,h);
    cv.style.cssText='position:absolute;inset:0;width:100%;height:100%;display:block';
    img.replaceWith(cv);
  });
  // SHIP TILE colour wash — .st-wash is solid kontor colour under a mask-image alpha ramp (solid over the
  // identity band, thinning to 30% over the berths). html2canvas ignores the mask → the export floods the
  // whole tile solid and hides the port art. Bake the same ramp into a canvas inside the (kept) element.
  root.querySelectorAll('.st-wash').forEach(el=>{
    const ow=el.offsetWidth,oh=el.offsetHeight;if(!ow||!oh)return;
    const w=Math.round(ow*scale),h=Math.round(oh*scale);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');
    const [r,g2,b2]=bakeRGB(getComputedStyle(el).backgroundColor);
    const A=a=>'rgba('+r+','+g2+','+b2+','+a+')';
    const y1=Math.min(1,28.8/oh),y2=Math.min(1,91.2/oh); // the mask's .3in / .95in stops in this element's own box
    const g=cx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,A(1));g.addColorStop(y1,A(1));g.addColorStop(y2,A(.3));g.addColorStop(1,A(.3));
    cx.fillStyle=g;cx.fillRect(0,0,w,h);
    el.style.background='none';el.style.webkitMaskImage='none';el.style.maskImage='none';   // the canvas carries wash + fade now
    cv.style.cssText='position:absolute;inset:0;width:100%;height:100%;display:block';
    el.appendChild(cv);
  });
}
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
async function canvasOf(it){
  const host=document.createElement('div');host.style.cssText='position:fixed;left:-99999px;top:0';
  const box=document.createElement('div');box.style.cssText='width:'+it.w+'in;height:'+it.h+'in;overflow:hidden';
  box.innerHTML=it.html;host.appendChild(box);document.body.appendChild(host);
  if(window.lucide)lucide.createIcons();           // render this component's icons
  // wait for the art <img>(s) to fully load/decode so html2canvas captures them at native resolution
  await Promise.all([...box.querySelectorAll('img')].map(im=>(im.complete&&im.naturalWidth)
    ? Promise.resolve()
    : new Promise(res=>{im.addEventListener('load',res,{once:true});im.addEventListener('error',res,{once:true});})));
  await new Promise(r=>setTimeout(r,30));           // a tick for layout/decode
  bakeArt(box,it.scale||PNG_SCALE);                  // flatten art+scrim(+grayscale) → one bitmap (kills the centre seam)
  const canvas=await html2canvas(box,{scale:it.scale||PNG_SCALE,useCORS:true,backgroundColor:null,logging:false,
    width:box.offsetWidth,height:box.offsetHeight,windowWidth:box.offsetWidth,windowHeight:box.offsetHeight});
  document.body.removeChild(host);
  // html2canvas ignores SVG clip-path:url(), so re-apply the cross clip on the canvas (transparent corners)
  if(it.clip==='cross'){
    const fin=document.createElement('canvas');fin.width=canvas.width;fin.height=canvas.height;
    const fctx=fin.getContext('2d');
    fctx.clip(new Path2D(roundedPlusPath(CROSS_ART.a,CROSS_ART.b,CROSS_ART.r,fin.width,0,0).d));
    fctx.drawImage(canvas,0,0);
    return fin;
  }
  return canvas;
}
const canvasBlob=c=>new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('toBlob failed (page must be served over http/https, not file://)')),'image/png'));
async function dlOne(i,btn){const it=EXPORT[i];const t0=btn&&btn.textContent;if(btn){btn.textContent='…';btn.disabled=true;}
  try{const c=await canvasOf(it);const b=await canvasBlob(c);saveBlob(b,fname(it));if(btn)btn.textContent='✓ PNG';}
  catch(e){if(btn)btn.textContent='⬇ PNG';alert('PNG export failed:\n'+(e&&e.message||e));}
  finally{if(btn){btn.disabled=false;setTimeout(()=>{btn.textContent=t0;},1400);}}}
// FULL-SHEET PNG — rasterize one print sheet's ART (no cut overlay) at SHEET_DPI, so it can be placed without data
// loss and the cut lines exported separately as vector (the Cut layer + the sheet's 🖨 print). Rebuilds the sheet
// off-screen from its PAGES data (items only — no overlay, no buttons), bakes the art, and html2canvases it whole.
async function sheetPNG(no,btn){
  const pg=PAGES.find(p=>p.no===no);if(!pg)return;
  const t0=btn&&btn.textContent;if(btn){btn.textContent='rendering…';btn.disabled=true;}
  const geo=pg.geo||PG,scale=SHEET_DPI/96;
  const host=document.createElement('div');host.style.cssText='position:fixed;left:-99999px;top:0';
  const page=document.createElement('div');page.className='page'+(geo.w>11?' '+lgClass(geo.h):'');
  page.style.cssText='width:'+geo.w+'in;height:'+geo.h+'in;margin:0;box-shadow:none;background:#fff';
  page.innerHTML=pg.items.map(itDiv).join('');
  host.appendChild(page);document.body.appendChild(host);
  try{
    if(window.lucide)lucide.createIcons();
    await Promise.all([...page.querySelectorAll('img')].map(im=>(im.complete&&im.naturalWidth)?Promise.resolve()
      :new Promise(res=>{im.addEventListener('load',res,{once:true});im.addEventListener('error',res,{once:true});})));
    await new Promise(r=>setTimeout(r,40));
    bakeArt(page,scale);
    const W=page.offsetWidth,H=page.offsetHeight;
    const canvas=await html2canvas(page,{scale,backgroundColor:'#fff',useCORS:true,logging:false,width:W,height:H,windowWidth:W,windowHeight:H});
    const blob=await canvasBlob(canvas);saveBlob(blob,'sheet-S'+no+'-'+slug(pg.label).slice(0,40)+'.png');
    if(btn)btn.textContent='✓ PNG';
  }catch(e){if(btn)btn.textContent='⬇ art PNG';alert('Sheet PNG failed:\n'+(e&&e.message||e));}
  finally{document.body.removeChild(host);if(btn){btn.disabled=false;setTimeout(()=>{btn.textContent=t0;},1600);}}
}
async function dlType(type,btn){const list=EXPORT.filter(x=>x.type===type);const t0=btn&&btn.textContent;
  if(btn){btn.disabled=true;}
  try{const z=new JSZip();let n=0;
    for(const it of list){if(btn)btn.textContent='zipping '+(++n)+'/'+list.length+'…';
      const c=await canvasOf(it);z.file(fname(it),await canvasBlob(c));}
    const blob=await z.generateAsync({type:'blob'});saveBlob(blob,type+'-cards.zip');if(btn)btn.textContent='✓ '+type+'-cards.zip';}
  catch(e){alert('Zip export failed:\n'+(e&&e.message||e));}
  finally{if(btn){btn.disabled=false;setTimeout(()=>{btn.textContent=t0;},2000);}}}
function expHtml(){
  EXPORT=exportItems();
  const ready=(window.html2canvas&&window.JSZip);
  const types=[];EXPORT.forEach(it=>{if(!types.includes(it.type))types.push(it.type);});
  let h='<div class="exp-wrap"><div class="exp-head"><h2>'+LU('image')+' PNG Export</h2>'
    +'<p>Download any component as a PNG, or a whole type as a <b>.zip</b>. Files are named <code>type-name-front/back.png</code> at high resolution (×'+PNG_SCALE+', ≈384 dpi).'
    +(ready?'':' <b style="color:var(--red)">⚠ export libraries not loaded.</b>')
    +' <i>Tip: this must run on the live site (https) — a local <code>file://</code> open can’t save the images (browser security).</i></p></div>';
  types.forEach(t=>{
    const list=EXPORT.map((it,i)=>({it,i})).filter(x=>x.it.type===t);
    h+='<div class="exp-group"><div class="exp-gh"><span class="exp-gt">'+t+'</span><span class="exp-gc">'+list.length+' file'+(list.length>1?'s':'')+'</span>'
      +'<button class="exp-zip" onclick="dlType(\''+t+'\',this)">'+LU('folder-down')+' Download all (.zip)</button></div><div class="exp-grid">';
    list.forEach(x=>{const it=x.it;const S=Math.min(1.55/it.w,1.55/it.h);
      h+='<div class="exp-item"><div class="exp-thumb" style="width:'+(it.w*S).toFixed(3)+'in;height:'+(it.h*S).toFixed(3)+'in">'
        +'<div style="transform:scale('+S.toFixed(3)+');transform-origin:top left;width:'+it.w+'in;height:'+it.h+'in">'+it.html+'</div></div>'
        +'<button class="exp-dl" onclick="dlOne('+x.i+',this)">'+LU('download')+' PNG</button>'
        +'<div class="exp-fn">'+fname(it)+'</div></div>';});
    h+='</div></div>';});
  return h+'</div>';
}

// render one packed item: the .it box is the (scaled) footprint; the content renders at its NATIVE size inside a
// transform:scale wrapper so the whole piece shrinks uniformly (composes with any per-component transform). nat
// defaults to the footprint (scale 1) for unscaled items like the full-page checklist.
function itDiv(it){const nat=it.nat||[it.w,it.h];const sc=+(it.w/nat[0]).toFixed(5);
  const inner=(sc===1)?it.html
    :'<div class="sc" style="transform:scale('+sc+');transform-origin:top left;width:'+nat[0]+'in;height:'+nat[1]+'in">'+it.html+'</div>';
  return '<div class="it" style="left:'+it.x+'in;top:'+it.y+'in;width:'+it.w+'in;height:'+it.h+'in">'+inner+'</div>';}
// each 22-wide plotter sheet is trimmed to its own height → one .lgNN class + named @page per distinct height.
function lgClass(h){return 'lg'+String(+h).replace('.','_');}
function dynPageCss(pages){const seen={};let css='';
  pages.forEach(p=>{const g=p.geo||PG;if(g.w<=11)return;const c=lgClass(g.h);if(seen[c])return;seen[c]=1;
    css+='@page '+c+'{size:22in '+g.h+'in;margin:0}\n.page.'+c+'{width:22in;height:'+g.h+'in;page:'+c+'}\n';});
  return css;}
let PAGES=[];
function render(){
  if(VIEW==='png'){document.getElementById('out').innerHTML=expHtml();if(window.lucide)lucide.createIcons();return;}
  PAGES=buildPages();
  const dp=document.getElementById('dynpage');if(dp)dp.textContent=dynPageCss(PAGES);   // size each large sheet to its content
  const show=PAGES.filter(p=>VIEW==='all'||p.section===VIEW);
  let h='';
  show.forEach(pg=>{
    const G=pg.geo||PG;const cls=G.w>11?lgClass(G.h):'';   // large 22-wide sheets get their height's named @page; Letter geos stay default
    h+='<div class="page'+(cls?' '+cls:'')+'" id="pg'+pg.no+'">';
    pg.items.forEach(it=>{h+=itDiv(it);});
    h+=overlaySvg(pg);
    h+='<span class="dl no-print">'
      +'<button onclick="sheetPNG('+pg.no+',this)" title="rasterize this sheet’s ART (no cut lines) at '+SHEET_DPI+' DPI">⬇ S'+pg.no+' art PNG</button>'
      +'<button onclick="printOne('+pg.no+')" title="print this sheet as-is (current layer) to PDF">🖨 PDF</button>'
      +'<button onclick="printOne('+pg.no+',\'cut\')" title="print ONLY the cut lines as vector (Save as PDF)">✂ cuts</button>'
      +'</span>';
    h+='</div>';
  });
  document.getElementById('out').innerHTML=h||'<p style="text-align:center;padding:2em">no sheets in this view</p>';
  if(window.lucide)lucide.createIcons();
}
// Export = the browser's own print engine (vector-perfect PDF; "Save as PDF" in the dialog).
// printOne solos a sheet so each sheet can be saved as its own one-page PDF for Affinity placement.
function printOne(no,forceLayer){
  const el=document.getElementById('pg'+no);if(!el)return;
  const b=document.body, hadCut=b.classList.contains('cut'), hadBoth=b.classList.contains('both');
  if(forceLayer){b.classList.toggle('cut',forceLayer==='cut');b.classList.toggle('both',forceLayer==='both');}
  b.classList.add('solo');el.classList.add('soloed');
  const done=()=>{b.classList.remove('solo');el.classList.remove('soloed');
    if(forceLayer){b.classList.toggle('cut',hadCut);b.classList.toggle('both',hadBoth);}   // restore the on-screen layer
    window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);
  window.print();
  setTimeout(done,500);   // fallback for browsers that don't fire afterprint
}
if(window.HNAV)HNAV.mount('#hnav','print');
render();
</script>
