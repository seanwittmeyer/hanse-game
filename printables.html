<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brewhouses of the Hanse — Print &amp; Play (Letter landscape)</title>
<style>
  :root{--ink:#2b2018;--ink2:#5b4a37;--parch:#f3e9d2;--parch2:#e9dcc0;--line:#333;--gold:#b8860b;
    --sea:#274b5c;--green:#4a6b3a;--red:#7c2128;--violet:#5b3a8e;--vp:#b8860b;}
  *{box-sizing:border-box}
  body{margin:0;background:#e7e2d6;color:var(--ink);font-family:"Iowan Old Style",Georgia,serif}
  .bar{position:sticky;top:0;z-index:10;background:var(--ink);color:var(--parch);padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .bar h1{font-size:1.05rem;margin:0;font-variant:small-caps;letter-spacing:.5px}
  .bar a{color:var(--gold);text-decoration:none;font-size:.85rem}
  .bar button{font-family:inherit;cursor:pointer;border:none;border-radius:6px;padding:6px 13px;font-weight:bold;background:var(--gold);color:var(--ink)}
  .bar .seg{display:inline-flex;border:1px solid var(--gold);border-radius:6px;overflow:hidden}
  .bar .seg button{border-radius:0;background:transparent;color:var(--parch);font-weight:normal}
  .bar .seg button.on{background:var(--gold);color:var(--ink)}
  .note{font-size:.78rem;opacity:.85}
  /* PAGE = US Letter, LANDSCAPE (11in × 8.5in). Printable ≈ 10.4 × 7.9in. */
  @media print{ @page{size:letter landscape;margin:.3in} }
  .page{width:10.4in;background:#fff;margin:14px auto;padding:.18in;box-shadow:0 3px 14px rgba(0,0,0,.25);position:relative}
  .page.fixed{height:7.9in;break-after:page}
  .calib{display:flex;align-items:center;gap:10px;margin-bottom:.1in;font-size:.12in}
  .calib .box{width:1in;height:1in;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:.1in;color:#666;flex:0 0 auto}
  .famlabel{width:100%;font-variant:small-caps;font-weight:bold;font-size:.17in;color:var(--ink);border-bottom:1px solid var(--gold);margin:.13in 0 .06in;letter-spacing:.4px;break-after:avoid}
  .famlabel .sm{font-variant:normal;font-weight:normal;font-style:italic;font-size:.1in;color:var(--ink2)}
  .grid{display:flex;flex-wrap:wrap;gap:0}
  /* ---- TILES — 1.25in cut size; colour bleeds to the edge; a 1/8in inner SAFE FRAME + padding ---- */
  .tile{width:1.25in;height:1.25in;border:.3pt solid var(--line);background:var(--c,#777);color:#fff;
    position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:.096in;overflow:hidden;
    text-shadow:0 1px 1.5px rgba(0,0,0,.5);break-inside:avoid}
  .tile .ic{width:1em;height:1em;vertical-align:-.15em} .tile svg{stroke-width:2}
  /* card-corner QUALITY = a gem icon + the number (no "Q"; we know the number is quality) */
  .q{position:absolute;top:.06in;left:.08in;display:flex;align-items:center;gap:.02in;font-weight:900;font-size:.34in;line-height:1}
  .q svg,.q .ic{width:.2in;height:.2in;stroke-width:2.2}
  /* title sits just below the quality value, top-left */
  .t-nm{position:absolute;top:.46in;left:.1in;max-width:1.05in;text-align:left;font-variant:small-caps;font-weight:bold;font-size:.155in;line-height:1.05}
  .t-act{font-size:.1in;line-height:1.12;background:rgba(0,0,0,.24);border-radius:.04in;padding:.025in .04in;margin-bottom:.03in;display:flex;align-items:center;gap:.03in}
  .t-act svg,.t-act .ic{width:.13in;height:.13in;flex:0 0 auto}
  .t-act .ac{display:inline-flex;align-items:center;justify-content:center;width:.22in;height:.22in;border-radius:50%;background:rgba(255,255,255,.92);flex:0 0 auto}
  .t-act .ac svg,.t-act .ac .ic{width:.12in;height:.12in;stroke-width:2.1;color:#23201c}
  .t-cost{font-size:.12in;font-weight:bold;display:flex;align-items:center;gap:.06in;line-height:1}
  .t-cost .gc{display:inline-flex;align-items:center;gap:.01in}
  .t-cost svg,.t-cost .ic{width:.15in;height:.15in}
  .g{color:#ffe08a} .h{color:#c4e69c}
  /* shared COST chip — same icon + number size everywhere cost() is used (casks, ships, upgrades, recipes) */
  .gc{display:inline-flex;align-items:center;gap:.02in;font-size:.12in;font-weight:bold}
  .gc svg,.gc .ic{width:.15in;height:.15in;flex:0 0 auto}
  .tile.gen{justify-content:flex-start;text-shadow:0 1px 1px rgba(0,0,0,.4)}
  .gen .g-head{display:flex;align-items:center;gap:.06in;font-variant:small-caps;font-weight:bold;font-size:.125in;line-height:1.02;min-width:0}
  .gen .g-head .bigic{flex:0 0 auto}
  .gen .g-head .bigic svg,.gen .g-head .bigic .ic{width:.27in;height:.27in;stroke-width:1.7}
  .gen .g-head .g-nm{min-width:0;overflow-wrap:break-word;hyphens:auto}
  .gen .g-sub{font-size:.108in;line-height:1.2;margin-top:.05in;opacity:.97}
  .gen .g-big{position:absolute;bottom:.072in;right:.096in;font-weight:900;font-size:.46in;line-height:.8;opacity:.92}
  .gen .g-cost{position:absolute;bottom:.078in;left:.096in}
  /* neutral + upgrade layout: icon on its own line in the TOP-RIGHT, title beneath */
  .gen.tn .g-head, .gen.tu .g-head{flex-direction:column;align-items:flex-end;text-align:right;gap:.05in}
  /* neutral bonus pinned to the bottom */
  .gen.tn .g-sub{position:absolute;left:.096in;right:.096in;bottom:.084in;margin-top:0}
  /* upgrade bonus in a rounded rectangle (matching the cask action chip) */
  .gen .g-act{background:rgba(0,0,0,.22);border-radius:.04in;padding:.04in .055in;font-size:.105in;line-height:1.16;margin-top:.06in;align-self:stretch}
  /* goal tile: title top-left, condition below, icon in the bottom-right corner */
  .gen.tg .g-head .bigic{position:absolute;right:.1in;bottom:.08in}
  .gen.tg .g-head .bigic svg,.gen.tg .g-head .bigic .ic{width:.34in;height:.34in;opacity:.9}
  /* ---- goods TOKENS — laser-cut circle (.7in) printed with a 1/8in BLEED ring (.95in art disc) ---- */
  .tok{width:.95in;height:.95in;border-radius:50%;background:var(--c);color:#fff;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.1in;text-shadow:0 1px 1px rgba(0,0,0,.4);break-inside:avoid}
  .tok::after{content:"";position:absolute;inset:.125in;border:.8pt solid rgba(255,255,255,.75);border-radius:50%}
  .tok svg{width:.26in;height:.26in}
  .tile.blank{background:#fff;color:#9a9a9a;border-color:#bdbdbd;text-shadow:none} .tile.blank::after{border-color:#d8d8d8}
  .tok.blank{background:#fff;color:#bbb;text-shadow:none} .tok.blank::after{border-color:#cfcfcf}
  /* registration marks (backs blank) */
  .regmark{position:absolute;width:.26in;height:.26in;pointer-events:none;z-index:3}
  .regmark::before,.regmark::after{content:"";position:absolute;background:#000}
  .regmark::before{left:50%;top:0;width:.6pt;height:100%;transform:translateX(-50%)}
  .regmark::after{top:50%;left:0;height:.6pt;width:100%;transform:translateY(-50%)}
  .rm-tl{top:.03in;left:.03in}.rm-tr{top:.03in;right:.03in}.rm-bl{bottom:.03in;left:.03in}.rm-br{bottom:.03in;right:.03in}
  .page.backs .grid{transform:scaleX(-1)} .page.backs .tile,.page.backs .tok{transform:scaleX(-1)}
  /* ---- RECIPE CARDS (recipes are CARDS now — they slide into the board's tuck strip) ---- */
  .card{width:1.85in;height:2.55in;border:1px solid var(--line);border-radius:.08in;background:#f7efdc;color:var(--ink);
    position:relative;padding:0;display:flex;flex-direction:column;break-inside:avoid;overflow:hidden}
  .card .c-reach{padding:.07in .14in 0;font-size:.092in;font-style:italic;color:var(--ink2);text-align:center;line-height:1.15}
  /* acquire bonus — centered rounded rectangle (same treatment as the cask/upgrade action chips) */
  .card .c-bonus{flex:1;margin:.06in .14in;display:flex;align-items:center;justify-content:center;gap:.05in;
    background:rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.14);border-radius:.06in;padding:.06in .1in;
    font-size:.1in;line-height:1.2;text-align:center}
  .card .c-bonus svg,.card .c-bonus .ic{width:.2in;height:.2in;flex:0 0 auto}
  /* title + cost strip — the visible edge when the card is tucked up under the board */
  .card .c-strip{background:var(--cc,#8a6408);color:#fff;display:flex;align-items:center;gap:.07in;flex-wrap:wrap;
    padding:.08in .12in;font-variant:small-caps;font-weight:bold;font-size:.15in;line-height:1;
    text-shadow:0 1px 1.5px rgba(0,0,0,.45)}
  .card .c-strip svg,.card .c-strip .ic{width:.15in;height:.15in;flex:0 0 auto}
  /* L# rung badge — high-contrast box so the tier survives on the tucked edge */
  .card .c-strip .c-rung{flex:0 0 auto;display:inline-flex;align-items:center;gap:.015in;font-variant:normal;
    background:rgba(255,255,255,.92);color:var(--cc);border-radius:.04in;padding:.025in .05in;font-size:.115in;text-shadow:none}
  .card .c-strip .c-rung svg,.card .c-strip .c-rung .ic{width:.13in;height:.13in}
  /* name always prints in full — if the strip is tight the cost wraps to a second line rather than the name clipping */
  .card .c-strip .c-nm{flex:1 1 auto;white-space:nowrap}
  /* cost block is protected (never clipped); numerals dominate the icons */
  .card .c-strip .c-cost{flex:0 0 auto;font-variant:normal;font-weight:bold;font-size:.135in;display:inline-flex;align-items:center;gap:.06in}
  .card .c-strip .c-cost .gc{font-size:.135in;gap:.015in}
  .card .c-strip .c-cost .gc svg,.card .c-strip .c-cost .gc .ic{width:.135in;height:.135in}
  .card .c-strip .c-gate{display:inline-flex} .card .c-strip .c-gate svg,.card .c-strip .c-gate .ic{width:.13in;height:.13in}
  /* ====================== PLAYER BOARD (landscape) ====================== */
  .board{--pc:#7c2128;height:7.54in;background:var(--parch);color:var(--ink);border:2.5px solid var(--pc);
    border-radius:.12in;padding:.16in;display:flex;flex-direction:column;gap:.1in}
  .board svg,.board .ic{stroke-width:1.8}
  .pb-head{display:flex;align-items:stretch;gap:.16in}
  .crest{width:.8in;flex:0 0 auto;border-radius:.08in;background:var(--pc);color:#fff;display:flex;align-items:center;justify-content:center}
  .crest svg,.crest .ic{width:.48in;height:.48in}
  .pb-title{flex:1;display:flex;flex-direction:column;justify-content:center}
  .pb-name{font-variant:small-caps;font-weight:bold;font-size:.26in;color:var(--pc);line-height:1}
  .pb-sub{font-size:.105in;color:var(--ink2);font-style:italic}
  .pb-storage{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;gap:.05in}
  .pb-lbl{font-variant:small-caps;font-weight:bold;font-size:.115in;color:var(--pc);display:flex;align-items:center;gap:.05in}
  .pb-lbl .sm{font-variant:normal;font-weight:normal;font-style:italic;font-size:.088in;color:var(--ink2)}
  .boxrow{display:flex;gap:.04in;flex-wrap:wrap;max-width:3.2in}
  .gbox{width:.32in;height:.32in;border:1.2px solid var(--pc);border-radius:.03in;background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;color:var(--pc)}
  .gbox svg,.gbox .ic{width:.15in;height:.15in;opacity:.45}
  .pb-body{flex:1;display:flex;gap:.16in;min-height:0}
  .pb-col{display:flex;flex-direction:column;gap:.08in} .pb-col.left{flex:0 0 5.35in} .pb-col.right{flex:1}
  .pb-sect{font-variant:small-caps;font-weight:bold;font-size:.12in;color:var(--pc);border-bottom:1px solid var(--pc);padding-bottom:.02in;margin-bottom:.04in;display:flex;align-items:center;gap:.05in}
  .pb-sect svg,.pb-sect .ic{width:.15in;height:.15in}
  .pb-sect .hint{font-variant:normal;font-weight:normal;font-style:italic;font-size:.088in;color:var(--ink2);margin-left:auto}
  .vessel{display:flex;align-items:center;gap:.1in;margin-bottom:.07in}
  .vtag{flex:0 0 .7in;font-variant:small-caps;font-weight:bold;font-size:.1in;color:var(--pc);line-height:1.05}
  .vslot{width:1.2in;height:1.2in;flex:0 0 auto;border:1.5px solid var(--pc);border-radius:.05in;background:rgba(255,255,255,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--pc);font-size:.092in;text-align:center;gap:.02in}
  .vslot svg,.vslot .ic{width:.26in;height:.26in;opacity:.5}
  .vtrack{flex:1;display:flex;align-items:center;gap:.05in}
  .vstep{flex:1;height:.5in;border:1.3px solid var(--pc);border-radius:.04in;background:rgba(255,255,255,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:.082in;color:var(--ink2);line-height:1;position:relative}
  .vstep .sn{font-variant:small-caps;font-weight:bold;font-size:.092in;color:var(--ink)}
  .vstep.age{background:rgba(184,134,11,.18)} .vstep.ready{background:rgba(74,107,58,.2)}
  .vstep .arr{position:absolute;right:-.07in;top:50%;transform:translateY(-50%);color:var(--pc);font-weight:bold;font-size:.13in;z-index:2}
  .vessel.locked .vslot,.vessel.locked .vstep{border-style:dashed;color:rgba(0,0,0,.32);background:repeating-linear-gradient(45deg,rgba(0,0,0,.05) 0 .08in,transparent .08in .16in)}
  .vessel.locked .vtag::after{content:" — needs Extra Vessel";font-variant:normal;font-weight:normal;font-style:italic;font-size:.08in;color:var(--ink2)}
  .strip{display:flex;gap:.08in;flex-wrap:wrap}
  .pslot{width:1.2in;height:1.2in;border:1.4px dashed var(--pc);border-radius:.05in;background:rgba(255,255,255,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--pc);font-size:.09in;text-align:center;gap:.02in}
  .pslot svg,.pslot .ic{width:.26in;height:.26in;opacity:.55}
  .pslot.best{border-style:solid;background:rgba(184,134,11,.2);font-weight:bold}
  /* recipe tuck strip at the board's bottom edge — cards slide UP into these */
  .tuck{margin:.04in -.16in -.16in;padding:.06in .16in .04in;border-top:1.5px dashed var(--pc);background:repeating-linear-gradient(90deg,rgba(0,0,0,.02) 0 1.2in,transparent 1.2in 2.4in)}
  .tuck-h{font-variant:small-caps;font-weight:bold;font-size:.11in;color:var(--pc);display:flex;align-items:center;gap:.05in;margin-bottom:.04in}
  .tuck-h svg,.tuck-h .ic{width:.14in;height:.14in} .tuck-h .sm{font-variant:normal;font-weight:normal;font-style:italic;font-size:.085in;color:var(--ink2);margin-left:auto}
  .tuckrow{display:flex;gap:.1in}
  .tslot{flex:1;min-width:1.1in;height:.5in;border:1.3px solid var(--pc);border-bottom:none;border-radius:.06in .06in 0 0;background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;gap:.04in;color:var(--pc);font-size:.092in;text-align:center}
  .tslot svg,.tslot .ic{width:.16in;height:.16in;opacity:.6}
  .tslot.printed{background:var(--pc);color:#fff} .tslot.printed svg,.tslot.printed .ic{opacity:.95}
  /* ====================== DESTINATIONS BOARD ====================== */
  .dboard{height:7.54in;background:var(--parch);border:2.5px solid var(--gold);border-radius:.12in;padding:.16in;display:flex;flex-direction:column;gap:.1in;color:var(--ink)}
  .dboard svg,.dboard .ic{stroke-width:1.8}
  .db-head{display:flex;align-items:baseline;gap:.16in;border-bottom:2px solid var(--gold);padding-bottom:.05in}
  .db-head h2{margin:0;font-variant:small-caps;color:var(--red);font-size:.28in;letter-spacing:.5px;display:flex;align-items:center;gap:.06in}
  .db-head h2 svg,.db-head h2 .ic{width:.26in;height:.26in}
  .db-head .legend{font-size:.092in;color:var(--ink2);margin-left:auto;display:flex;gap:.14in;align-items:center}
  .db-head .legend b{color:var(--ink)} .db-head .legend svg,.db-head .legend .ic{width:.14in;height:.14in;vertical-align:-.02in}
  .vp{color:var(--vp)} .ql{color:var(--ink)}
  .kontor-row{display:flex;gap:.1in;flex:1;min-height:0}
  .kpanel{flex:1;border:2px solid var(--kc);border-radius:.1in;background:#fff;display:flex;flex-direction:column;overflow:hidden;color:var(--ink)}
  /* clean full-width TITLE BAR (fixes the half-ribbon look) */
  .ktitle{background:var(--kc);color:#fff;padding:.06in .1in;display:flex;justify-content:space-between;align-items:center}
  .kname{font-variant:small-caps;font-weight:bold;font-size:.16in;display:flex;align-items:center;gap:.04in;line-height:1}
  .kname svg,.kname .ic{width:.18in;height:.18in}
  .kreq{font-size:.11in;font-weight:bold;background:rgba(255,255,255,.22);border-radius:.04in;padding:.01in .06in;display:flex;align-items:center;gap:.03in}
  .kreq svg,.kreq .ic{width:.13in;height:.13in}
  .kbody{flex:1;display:flex;flex-direction:column;gap:.05in;padding:.08in .1in}
  .krole{font-size:.088in;font-style:italic;color:var(--ink2);line-height:1.05;min-height:.18in}
  .kval{text-align:center;font-weight:900;color:var(--kc);font-size:.4in;line-height:.95;display:flex;align-items:center;justify-content:center;gap:.04in}
  .kval svg,.kval .ic{width:.26in;height:.26in;color:var(--vp);stroke-width:2.4}
  .kval .per{display:block;font-size:.085in;font-weight:bold;color:var(--ink2);font-variant:small-caps}
  .kben{font-size:.092in;line-height:1.1;display:flex;align-items:center;gap:.03in;background:rgba(0,0,0,.04);border-radius:.04in;padding:.025in .04in}
  .kben svg,.kben .ic{width:.13in;height:.13in;flex:0 0 auto;color:var(--kc)}
  .kmaj{font-size:.092in;display:flex;align-items:center;justify-content:space-between;color:var(--ink2)}
  .kmaj b{color:var(--kc);display:inline-flex;align-items:center;gap:.02in} .kmaj svg,.kmaj .ic{width:.12in;height:.12in;color:var(--vp)}
  .kslot{align-self:center;width:1.05in;height:1.05in;border:1.5px dashed var(--kc);border-radius:.06in;background:rgba(0,0,0,.03);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--kc);font-size:.082in;text-align:center;gap:.02in;line-height:1.05}
  .kslot svg,.kslot .ic{width:.24in;height:.24in;opacity:.5}
  .ptrack{display:flex;border:1px solid var(--kc);border-radius:.04in;overflow:hidden;margin-top:auto}
  .ptrack .pc{flex:1;min-width:.2in;height:.28in;border-right:1px solid rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;font-size:.082in;color:var(--ink2);background:rgba(255,255,255,.5)}
  .ptrack .pc:last-child{border-right:none} .ptrack .pc.z{background:rgba(0,0,0,.08);font-weight:bold}
  .ptrack-l{font-size:.08in;font-style:italic;color:var(--ink2);margin-top:.02in;text-align:center;display:flex;align-items:center;justify-content:center;gap:.03in}
  .ptrack-l svg,.ptrack-l .ic{width:.1in;height:.1in}
  .db-bottom{display:flex;flex-direction:column;gap:.12in}
  .sbox{border:2px solid var(--gold);border-radius:.1in;background:#fff;padding:.08in;display:flex;flex-direction:column;gap:.05in}
  .sbox.disp,.sbox.clock{flex:0 0 auto}
  .sb-h{font-variant:small-caps;font-weight:bold;color:var(--red);font-size:.13in;display:flex;align-items:center;gap:.05in;border-bottom:1px solid var(--gold);padding-bottom:.02in}
  .sb-h svg,.sb-h .ic{width:.15in;height:.15in} .sb-h .sm{font-variant:normal;font-weight:normal;font-style:italic;font-size:.082in;color:var(--ink2);margin-left:auto}
  .uprow{display:flex;gap:.109in;flex-wrap:wrap}
  .uslot{flex:0 0 auto;width:1.25in;height:1.25in;border:1.5px solid var(--gold);border-radius:.05in;background:rgba(184,134,11,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.03in;color:#8a6408;font-size:.092in;text-align:center}
  .uslot svg,.uslot .ic{width:.28in;height:.28in;opacity:.6}
  .uslot.supply{border-style:dashed;background:repeating-linear-gradient(45deg,rgba(0,0,0,.04) 0 .08in,transparent .08in .16in)}
  .uslot.supply.faceup{border-style:solid;background:rgba(184,134,11,.08)}
  .ctrack{display:flex;height:.64in;border:1.5px solid var(--sea);border-radius:.05in;overflow:hidden}
  .cc{flex:1;min-width:0;border-right:1px solid rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.085in;color:var(--ink2);background:rgba(255,255,255,.4)}
  .cc:last-child{border-right:none} .cc .n{font-size:.075in;color:#aaa}
  .cc.end{background:var(--sea);color:#fff;font-weight:bold;font-size:.08in;text-align:center;line-height:1}
  @media print{.no-print{display:none} body{background:#fff} .page{margin:0;box-shadow:none}}
</style>
</head>
<body>
<div class="bar no-print">
  <h1>Brewhouses of the Hanse — Print &amp; Play</h1>
  <button onclick="window.print()">🖨 Print</button>
  <span class="seg"><button id="vtiles" class="on" onclick="setView('tiles')">Tiles</button><button id="vcards" onclick="setView('cards')">Recipe Cards</button><button id="vboards" onclick="setView('boards')">Player Boards</button><button id="vdest" onclick="setView('dest')">Destinations</button></span>
  <span class="seg tilectrl"><button id="bproof" class="on" onclick="setMode('proof')">Proof (1 each)</button><button id="bfull" onclick="setMode('full')">Full set</button></span>
  <span class="seg tilectrl"><button id="sfront" class="on" onclick="setSide('front')">Fronts</button><button id="sback" onclick="setSide('back')">Backs (blank)</button></span>
  <span class="note">Laid out for <b>US Letter · LANDSCAPE</b>, print at <b>100%</b> (check the 1-inch box). Colour <b>bleeds 1/8″</b> past the inner frame — straight-cut tiles on the frame, laser-cut tokens inside the dashed circle. <b>Backs blank</b> (single-face).</span>
  <span style="margin-left:auto"><a href="learn.html">Learn</a> · <a href="index.html">Rulebook &amp; Components</a> · <a href="play.html">Play</a></span>
</div>
<div id="out"></div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
const LU=(n,cls)=>'<i data-lucide="'+n+'"'+(cls?' class="'+cls+'"':' class="ic"')+'></i>';
const cnt=n=>MODE==='proof'?1:n;
const cost=(g,h)=>{let a=[];if(g)a.push('<span class="gc">'+LU('wheat','g')+g+'</span>');if(h)a.push('<span class="gc">'+LU('sprout','h')+h+'</span>');return a.join('');};
const QI='beer', VP='star';  // quality icon (a beer = its quality/level) · victory-point icon

const CASKS=[
  {nm:'Gruit',  c:'#8a949c', q:1, g:1,h:0,      ai:'store',     act:'+2 goods',     n:16},
  {nm:'Hopped', c:'#c2922f', q:2, g:1,h:1,      ai:'hourglass', act:'Age a cask +2',   n:20},
  {nm:'Export', c:'#b06a34', q:3, g:1,h:2,      ai:'ship',      act:'free Load',       n:12},
  {nm:'Export', c:'#caa12a', q:4, g:2,h:2,      ai:'map-pin',   act:'+1 presence',     n:8},
  {nm:'Export', c:'#7c2128', q:5, g:3,h:2, cellar:true, ai:'sparkles',  act:'any action', n:4},
];
const FAMS=[
 {label:'Ships — owned single-use carriers', sm:'built to a destination · full → sail → Sailed-Ships track · (Charter = 1 cask for 2 G, no tile)', items:[
   {ic:'sailboat',nm:'Cog',  big:'2', cost:cost(2,0), c:'#2f5566', n:8},
   {ic:'sailboat',nm:'Hulk', big:'3', cost:cost(3,0), c:'#1f3e4a', n:5},
 ]},
 {label:'Neutral Buildings — shared base actions', sm:'2 seeded on the slots at setup (random)', cls:'tn', items:[
   {ic:'store',     nm:'Market Stall', sub:'take 1 good',           c:'#5b4a37', n:1},
   {ic:'hammer',    nm:'Cooper',       sub:'age a cask 1 step', c:'#4a4034', n:1},
   {ic:'package-plus', nm:'Crane',        sub:'free load onto a ship', c:'#5b4a37', n:1},
   {ic:'arrow-left-right', nm:'Counting House', sub:'convert up to 2 goods', c:'#4a4034', n:1},
   {ic:'megaphone', nm:'Towncrier',    sub:'draw a goal',           c:'#5b4a37', n:1},
   {ic:'heart',     nm:'Almshouse',    sub:'+1 at a kontor you lead', c:'#4a4034', n:1},
 ]},
 {label:'Upgrades · Rooms — permanent capability', sm:'in the face-up Market display · buy, or earn free by delivering', cls:'tu', items:[
   {ic:'wrench',nm:'Extra Vessel', act:'+1 vessel',                       cost:cost(5,0), c:'#4a6b3a', n:3},
   {ic:'wrench',nm:'Aging Cellar', act:'mature 1 step faster · unlock L5', cost:cost(5,0), c:'#3f5c30', n:2},
   {ic:'wrench',nm:'Warehouse',    act:'+4 storage',                      cost:cost(4,0), c:'#4a6b3a', n:2},
   {ic:'wrench',nm:'Quay',         act:'load 2 casks per Harbor',         cost:cost(5,0), c:'#3f5c30', n:2},
   {ic:'wrench',nm:'Cooperage',    act:'+1 cask loaded per Harbor',       cost:cost(4,0), c:'#4a6b3a', n:2},
 ]},
 {label:'Upgrades · Modifiers — asymmetric perks', sm:'in the same Market display', cls:'tu', items:[
   {ic:'badge-plus',nm:'Granary Right', act:'+1 '+LU('wheat','g ic'),              cost:cost(4,0), c:'#6e4ea0', n:2},
   {ic:'badge-plus',nm:'Hop Garden',    act:'+1 '+LU('sprout','h ic'),             cost:cost(4,0), c:'#5a3f86', n:2},
   {ic:'badge-plus',nm:'Royal Patent',  act:'+1 '+LU('sailboat','ic')+' capacity', cost:cost(5,0), c:'#6e4ea0', n:2},
   {ic:'badge-plus',nm:'Staple Right',  act:'+1 '+LU('wheat','g ic')+' / kontor',  cost:cost(5,0), c:'#5a3f86', n:2},
   {ic:'badge-plus',nm:'Guild Seat',    act:'age +1',                              cost:cost(4,0), c:'#6e4ea0', n:2},
   {ic:'badge-plus',nm:'Burgher Status',act:'+1 '+LU('map-pin','ic')+' / kontor',  cost:cost(5,0), c:'#5a3f86', n:2},
 ]},
 {label:'Goal Tiles — the variety layer', sm:'deal 3 per player · your best 2 score', cls:'tg', items:[
   {ic:'target',nm:'Variety',  sub:'+2 / distinct type',  c:'#7c2128', n:1},
   {ic:'target',nm:'Focus',    sub:'+2 / cask, 1 kontor', c:'#7c2128', n:1},
   {ic:'target',nm:'Export',   sub:'+2 / Q3+ delivered',  c:'#7c2128', n:1},
   {ic:'target',nm:'Merchant', sub:'+3 / ship sailed',    c:'#7c2128', n:1},
   {ic:'target',nm:'Prestige', sub:'+3 / cask to Hall',   c:'#7c2128', n:1},
   {ic:'target',nm:'Spread',   sub:'+3 / kontor held',    c:'#7c2128', n:1},
   {ic:'target',nm:'Engine',   sub:'+2 / Upgrade',        c:'#7c2128', n:1},
   {ic:'target',nm:'Commit',   sub:'+4 / majority',       c:'#7c2128', n:1},
   {ic:'target',nm:'Steady',   sub:'+6 flat',             c:'#7c2128', n:1},
 ]},
];
const GOODS=[{ic:'wheat',nm:'Grain',c:'#9c7414',n:30},{ic:'sprout',nm:'Hops',c:'#5d7d34',n:24}];
const RECIPES=[
  {nm:'Hopped',  cc:'#7a5606', L:2, g:1,h:1, reach:'L2 · London · Bergen · Hall', start:true},
  {nm:'Broyhan', cc:'#946d09', L:3, g:1,h:2, reach:'L3 · adds Novgorod'},
  {nm:'Keut',    cc:'#9c7209', L:3, g:2,h:1, reach:'L3 · adds Novgorod'},
  {nm:'Mumme',   cc:'#9a5526', L:4, g:2,h:2, reach:'L4 · all kontore + Hall'},
  {nm:'Bock',    cc:'#7c2128', L:5, g:3,h:2, cellar:true, reach:'L5 · all · needs Aging Cellar'},
];
const PLAYERS=[{nm:'Crimson',c:'#7c2128'},{nm:'Azure',c:'#274b5c'},{nm:'Forest',c:'#4a6b3a'},{nm:'Amber',c:'#b8860b'},{nm:'Violet',c:'#5b3a8e'}];
const DESTS=[
  {nm:'Bruges',  kc:'#274b5c', req:1, val:'+2', maj:'2',      role:'The Hub — takes any beer (volume on-ramp)', ben:'gain 2 goods'},
  {nm:'London',  kc:'#b8860b', req:2, val:'+3', maj:'2',      role:'The Steelyard — the engine destination',     ben:'take 1 Upgrade from the display'},
  {nm:'Bergen',  kc:'#4a6b3a', req:2, val:'+3', maj:'10/6/3', role:'The Monopoly — the richest majority',        ben:'no upgrade — the majority is the draw'},
  {nm:'Novgorod',kc:'#7c2128', req:3, val:'+5', maj:'3',      role:'The Long Haul — premium only, top value',     ben:'take 1 Upgrade from the display'},
];
const HALL={nm:'The Hall', kc:'#5b3a8e', req:2, role:'Prestige — out of commerce (scarcity)', ben:'banks prestige ∝ quality'};
const SAILED={2:7,3:11,4:15,5:19};

let MODE='proof', SIDE='front', VIEW='tiles';
function setMode(m){MODE=m;document.getElementById('bproof').classList.toggle('on',m==='proof');document.getElementById('bfull').classList.toggle('on',m==='full');render();}
function setSide(s){SIDE=s;document.getElementById('sfront').classList.toggle('on',s==='front');document.getElementById('sback').classList.toggle('on',s==='back');render();}
function setView(v){VIEW=v;['tiles','cards','boards','dest'].forEach(x=>document.getElementById('v'+x).classList.toggle('on',v===x));
  document.querySelectorAll('.tilectrl').forEach(e=>e.style.display=v==='tiles'?'':'none');render();}

const REG='<div class="regmark rm-tl"></div><div class="regmark rm-tr"></div><div class="regmark rm-bl"></div><div class="regmark rm-br"></div>';
function caskTile(d){return '<div class="tile" style="--c:'+d.c+'">'
  +'<div class="q">'+LU(QI)+d.q+'</div>'
  +'<div class="t-nm">'+d.nm+'</div>'
  +'<div class="t-act"><span class="ac">'+LU(d.ai)+'</span><span>'+d.act+'</span></div></div>';}
function genTile(it,fcls){return '<div class="tile gen '+(fcls||'')+'" style="--c:'+it.c+'">'
  +'<div class="g-head"><span class="bigic">'+LU(it.ic)+'</span><span class="g-nm">'+it.nm+'</span></div>'
  +(it.act?'<div class="g-act">'+it.act+'</div>':'')
  +(it.sub?'<div class="g-sub">'+it.sub+'</div>':'')
  +(it.big?'<div class="g-big">'+it.big+'</div>':'')
  +(it.cost?'<div class="g-cost">'+it.cost+'</div>':'')+'</div>';}
function tok(d){return '<div class="tok" style="--c:'+d.c+'">'+LU(d.ic)+'</div>';}
const blankTile='<div class="tile blank"></div>', blankTok='<div class="tok blank"></div>';

function renderTiles(){const back=SIDE==='back';
  let h='<div class="page'+(back?' backs':'')+'">'+REG;
  h+='<div class="calib"><div class="box">1 inch<br>100%</div><span class="note" style="color:#555">'
    +(back?'<b>BACKS</b> blank (single-face). Corner ✛ register a duplex pass.':'Verify exactly 1 inch. Colour bleeds to the edge; cut on the inner frame.')+'</span></div>';
  h+='<div class="famlabel">Cask Tiles — the dual-role hero <span class="sm">the big corner is the cask\'s QUALITY ('+LU(QI)+' = its level; gates destinations, and ×2 prestige at the Hall) · '+LU('zap')+' signature slot action · L3–L5 are the EXPORT beers (fixed quality: Broyhan/Keut Q3 · Mumme Q4 · Bock Q5 — 3 of 4 dealt each game)</span></div><div class="grid">';
  CASKS.forEach(d=>{for(let i=0;i<cnt(d.n);i++)h+= back?blankTile:caskTile(d);}); h+='</div>';
  FAMS.forEach(f=>{h+='<div class="famlabel">'+f.label+(f.sm?' <span class="sm">'+f.sm+'</span>':'')+'</div><div class="grid">';
    f.items.forEach(it=>{for(let i=0;i<cnt(it.n);i++)h+= back?blankTile:genTile(it,f.cls);});h+='</div>';});
  h+='<div class="famlabel">Goods Tokens <span class="sm">Grain / Hops — laser-cut on the dashed circle; the colour ring outside it is bleed (or just use wooden cubes)</span></div><div class="grid">';
  GOODS.forEach(d=>{for(let i=0;i<cnt(d.n);i++)h+= back?blankTok:tok(d);}); h+='</div></div>';
  return h;}

function recipeCard(r){return '<div class="card" style="--cc:'+r.cc+'">'
  +'<div class="c-reach">'+(r.start?'<b>start recipe</b> · ':'')+'reaches: '+r.reach+'</div>'
  +'<div class="c-bonus">'+LU('gift')+'<span>acquire bonus — <b>dual-purpose (TBD)</b></span></div>'
  +'<div class="c-strip"><span class="c-rung">'+LU(QI)+r.L+'</span>'
  +'<span class="c-nm">'+r.nm+'</span>'
  +'<span class="c-cost">'+cost(r.g,r.h)+(r.cellar?'<span class="c-gate" title="needs Aging Cellar">'+LU('lock')+'</span>':'')+'</span></div>'
  +'</div>';}
function renderCards(){let h='<div class="page">'
  +'<div class="famlabel">Recipe Cards <span class="sm">portrait cards — slide them up into the tuck strip under your player board (title + cost stay visible on the edge). Start with Gruit (printed) + Hopped; collect the export beers — Broyhan/Keut (Q3) · Mumme (Q4) · Bock (Q5) — to climb. Print all four; only 3 of the 4 are dealt into any game.'+(MODE==='proof'?'(proof: one set shown — full mode prints a complete set per player.)':'one complete set per player ('+PLAYERS.length+' total).')+' (Acquire bonus is dual-purpose, TBD.)</span></div>';
  const sets=MODE==='proof'?1:PLAYERS.length;
  for(let s=0;s<sets;s++){
    if(MODE!=='proof')h+='<div class="famlabel" style="color:'+PLAYERS[s].c+';border-color:'+PLAYERS[s].c+'">'+PLAYERS[s].nm+' — complete recipe set</div>';
    h+='<div class="grid" style="gap:.14in">';
    RECIPES.forEach(r=>{h+=recipeCard(r);});
    h+='</div>';
  }
  return h+'</div>';}

function vessel(n,open){
  const steps='<div class="vstep"><span class="sn">Brew</span>step 0<span class="arr">›</span></div>'
    +'<div class="vstep"><span class="sn">Ferment</span><span class="arr">›</span></div>'
    +'<div class="vstep age"><span class="sn">Age</span>Cellar +1/turn<span class="arr">›</span></div>'
    +'<div class="vstep ready"><span class="sn">Ready</span>→ a slot</div>';
  return '<div class="vessel'+(open?'':' locked')+'"><span class="vtag">Vessel '+n+'</span><div class="vslot">'+LU('beer')+'cask</div><div class="vtrack">'+steps+'</div></div>';}
function pboard(p){
  let store='';for(let i=0;i<12;i++)store+='<div class="gbox">'+LU('package')+'</div>';
  let ups='';for(let i=0;i<3;i++)ups+='<div class="pslot">'+LU('wrench')+'Room / Modifier</div>';
  let goals='';for(let i=0;i<3;i++)goals+='<div class="pslot'+(i<2?' best':'')+'">'+LU('target')+(i<2?'goal (scores)':'goal')+'</div>';
  let tuck='<div class="tslot printed">'+LU('scroll-text')+'Gruit</div><div class="tslot printed">'+LU('scroll-text')+'Hopped</div>';
  for(let i=0;i<3;i++)tuck+='<div class="tslot">'+LU('plus')+'recipe card</div>';
  return '<div class="page fixed"><div class="board" style="--pc:'+p.c+'">'
    +'<div class="pb-head"><div class="crest">'+LU('beer')+'</div>'
      +'<div class="pb-title"><div class="pb-name">Brewhouse · '+p.nm+'</div>'
        +'<div class="pb-sub">your private brewery · Source → Brew → Age → Ship · Brewhouses of the Hanse · v0.9</div></div>'
      +'<div class="pb-storage"><span class="pb-lbl">'+LU('warehouse')+'Storage <span class="sm">cap 8 · +4 with a Warehouse</span></span><div class="boxrow">'+store+'</div></div></div>'
    +'<div class="pb-body">'
      +'<div class="pb-col left"><div class="pb-sect">'+LU('flask-conical')+'Vessels &amp; Maturation<span class="hint">start 2 open · cap 4 · ages +1/turn + the Cellar</span></div>'
        +vessel(1,true)+vessel(2,true)+vessel(3,false)+vessel(4,false)
        +'<div class="pb-sub" style="margin-top:.02in">Warm start: a Ready Gruit sits in Vessel 1 — deploy it to a slot on turn 1. (Your Cog is on a slot.)</div></div>'
      +'<div class="pb-col right">'
        +'<div><div class="pb-sect">'+LU('wrench')+'Upgrades<span class="hint">Rooms &amp; Modifiers</span></div><div class="strip">'+ups+'</div></div>'
        +'<div><div class="pb-sect">'+LU('target')+'Goals<span class="hint">best 2 score</span></div><div class="strip">'+goals+'</div></div></div>'
    +'</div>'
    +'<div class="tuck"><div class="tuck-h">'+LU('scroll-text')+'Recipe Cards<span class="sm">slide cards up into these — the types you may brew</span></div><div class="tuckrow">'+tuck+'</div></div>'
  +'</div></div>';}
function renderBoards(){return PLAYERS.map(pboard).join('');}

function kpanel(d,hall){const kc=d.kc;
  let track='';for(let i=0;i<=6;i++)track+='<div class="pc'+(i===0?' z':'')+'">'+i+'</div>';
  const valbody = hall
    ? '<div class="kval">'+LU(VP)+'×2<span class="per">VP per quality (L5 = 10)</span></div>'
    : '<div class="kval">'+LU(VP)+d.val+'<span class="per">VP per delivered cask</span></div>';
  const majline = hall
    ? '<div class="kmaj"><span>prestige — out of commerce</span><b>no majority</b></div>'
    : '<div class="kmaj"><span>majority 1st/2nd/3rd →</span><b>'+LU(VP)+' '+d.maj+'</b></div>';
  return '<div class="kpanel" style="--kc:'+kc+'">'
    +'<div class="ktitle"><span class="kname">'+LU(hall?'crown':'landmark')+d.nm+'</span><span class="kreq">'+LU(QI)+'L'+d.req+'+</span></div>'
    +'<div class="kbody"><div class="krole">'+d.role+'</div>'
      +valbody
      +'<div class="kben">'+LU('gift')+'<span>'+d.ben+'</span></div>'
      +majline
      +'<div class="kslot">'+LU('beer')+'delivered<br>casks (stack)</div>'
      +'<div class="ptrack">'+track+'</div><div class="ptrack-l">presence — advance your '+LU('circle')+' disc per cask; furthest = majority</div>'
    +'</div></div>';}
function renderDest(){
  let clk='';for(let i=1;i<=19;i++){let end='';for(const p in SAILED)if(SAILED[p]===i)end=p+'p';
    clk+='<div class="cc'+(end?' end':'')+'">'+(end?end+'<br>END':'<span class="n">'+i+'</span>')+'</div>';}
  let disp='';for(let i=0;i<4;i++)disp+='<div class="uslot">'+LU('wrench')+'upgrade</div>';
  disp+='<div class="uslot supply">'+LU('layers')+'supply<br>(face-down)</div>';
  disp+='<div class="uslot supply faceup">'+LU('sailboat')+'ships<br>(face-up)</div>';
  disp+='<div class="uslot supply">'+LU('target')+'goal tiles<br>(face-down)</div>';
  return '<div class="page fixed"><div class="dboard">'
    +'<div class="db-head"><h2>'+LU('landmark')+'Destinations</h2>'
      +'<span class="legend"><span><b>'+LU(QI,'ql')+'</b> quality level — a cask of level ≥ the L# may ship there</span><span><b>'+LU(VP,'vp')+'</b> victory points</span></span></div>'
    +'<div class="kontor-row">'+DESTS.map(d=>kpanel(d,false)).join('')+kpanel(HALL,true)+'</div>'
    +'<div class="db-bottom">'
      +'<div class="sbox disp"><div class="sb-h">'+LU('wrench')+'Market — Upgrade display<span class="sm">buy one (pay its cost) · or earn free by delivering to London / Novgorod</span></div><div class="uprow">'+disp+'</div></div>'
      +'<div class="sbox clock"><div class="sb-h">'+LU('sailboat')+'Sailed-Ships track<span class="sm">each voyage (a ship sailing, or a Charter) fills one slot → at your player-count marker, finish the round &amp; score</span></div><div class="ctrack">'+clk+'</div></div>'
    +'</div></div></div>';}

function render(){let h;
  if(VIEW==='tiles')h=renderTiles(); else if(VIEW==='cards')h=renderCards();
  else if(VIEW==='boards')h=renderBoards(); else h=renderDest();
  document.getElementById('out').innerHTML=h;
  if(window.lucide)lucide.createIcons();}
render();
</script>
</body>
</html>
