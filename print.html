<!DOCTYPE html>
<html lang="en">
<head>

<title>Brewhouses of the Hanse — Print &amp; Play · v8.0 “Brewer &amp; Merchant”</title>
<style>
  :root{--ink:#2b2018;--ink2:#5b4a37;--parch:#f3e9d2;--parch2:#e9dcc0;--line:#333;--gold:#b8860b;
    --sea:#274b5c;--green:#4a6b3a;--red:#7c2128;--violet:#5b3a8e;--vp:#b8860b;}
  *{box-sizing:border-box}
  body{margin:0;background:#e7e2d6;color:var(--ink);font-family:"Iowan Old Style",Georgia,serif;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar{position:sticky;top:0;z-index:10;background:var(--ink);color:var(--parch);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .bar h1{font-size:1.05rem;margin:0;font-variant:small-caps;letter-spacing:.5px}
  .bar a{color:var(--gold);text-decoration:none;font-size:.85rem}
  .bar button{font-family:inherit;cursor:pointer;border:none;border-radius:6px;padding:6px 13px;font-weight:bold;background:var(--gold);color:var(--ink)}
  .bar .seg{display:inline-flex;border:1px solid var(--gold);border-radius:6px;overflow:hidden}
  .bar .seg button{border-radius:0;background:transparent;color:var(--parch);font-weight:normal}
  .bar .seg button.on{background:var(--gold);color:var(--ink)}
  .bar .bsub{font-weight:normal;font-size:.66rem;opacity:.55;font-variant:small-caps;letter-spacing:1.5px;margin-left:10px}
  .bar .bsel{font-family:inherit;font-size:.85rem;border-radius:6px;padding:5px 10px;border:1px solid var(--gold);background:var(--ink);color:var(--parch);cursor:pointer}
  .bar #vsel{margin-left:auto}   /* title · the site nav · then the tool controls, pushed right */
  .note{font-size:.78rem;opacity:.85}
  /* ====== PAGE = US Letter LANDSCAPE, FULL PAPER (11×8.5in; content inset .3in) ======
     The sheet div IS the paper: an exported sheet PNG scaled to exactly 11×8.5 is at true size and
     registers with the cut-lines PDF (@page margin 0 — the same coordinate space edge to edge). */
  @media print{ @page{size:letter landscape;margin:0} }
  .page{width:11in;height:8.5in;background:#fff;margin:14px auto;box-shadow:0 3px 14px rgba(0,0,0,.25);position:relative;overflow:hidden}
  /* LARGE-FORMAT sheets (laser cutter / plotter) are 22in wide but each is trimmed to its own content HEIGHT so we
     don't run blank media — render() emits one named @page + .lgNN rule per distinct height into <style id=dynpage>. */
  @media print{.no-print{display:none} body{background:#fff} .page{margin:0;box-shadow:none;break-after:page}
    body.solo .page{display:none} body.solo .page.soloed{display:block}}
  /* every printed piece sits in an absolutely positioned .it box (inches) — layout is identical in
     ART and CUT layers; the CUT layer only hides the art and reveals the cut strokes in the overlay svg */
  .it{position:absolute}
  body.cut .it{visibility:hidden}
  /* baseline inline-icon size — body-text icons track the local font; component CSS overrides with explicit sizes */
  .ic{width:1em;height:1em;vertical-align:-.13em}
  img.ai{width:1em;height:1em;object-fit:contain;vertical-align:-.13em}   /* the illustrated icons track the same box wherever the CSS pairs "svg,.ic" */
  /* goods-icon colours: the pale palette is for dark tile faces; use the token colours on light text panels */
  .mbox .g,.pb-sub .g,.card .c-buy .g{color:#9c7414}
  .mbox .h,.pb-sub .h,.card .c-buy .h{color:#5d7d34}
  .ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
  .ov .cuts{display:none}
  body.cut .ov .cuts,body.both .ov .cuts{display:block}   /* CUT shows guides only (art hidden); BOTH overlays guides ON the art */
  /* card sheets are cut with a paper cutter, not the laser — their cut lines print WITH the art */
  .ov .cuts.always{display:block}
  .dl{position:absolute;top:.32in;right:.45in;z-index:6;display:flex;gap:4px}
  .dl button{font-size:.7rem;background:var(--sea);color:#fff;border:none;border-radius:4px;padding:2px 8px;cursor:pointer;font-family:inherit;opacity:.85}
  /* (the card-face CSS — casks · ships · Public Works · private and Kontor building tiles · specialists · recipes · tokens · the player board — lives in components.js, the shared library) */
  /* ====== 1.5mm BLEED on the plotter TILES (print-kit only — play.html keeps true tiles) ======
     The packed box = the tile + 1.5mm bleed all round; adjacent bleeds TOUCH (1.5+1.5 = the 3mm cut
     gap), so the sheet interior is solid ink and a laser misaligned by <1.5mm still lands on colour.
     Only the tile's BACKGROUND COLOUR and ART layers extend outward — the content never moves, and the
     cut rrect stays on the tile's true edge. (.059in = 1.5mm ÷ SCALE at the native SCALE 1.0 — these
     rules live in native units and MUST retune with TILE_BLEED_N if SCALE ever changes; the 2026-08-18
     scale-up left them at the old ×0.8 value .074 and the bleed band printed empty — the table caught it.) */
  .bl{position:relative;width:100%;height:100%;overflow:hidden}
  /* z-index:0 makes each tile its OWN stacking context — without it the ::before bleed band
     (z-index:-1) paints BEHIND the .page's white background and never shows (2026-08-18: the
     table's print had white channels between tiles; the art-layer extensions are real elements
     and always painted, which is why the ships looked right while the flat bands vanished). */
  .bl>.ctile,.bl>.btile,.bl>.stile,.bl>.icard{position:absolute;left:.059in;top:.059in;overflow:visible;border-radius:0;z-index:0}
  .bl>.ctile::before,.bl>.btile::before,.bl>.stile::before,.bl>.icard::before{content:"";position:absolute;inset:-.059in;background:var(--c,#33445a);z-index:-1}
  .bl>.btile>.artbg,.bl>.stile>.artbg,.bl>.stile>.st-wash,.bl>.icard>.artbg{inset:-.059in}
  .bl>.ctile>.ct-art{left:-.059in;top:-.059in;bottom:-.059in}
  .bl>.ctB>.ct-art{left:auto;right:-.059in}
  .bl>.btile>.bt-foot{margin:0 -.059in -.059in;padding-left:.159in;padding-right:.159in;padding-bottom:.129in}   /* the foot colour bleeds down & sideways; its content keeps its .1in/.07in insets */
  .bl>.icard>.ic-foot{margin:0 -.059in -.059in;padding-left:.229in;padding-right:.229in;padding-bottom:.209in}   /* the Specialist foot gradient rides OVER its art — it must bleed too (the art alone bleeds beige) */
  /* ====================== PLAYER AID CARD (double-sided: A = a turn · B = icon reference) ======================
     Two sheets (FRONT / BACK). Every card on a sheet is IDENTICAL, on a centred & symmetric 2×2 grid, so the
     outlines register under EITHER duplex flip edge — "front aligns with back" holds regardless of the printer.
     (Flip on the SHORT edge keeps the back upright.) 5.2×4.4in card (grown for air, 2026-08-03). */
  .aid{width:100%;height:100%;background:#f7efdc;color:var(--ink);border:1.4px solid var(--ink);border-radius:.07in;
    padding:.055in .075in;display:flex;flex-direction:column;overflow:hidden;font-size:.105in;line-height:1.34;letter-spacing:-.008em}
  .aid .ic,.aid svg{width:.115in;height:.115in;vertical-align:-.015in;flex:0 0 auto}
  .aid .gi{color:#9c7414} .aid .hi{color:#5d7d34} .aid .vi{color:var(--gold)}
  .aid b{color:var(--ink)} .aid .em{color:var(--red);font-weight:bold;font-variant:small-caps}
  .aid .ahd{display:flex;align-items:center;gap:.06in;border-bottom:2px solid var(--gold);padding-bottom:.02in;margin-bottom:.035in;flex:0 0 auto}
  .aid .ahd .abi{width:.22in;height:.22in;border-radius:.04in;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .aid .ahd .abi svg,.aid .ahd .abi .ic{width:.16in;height:.16in}
  .aid .ahd .at{font-variant:small-caps;font-weight:bold;color:var(--red);font-size:.14in;line-height:1}
  .aid .ahd .as{font-size:.09in;font-style:italic;color:var(--ink2);margin-left:auto;text-align:right;line-height:1.1}
  .aid .acols{flex:1;display:flex;gap:.14in;min-height:0}
  .aid .acol{flex:1;display:flex;flex-direction:column;min-width:0}
  .aid h5{font-variant:small-caps;font-weight:bold;color:var(--sea);font-size:.107in;margin:.062in 0 .024in;white-space:nowrap;
    border-bottom:1px solid var(--line);padding-bottom:.006in;display:flex;align-items:center;gap:.04in}
  .aid h5:first-child{margin-top:0}
  .aid h5 svg,.aid h5 .ic{width:.12in;height:.12in}
  .aid .step{display:flex;gap:.05in;margin-bottom:.036in}
  .aid .step .sn{flex:0 0 auto;width:.17in;height:.17in;border-radius:50%;background:var(--sea);color:#fff;font-size:.09in;font-weight:bold;display:flex;align-items:center;justify-content:center}
  .aid .step .sx,.aid .ln{min-width:0}
  .aid .ln{margin-bottom:.038in}
  /* the die lifecycle strip: 5 stacked chips with arrows */
  .aid .dstrip{display:flex;align-items:flex-start;gap:.015in;margin-bottom:.038in}
  .aid .dch{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.006in;min-width:0}
  .aid .dch img.ai,.aid .dch svg{width:.13in;height:.13in}
  .aid .dch b{font-size:.105in;line-height:1}
  .aid .dch .ds{font-size:.105in;line-height:1.06;color:var(--ink2)}
  .aid .darr{flex:0 0 auto;font-weight:bold;opacity:.65;padding-top:.05in;font-size:.11in}
  /* the Kontore table — the front's centrepiece */
  .aid table.kt{width:100%;border-collapse:collapse;margin-bottom:.02in}
  .aid .kt th{font-variant:small-caps;text-align:left;border-bottom:1px solid var(--gold);font-size:.105in;padding:0 .02in .008in 0}
  .aid .kt td{padding:.004in .02in .004in 0;line-height:1.08;vertical-align:middle}
  .aid .kt td.kn{font-variant:small-caps;font-weight:bold;white-space:nowrap}
  .aid .kt td.km{font-weight:bold;white-space:nowrap}
  .aid .kt img.ai{width:.12in;height:.12in;margin-right:.012in}
  /* the DON'T FORGET callout */
  .aid .dontf{border:1.4px solid var(--red);border-radius:.04in;padding:.03in .045in;background:rgba(124,33,40,.05);margin:.02in 0 .026in;line-height:1.18}
  /* legend grid (back) */
  .aid .leg{display:flex;flex-direction:column}
  .aid .lr{display:flex;align-items:flex-start;gap:.05in;margin-bottom:.042in}
  .aid .lr .lic{flex:0 0 .2in;height:.15in;display:flex;align-items:center;justify-content:center;color:var(--sea)}
  .aid .lr .lic svg,.aid .lr .lic .ic{width:.15in;height:.15in}
  .aid .lr .lx{min-width:0} .aid .lr .lx b{font-variant:small-caps}
  /* the illustrated icons render as BIG as their detail allows (designer, final pass): the art
     carries ~15%/side transparent sticker margin, so the img boxes oversize past the glyph slots
     with negative margins — the visible sticker fills the slot and line metrics never grow */
  .aid img.ai{width:.19in;height:.19in;margin:-.05in -.008in;vertical-align:-.05in}
  .aid h5 img.ai{width:.21in;height:.21in;margin:-.05in 0;vertical-align:-.055in}
  .aid .lr .lic{flex:0 0 .26in;height:.15in}
  .aid .lr .lic img.ai{width:.27in;height:.27in;margin:-.055in -.02in}
  .aid .dch img.ai{width:.21in;height:.21in;margin:-.045in 0 -.04in}
  .aid .kt img.ai{width:.2in;height:.2in;margin:-.055in .008in -.055in 0;vertical-align:middle}
  .aid .ahd .abi img.ai{width:.24in;height:.24in;margin:-.02in}
  /* ---- .a3: the aid PANEL tier (2026-08-18, one COMPLETE aid per third of the letter
     sheet) — the ruled .105in body floor, now at PRINT size (~25% up on the old card);
     the back's legend runs two columns. */
  .aid.a3{border-width:2px;border-radius:.09in;padding:.13in .15in;font-size:.105in;line-height:1.22;letter-spacing:0}
  .aid.a3 .ic,.aid.a3 svg{width:.12in;height:.12in;vertical-align:-.015in}
  .aid.a3 .ahd{border-bottom-width:2px;padding-bottom:.04in;margin-bottom:.06in;gap:.06in}
  .aid.a3 .ahd .at{font-size:.17in}
  .aid.a3 .ahd .as{font-size:.095in}
  .aid.a3 .ahd .abi{width:.26in;height:.26in}
  .aid.a3 .ahd .abi svg,.aid.a3 .ahd .abi .ic{width:.18in;height:.18in}
  .aid.a3 .ahd .abi img.ai{width:.24in;height:.24in;margin:-.02in}
  .aid.a3 h5{font-size:.125in;margin:.15in 0 .05in;padding-bottom:.015in;gap:.04in}   /* the wide top margin IS the previous section's bottom padding (designer, 2026-08-18; .17→.15 at the v7 fit pass) */
  .aid.a3.front h5{margin-top:.1in}   /* the v8 front carries the sea — a touch tighter between sections */
  .aid.a3.front .step{margin-bottom:.035in}
  .aid.a3 h5 svg,.aid.a3 h5 .ic{width:.13in;height:.13in}
  .aid.a3 .step{gap:.06in;margin-bottom:.05in}
  .aid.a3 .step .sn{width:.19in;height:.19in;font-size:.105in}
  .aid.a3 .ln{margin-bottom:.045in}
  .aid.a3 .dstrip{gap:.015in;margin-bottom:.05in}
  .aid.a3 .dch b{font-size:.105in}
  .aid.a3 .dch .ds{font-size:.1in}
  .aid.a3 .darr{font-size:.115in;padding-top:.06in}
  .aid.a3 .kt th{font-size:.105in;padding-bottom:.012in}
  .aid.a3 .kt td{padding:.01in .025in .01in 0;line-height:1.12}
  .aid.a3 .dontf{padding:.05in .07in;border-width:1.6px;margin:.08in 0 .09in;line-height:1.22}
  .aid.a3 .lr{gap:.06in;margin-bottom:.05in}
  .aid.a3 .lr .lic{flex:0 0 .28in;height:.17in}
  .aid.a3 .lr .lic svg,.aid.a3 .lr .lic .ic{width:.17in;height:.17in}
  .aid.a3 img.ai{width:.2in;height:.2in;margin:-.05in -.008in;vertical-align:-.055in}
  .aid.a3 h5 img.ai{width:.22in;height:.22in;margin:-.05in 0;vertical-align:-.06in}
  .aid.a3 .lr .lic img.ai{width:.28in;height:.28in;margin:-.055in -.02in}
  .aid.a3 .dch img.ai,.aid.a3 .dch svg{width:.24in;height:.24in;margin:-.045in 0 -.04in}
  .aid.a3 .kt img.ai{width:.21in;height:.21in;margin:-.055in .008in -.055in 0;vertical-align:middle}
  /* the back's legend: two columns, rows unbroken */
  .aid.a3 .leg2{display:block;columns:2;column-gap:.16in;margin-top:.02in}
  .aid.a3 .leg2 h5{break-inside:avoid}
  .aid.a3 .leg2 .lr{break-inside:avoid}
  /* ====================== THE SEA BOARD (v8) — the chart under parchment panels ====================== */
  .sb{position:relative;width:12.6in;height:10.7in;background:#dfe9ec;border-radius:.14in;overflow:hidden;color:var(--ink);font-family:inherit}
  .sb svg,.sb .ic{stroke-width:1.8}
  .sb .sb-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:left center}
  .sb .sb-wash{position:absolute;inset:0;background:rgba(243,233,210,.14)}
  .sb .sb-lanes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .sb .sb-lanes .lane{fill:none;stroke:#274b5c;stroke-width:.045;stroke-dasharray:.12 .08;stroke-linecap:round;opacity:.85}
  .sb .sb-lanes .road{fill:none;stroke:#b8860b;stroke-width:.045;stroke-dasharray:.06 .07;stroke-linecap:round}
  .sb .sb-side{position:absolute;right:.16in;bottom:.06in;font-variant:small-caps;font-weight:bold;font-size:.1in;color:var(--ink2);opacity:.8}
  .sb .hb{position:absolute;background:var(--parch);border:2.5px solid var(--gold);border-radius:.1in;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .sb .hb span{writing-mode:vertical-rl;transform:rotate(180deg);font-variant:small-caps;font-weight:bold;font-size:.2in;color:var(--sea);letter-spacing:.5px;display:inline-flex;align-items:center;gap:.08in}
  .sb .hb span img.ai,.sb .hb span .ic{width:.32in;height:.32in;transform:rotate(90deg)}
  .sb .seg{position:absolute;background:rgba(243,233,210,.94);border:2.5px solid var(--sea);border-radius:.1in;padding:.09in .12in;display:flex;flex-direction:column;gap:.07in;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .sb .seg-h{display:flex;align-items:center;gap:.05in;font-size:.15in;line-height:1;color:var(--sea);white-space:nowrap}
  .sb .seg-h b{font-variant:small-caps;font-size:.17in}
  .sb .seg-h .code{margin-left:auto;font-weight:900;font-size:.2in;color:var(--ink)}
  .sb .seg-h img.ai,.sb .seg-h .ic{width:.26in;height:.26in}
  .sb .seats{display:flex;gap:.1in;align-items:center;justify-content:center}
  .sb .seat{width:.55in;height:.55in;border:2.5px dashed var(--pc,#777);border-radius:.06in;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 .04in rgba(255,255,255,.6)}
  .sb .seg-l{display:flex;align-items:center;justify-content:center;gap:.04in;font-size:.11in;font-variant:small-caps;font-weight:bold;color:var(--ink2)}
  .sb .seg-l img.ai,.sb .seg-l .ic{width:.24in;height:.24in} .sb .seg-l img.ai.dlift{width:.3in;height:.3in}
  .sb .kp2{position:absolute;background:var(--kt);border:3px solid var(--kc);border-radius:.1in;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .sb .kp2-t{background:var(--kc);color:#fff;display:flex;align-items:center;gap:.06in;padding:.05in .12in;font-size:.13in;text-shadow:0 1px 1.5px rgba(0,0,0,.35);flex:0 0 auto}
  .sb .kp2-t b{font-variant:small-caps;font-size:.24in;line-height:1}
  .sb .kp2-t img.ai,.sb .kp2-t .ic{width:.44in;height:.44in;margin:-.08in 0}
  .sb .kp2-t .branch{margin-left:.1in;font-weight:900;font-size:.15in;opacity:.95}
  .sb .kp2-t .min{margin-left:auto;display:inline-flex;align-items:center;font-weight:900;font-size:.2in}
  .sb .kp2-t .min img.ai{width:.4in;height:.4in;margin:-.1in 0}
  .sb .kslots{display:flex;gap:.08in;padding:.08in .1in 0;justify-content:center}
  .sb .kslot{position:relative;width:1.34in;height:1.34in;border:2.5px dashed var(--kc);border-radius:.08in;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .sb .kslot img.ai,.sb .kslot .ic{width:.6in;height:.6in;opacity:.35}
  .sb .kslot i{position:absolute;right:.05in;bottom:.03in;font-style:normal;font-weight:900;font-size:.11in;color:var(--kc);opacity:.8}
  .sb .kp2-r{display:flex;align-items:center;justify-content:space-between;gap:.1in;padding:.06in .12in 0;font-size:.115in;line-height:1.1}
  .sb .kp2-r .prize{display:inline-flex;align-items:center;gap:.03in;font-weight:bold}
  .sb .kp2-r .prize img.ai,.sb .kp2-r .prize .ic{width:.32in;height:.32in;margin:-.06in 0}
  .sb .kp2-r .pair{display:inline-flex;align-items:center;gap:.03in;font-weight:900;font-size:.2in;color:var(--kc);white-space:nowrap}
  .sb .kp2-r .pair img.ai,.sb .kp2-r .pair .ic{width:.24in;height:.24in}
  .sb .kfield{flex:1;margin:.07in .12in .1in;border:2px dashed var(--kc);border-radius:.07in;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;min-height:.55in}
  .sb .kfield span{font-variant:small-caps;font-weight:bold;font-size:.1in;color:var(--kc);opacity:.7}
  .sb .br{position:absolute;background:rgba(243,233,210,.96);border:3px solid #274b5c;border-radius:.1in;padding:.08in .14in .1in;display:flex;flex-direction:column;gap:.08in;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .sb .br-t{display:flex;align-items:center;gap:.08in;border-bottom:2px solid #274b5c;padding-bottom:.04in;font-size:.13in;color:var(--sea)}
  .sb .br-t b{font-variant:small-caps;font-size:.26in;line-height:1;color:var(--ink)}
  .sb .br-t img.ai,.sb .br-t .ic{width:.44in;height:.44in;margin:-.08in 0}
  .sb .br-t .sub{display:inline-flex;align-items:center;gap:.03in;font-style:italic}
  .sb .br-t .pair{margin-left:auto;display:inline-flex;align-items:center;gap:.04in;font-weight:900;font-size:.2in}
  .sb .br-t .pair i{font-weight:normal;font-size:.1in;font-style:italic;color:var(--ink2)}
  .sb .br-row{display:flex;align-items:flex-start;gap:.12in}
  .sb .br-l{flex:0 0 1.05in;display:flex;flex-direction:column;align-items:flex-start;line-height:1.05;padding-top:.06in}
  .sb .br-l b{font-variant:small-caps;font-size:.16in;color:var(--ink)} .sb .br-l i{font-size:.095in;color:var(--ink2)}
  .sb .br-l img.ai,.sb .br-l .ic{width:.36in;height:.36in;margin-bottom:.02in}
  .sb .ytrack{display:flex;gap:.12in;align-items:flex-start}
  .sb .yz{display:flex;flex-direction:column;align-items:center;gap:.035in;border:1.5px solid rgba(0,0,0,.18);border-radius:.07in;padding:.04in .08in;background:rgba(255,255,255,.35);min-width:1.75in}
  .sb .yz.z0{background:rgba(184,134,11,.16)} .sb .yz.z1{background:rgba(74,107,58,.12)}
  .sb .yz-h{font-variant:small-caps;font-weight:900;font-size:.1in;letter-spacing:.5px;color:var(--ink2)}
  .sb .yps{display:flex;gap:.06in}
  .sb .yp{width:.5in;height:.5in;border:2px dashed #274b5c;border-radius:.06in;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.14in;color:var(--sea);opacity:.9}
  .sb .yp.more{border-style:dotted;opacity:.5}
  .sb .yz-p{display:inline-flex;align-items:center;gap:.02in;font-size:.1in;line-height:1;white-space:nowrap}
  .sb .yz-p i{font-style:italic;font-size:.085in;color:var(--ink2)}
  .sb .yz-p img.ai,.sb .yz-p .ic{width:.3in;height:.3in;margin:-.06in 0}
  .sb .hall{display:flex;gap:.06in;flex-wrap:nowrap;padding-top:.06in}
  .sb .hp{position:relative;width:.5in;height:.5in;border:2px dashed #5b3a8e;border-radius:.06in;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.14in;color:#5b3a8e;flex:0 0 auto}
  .sb .hp i{position:absolute;left:-.02in;right:-.02in;bottom:-.19in;text-align:center;font-style:normal;font-size:.095in;font-weight:900;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:.01in}
  .sb .hp i img.ai{width:.16in;height:.16in}
  .sb .hdseat{margin-left:auto;display:flex;flex-direction:column;align-items:center;gap:.02in;width:.72in;flex:0 0 auto}
  .sb .hdseat img.ai{width:.6in;height:.6in;border:2px dashed var(--gold);border-radius:.08in;padding:.03in;background:rgba(255,255,255,.6)}
  .sb .hdseat span{font-variant:small-caps;font-weight:bold;font-size:.085in;color:var(--ink2);white-space:nowrap}
  /* ====================== MAIN BOARD — THE WHARF ====================== */
  .mboard{width:100%;height:100%;background:var(--parch);border:2.5px solid var(--sea);border-radius:.12in;padding:.14in .16in;display:flex;flex-direction:column;gap:.04in;color:var(--ink)}
  .mboard svg,.mboard .ic{stroke-width:1.8}
  .mb-head{display:flex;align-items:center;gap:.14in;margin-bottom:.02in}
  .mb-head h2{margin:0;font-variant:small-caps;color:var(--sea);font-size:.26in;letter-spacing:.5px;display:flex;align-items:center;gap:.08in;white-space:nowrap}
  .mb-head h2 svg,.mb-head h2 .ic{width:.2in;height:.2in}
  .mb-head h2 img.ai{width:.55in;height:.55in;margin:-.14in 0}   /* the big illustrated header icons keep the row slim */
  .mb-head h2.spec-h{margin-left:auto;width:4.92in;justify-content:center}   /* centred over the CASKS & RECIPES column (4.92in, flush right — 2026-08-18) */
  .mb-head .sub{font-size:.1in;font-style:italic;color:var(--ink2)}
  .mb-main{flex:1;display:flex;gap:.14in;min-height:0;align-items:center}
  /* v3.4c.8 [ruled]: the board's arms reach only the BUILDING BAND — each slot prints the 2.5×1.32in
     building footprint (the side arms seat it ROTATED); casks/ships stack on the tile and hang OFF the
     board's edge, exactly as on the table (play.html's boardCross mirrors this live). */
  .wharf{flex:0 0 auto;align-self:flex-start;display:grid;gap:.3in;
    grid-template-columns:1.32in 2.5in 2.5in 1.32in;
    grid-template-rows:1.32in 2.5in 2.5in 1.32in}
  .wslot{border:2.5px dashed rgba(255,255,255,.82);border-radius:.18in;background:rgba(20,14,8,.24);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.04in;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.75)}
  .wslot svg,.wslot .ic{width:.5in;height:.5in;opacity:.85;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
  /* the station cell (2026-08-03, designer-ruled): a painted SCENE fills the cell; over it only the
     station TITLE (top — the scenes keep a calm top band) and the ACTION's illustrated icon (low-centre).
     The verbose action reference lives in the side column + the player aid. */
  .stn{border-radius:.2in;color:#fff;padding:.12in;display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative;overflow:hidden;text-shadow:0 1px 2px rgba(0,0,0,.55);box-shadow:0 3px 10px rgba(0,0,0,.35);border:.035in solid #e5dcc3}   /* the light-tan frame pops the stations off the deck (designer, round 2) */
  .stn>*{position:relative;z-index:1}
  .stn>.stn-scene{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;object-position:center}
  /* a dark foot gradient lifts the action icon + caption off the scene — an inline SVG ramp,
     not a CSS gradient (CSS gradients seam in the html2canvas export; the kp panels' pattern) */
  .stn>.stn-grad{position:absolute;left:0;right:0;bottom:0;height:54%;width:100%;z-index:0}
  /* the station face: the P/A pair at the TOP-LEFT (PRIMARY big, ALT beside it smaller —
     both fire on a visit), the name plain at the BOTTOM-LEFT */
  .stn .stn-pa{position:absolute;top:.12in;left:.12in;z-index:2;display:flex;align-items:center;gap:.07in}
  .stn .stn-pa img.ai{width:.95in;height:.95in;filter:drop-shadow(0 2px 5px rgba(0,0,0,.6))}
  .stn .stn-pa img.ai.stn-alt-i{width:.65in;height:.65in;filter:drop-shadow(0 1px 3px rgba(0,0,0,.55))}
  .stn .stn-nm{position:absolute;left:.14in;bottom:.12in;z-index:2;font-variant:small-caps;font-weight:bold;font-size:.3in;line-height:1;letter-spacing:.5px;text-shadow:0 1px 3px rgba(0,0,0,.8),0 0 .14in rgba(0,0,0,.55)}
  /* per-station frame colours match the action icons' bases (designer): Market RED · Brewhouse
     YELLOW · Harbor BLUE · Cellar GREEN (the gradient is the fallback under the opaque scene) */
  .stn.A{border-color:#b4423a;background:linear-gradient(155deg,#9c3b2e,#7c2128)}
  .stn.B{border-color:#c9a227;background:linear-gradient(155deg,#cda522,#9c7414)}
  .stn.C{border-color:#3d6b7e;background:linear-gradient(155deg,#3d6b7e,#244554)}
  .stn.D{border-color:#4a6b3a;background:linear-gradient(155deg,#5a7e46,#34492a)}
  .mb-side{flex:1;display:flex;flex-direction:column;gap:.055in;min-width:0}
  .mbox{border:1.5px solid var(--sea);border-radius:.07in;background:#fff;padding:.045in .07in}
  .mbox.supply-note{margin-top:.04in;max-width:7.6in}
  .invbleed{width:.95in;height:.95in;border-radius:50%;background:#7c2128;display:flex;align-items:center;justify-content:center}
  .invbleed.chitbleed{background:var(--c,#6f6253)}
  .mbox h4{margin:0 0 .025in;font-variant:small-caps;font-size:.115in;color:var(--sea);display:flex;align-items:center;gap:.04in;border-bottom:1px solid rgba(0,0,0,.15);padding-bottom:.015in}
  .mbox h4 svg,.mbox h4 .ic{width:.13in;height:.13in}
  .mbox .b{font-size:.092in;line-height:1.22}
  .mbox .b b{color:var(--red)}
  .mbox ol{margin:.02in 0 0;padding-left:.16in;font-size:.092in;line-height:1.24}
  .srow{display:flex;gap:.05in;font-size:.09in;line-height:1.2;margin-bottom:.024in}
  .srow:last-child{margin-bottom:0}
  .srow .sic{flex:0 0 auto;margin-top:.005in} .srow .sic svg,.srow .sic .ic{width:.14in;height:.14in}
  .srow b{font-variant:small-caps}
  .mtrack-l{font-size:.082in;font-style:italic;color:var(--ink2);text-align:center}
  .ctrack{display:flex;height:.55in;border:1.5px solid var(--sea);border-radius:.05in;overflow:hidden}
  .cc{flex:1;min-width:0;border-right:1px solid rgba(0,0,0,.15);display:flex;flex-direction:column;gap:.015in;align-items:center;justify-content:center;font-size:.08in;color:var(--ink2);background:rgba(255,255,255,.4)}
  .cc:last-child{border-right:none} .cc .n{font-size:.1in;color:#999}
  .cc svg,.cc .ic{width:.14in;height:.14in}
  .cc b{font-size:.085in;line-height:1}
  .cc.end{background:var(--sea);color:#fff;font-weight:bold;text-align:center;line-height:1}
  .cc.rend{background:rgba(122,82,54,.22);color:#7a5236;font-weight:bold;text-align:center;line-height:1}
  .rtrack{display:flex;height:.3in;border:1.5px solid var(--gold);border-radius:.05in;overflow:hidden}
  .rc{flex:1;min-width:0;border-right:1px solid rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-size:.078in;color:var(--ink2);background:rgba(255,255,255,.4)}
  .rc:last-child{border-right:none} .rc.band{background:rgba(184,134,11,.16)}
  .rc.cap{background:var(--gold);color:#fff;font-weight:bold;font-size:.07in;text-align:center;line-height:1}
  .rc.z{background:rgba(124,33,40,.12);font-variant:small-caps;font-weight:bold;color:var(--red);font-size:.07in}
  /* printables2: the SCORE RING — 50 disc-sized cells (0–49 + lap) wrapping the Supply board's outer edge */
  /* the gold rim is an ::after overlay border, NOT an inset box-shadow: html2canvas mis-renders inset
     box-shadows by FLOODING the whole element with the shadow colour — the S2 sheet PNG exported with the
     entire board interior painted gold (#b8860b) instead of parchment. Same bug class as the documented
     gradient/filter/clip-path quirks in the export review note; the ::after border pattern is already
     proven in exports by the goods tokens' .tok::after inner ring. */
  .supply-outer{position:relative;width:100%;height:100%;background:var(--parch);border-radius:.14in;overflow:hidden}
  .supply-outer::after{content:"";position:absolute;inset:0;border:2px solid var(--gold);border-radius:.14in;pointer-events:none;z-index:6}
  .score-ring{position:absolute;inset:0}
  .ringcell{position:absolute;border:1px solid rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;
    font-size:.21in;font-weight:900;color:var(--ink2);background:rgba(255,255,255,.55);overflow:hidden}
  .ringcell.start{background:var(--red);color:#fff;flex-direction:column;gap:.02in;text-align:center}
  .ringcell.start svg,.ringcell.start .ic{width:.19in;height:.19in}
  .ringcell.start .lap{font-size:.11in;font-weight:bold;line-height:1;opacity:.95}
  .ringcell.five{background:rgba(184,134,11,.3);color:var(--ink)}
  .trk-h{font-variant:small-caps;font-weight:bold;font-size:.12in;color:var(--sea);display:flex;align-items:center;gap:.05in;margin:.07in 0 .03in}
  .trk-h svg,.trk-h .ic{width:.14in;height:.14in}
  .trk-h .sm{font-variant:normal;font-weight:normal;font-style:italic;font-size:.082in;color:var(--ink2);margin-left:.06in}
  /* the WHARF board is a CROSS — the cut follows the plus outline; the 4 corners fall away */
  /* +.3in outline padding: the grid sits inset, the cut plus runs .3in outside the slots */
  .mboard.cross{background:#e9dcc0 url('art/wharf-board.png') center/cover;border:none;border-radius:0;padding:.3in;display:block;
    clip-path:url(#crossclip)}
  .mboard.supply{display:flex;flex-direction:column;gap:.08in;padding:.18in .2in .32in;border:none;background:transparent;border-radius:0}   /* extra foot padding — the content shouldn't ride the ring */
  .mboard.supply .tracks{flex:0 0 auto;margin-top:auto}
  /* a printed label on the large sheet (above each cut board) */
  .sheetlbl{font-variant:small-caps;color:var(--sea);font-weight:bold;font-size:.28in;display:flex;align-items:center;gap:.1in;height:100%}
  .sheetlbl svg,.sheetlbl .ic{width:.26in;height:.26in}
  .sheetlbl .sub{font-variant:normal;font-weight:normal;font-style:italic;font-size:.13in;color:var(--ink2)}
  /* ====================== WHARF SIDE — supply DISPLAYS (Building display · Ship market) ====================== */
  .disp{flex:1;display:flex;flex-direction:column;gap:.18in;min-width:0;margin-top:0}
  .mb-track{margin-top:.12in}
  .disp-h{display:inline-flex;align-items:center;gap:.05in;background:var(--sea);color:#fff;border-radius:.06in;
    padding:.035in .12in;font-variant:small-caps;font-weight:bold;font-size:.125in;letter-spacing:.3px;margin-bottom:.07in;text-shadow:0 1px 1px rgba(0,0,0,.25)}
  .disp-h svg,.disp-h .ic{width:.15in;height:.15in}
  .disp-h .sm{font-variant:normal;font-weight:normal;font-style:italic;font-size:.082in;opacity:.85;margin-left:.06in}
  .disp-h .sm svg,.disp-h .sm .ic{width:.1in;height:.1in;vertical-align:-.015in}
  .disp-h.b{background:var(--green)}
  .disp-h.m{background:#9c7414}
  .disp-h.i{background:var(--violet)}
  /* market SHELVES — one family per row at its native footprint; deck right-aligned = the stockroom column */
  .shelf{display:flex;gap:.12in;align-items:flex-start}
  .shelf-lbl{display:flex;align-items:center;gap:.04in;font-variant:small-caps;font-weight:bold;font-size:.105in;color:var(--ink2);margin-top:.02in}
  .shelf-lbl svg,.shelf-lbl .ic{width:.13in;height:.13in}
  .shelf-lbl .bag{margin-left:auto;display:inline-flex;align-items:center;opacity:.7}   /* refill from this family's DRAW BAG (tile backs reveal the type, so the supply hides in a bag) */
  .shelf-lbl .bag svg,.shelf-lbl .bag .ic{width:.16in;height:.16in}
  .disp-bd{display:flex;gap:.1in;align-items:center}
  .dslot{width:2.5in;height:1.32in;border:1.7px dashed var(--sea);border-radius:.07in;background:rgba(255,255,255,.5);   /* buildings 2×1.32 (v3.4a) */
    display:flex;flex-direction:column;gap:.04in;align-items:center;justify-content:center;color:var(--sea);flex:0 0 auto;position:relative}
  .dslot svg,.dslot .ic{width:.6in;height:.6in;opacity:.32}
  /* OVERLAY proof: a real component render ghosted into its slot — native size, half opacity, never printed */
  /* the ghost sits CENTRED in its slot — a slot may be cut larger than the piece it seats */
  .dslot .ovl{position:absolute;inset:0;opacity:.5;pointer-events:none;z-index:2;
    display:flex;align-items:center;justify-content:center}
  @media print{.ovl{display:none}}
  .dslot.b{border-color:var(--green);color:var(--green)}
  .dslot.i{border-color:var(--violet);color:var(--violet);width:2in;height:2in}   /* Specialist cards are 2×2 (component-true) */
  .dslot.s,.ddeck.s{width:2.5in;height:3in}   /* the ship display seats either hull — sized to the Hulk CARRIER (2.5×3; a Cog sits within) */
  .dslot.r{width:1.85in;height:2.55in;border-color:#8a6408;color:#8a6408}   /* recipe cards, 1.85×2.55 */
  .dslot.r svg,.dslot.r .ic{width:.5in;height:.5in}
  .dslot.r .rn{font-variant:small-caps;font-weight:bold;font-size:.1in;opacity:.7}
  /* ---- Market & Stores interior: the market column · the cellar (Specialists) column · the clock ---- */
  .sup-cols{display:flex;gap:.2in;flex:1;min-height:0}
  .sup-cellar{flex:0 0 auto;width:4.92in;display:flex;flex-direction:column;gap:.08in;justify-content:flex-start}
  .brew-row{display:flex;gap:.12in;flex:0 0 auto}
  .dslot.c{width:2.4in;height:1in;border-color:#8a6408;color:#8a6408}   /* a beer PILE — the cask tile's true 2.4×1 cut */
  .dslot.c svg,.dslot.c .ic{width:.3in;height:.3in}

  .dslot.c .rn,.dslot.r .rn{font-variant:small-caps;font-weight:bold;font-size:.1in;opacity:.7}
  .sup-main{flex:0 0 auto;width:10.4in;display:flex;flex-direction:column;gap:.16in}   /* wide enough for the 4-slot ship shelf — the Specialists column sits clear right */
  .sup-main .tracks{margin-top:auto}
  .sup-cellar{flex:0 0 auto;width:2.4in;display:flex;flex-direction:column;gap:.09in;min-width:0}
  .sup-cellar .disp-h{font-size:.14in}
  .sup-cellar .shelf-v{display:flex;flex-direction:column;gap:.1in;align-items:center}
  /* the vertical Sailed-Ships CLOCK — its own slim third column, the ship at its head */
  .sup-clock{flex:0 0 auto;width:.74in;display:flex;flex-direction:column;align-items:center;gap:.03in}
  .sup-clock .cicon{color:var(--sea);display:flex;align-items:center;justify-content:center}
  .sup-clock .cicon svg,.sup-clock .cicon .ic{width:.34in;height:.34in;stroke-width:1.6}
  .sup-clock .clbl{font-variant:small-caps;font-weight:bold;font-size:.088in;color:var(--sea);text-align:center;line-height:1.1}
  .vtrack{flex:1;width:100%;display:flex;flex-direction:column;border:1.5px solid var(--sea);border-radius:.05in;overflow:hidden}
  .vtrack .cc{border-right:none;border-bottom:1px solid rgba(0,0,0,.15)}
  .vtrack .cc:last-child{border-bottom:none}
  /* ====================== OVERLAND board (Trade Roads) ====================== */
  .olboard{width:100%;height:100%;background:var(--parch);border:2.5px solid #7a5236;border-radius:.12in;padding:.16in;display:flex;flex-direction:column;gap:.08in;color:var(--ink)}
  .olboard svg,.olboard .ic{stroke-width:1.8}
  .ol-head{display:flex;align-items:baseline;gap:.14in}
  .ol-head h2{margin:0;font-variant:small-caps;color:#7a5236;font-size:.24in;display:flex;align-items:center;gap:.08in}
  .ol-head h2 svg,.ol-head h2 .ic{width:.2in;height:.2in}
  .ol-head .sub{font-size:.1in;font-style:italic;color:var(--ink2)}
  .ol-legend{display:grid;grid-template-columns:1fr 1fr;gap:.02in .2in;font-size:.088in;line-height:1.2;background:#fff;border:1.5px solid #c9b693;border-radius:.08in;padding:.05in .1in}
  .ol-legend b{color:#7a5236}
  .ol-legend svg,.ol-legend .ic{width:.11in;height:.11in;vertical-align:-.02in}
  /* the tech-tree canvas: one Hamburg root + one Bruges gateway, branching to the 3 western roads + the eastern haul */
  .ol-tree{position:relative;flex:1;min-height:0}
  .ol-roads{position:absolute;inset:0;width:100%;height:100%}
  .ol-roads .ol-reg{fill:rgba(120,90,40,.05);stroke:rgba(0,0,0,.05)}
  .ol-roads .ol-reg.e{fill:rgba(70,50,20,.07)}
  .ol-roads line{stroke:#b08d57;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:.4 6;opacity:.85;vector-effect:non-scaling-stroke}
  .ol-roads .ol-express{stroke:#b08d57;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:.4 6;opacity:.85;vector-effect:non-scaling-stroke}  /* the Q4+ Rhine Charter (Hamburg→Cologne, skip Bruges) — same dotted style as the other roads; the label marks it */
  .ol-reglbl{position:absolute;font-variant:small-caps;font-style:italic;font-weight:bold;font-size:.1in;color:rgba(90,70,40,.72);letter-spacing:.5px}
  .ol-reglbl.r{font-style:normal;display:flex;align-items:center;gap:.04in;transform:translateX(-100%)}
  .ol-reglbl.express{font-style:normal;display:flex;align-items:center;gap:.04in;color:#9c3b2e;font-size:.092in;background:rgba(243,233,210,.85);border-radius:.04in;padding:.005in .035in}
  .ol-reglbl svg,.ol-reglbl .ic{width:.12in;height:.12in}
  /* a town node CARD, absolutely positioned & centred on its tree coordinate */
  .oln{position:absolute;transform:translate(-50%,-50%);border:1.6px solid #c9b693;border-radius:.07in;background:#fff;padding:.04in .05in;display:flex;flex-direction:column;gap:.03in;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .oln.home{background:#e6d3a8;border:2px solid #8a6d3b;align-items:center;justify-content:center;text-align:center;gap:.01in;padding:.05in}

  .oln.core{border-color:var(--gold);border-width:2.2px;background:#fdf6e6}
  .oln.deep{box-shadow:0 0 0 1.5px #7c2128,0 1px 3px rgba(0,0,0,.12)}

  .oln-nm{font-variant:small-caps;font-weight:bold;font-size:.12in;display:inline-flex;align-items:center;gap:.03in}

  .oln-q svg,.oln-q .ic,.oln-pts svg,.oln-pts .ic{width:.11in;height:.11in}
  /* the PHYSICAL claim-slot squares — a little bigger than a presence token; cover one to claim it */

  .olsq{position:relative;width:.4in;min-width:.4in;height:.46in;border:1.4px dashed #9a8049;border-radius:.04in;background:rgba(120,90,40,.05);

  .oln-over{display:flex;align-items:center;gap:.03in;font-size:.076in;color:var(--ink2);border-top:1px dotted #c9b693;padding-top:.025in}

// printables2: the WHARF is now a CROSS board on its own (the cut follows the plus). 4×4 grid:
// empty corners · 8 perimeter slots · the 4 stations in the centre 2×2.
// a rounded-corner PLUS outline (objectBoundingBox 0–1) — used both as the cross board's clip-path and,
// chamfered, as its print cut. r = corner radius as a fraction of the board.
// scale/ox/oy let the SAME plus be emitted in objectBoundingBox fractions (defaults — for the clip-path)
// OR in absolute inch coords (for the cut overlay), so the CUT exactly matches the ART edge (the clip).
// r may be a number (same radius everywhere) OR {conv,conc} (different convex/concave radii — needed when
// the path is a uniform OUTWARD OFFSET of another plus, e.g. the art bleed clip vs the cut).
function roundedPlusPath(a,b,r,scale,ox,oy){
  scale=scale||1; ox=ox||0; oy=oy||0;
  const rc=(r&&typeof r==='object')?r:{conv:r,conc:r};
  const P=[[a,0],[b,0],[b,a],[1,a],[1,b],[b,b],[b,1],[a,1],[a,b],[0,b],[0,a],[a,a]];
  const sweep=[1,1,0,1,1,0,1,1,0,1,1,0];   // outer (convex) corners sweep 1, inner (concave) 0
  const n=P.length, V=i=>P[((i%n)+n)%n], f=x=>+x.toFixed(4);
  const nrm=p=>{const L=Math.hypot(p[0],p[1])||1;return[p[0]/L,p[1]/L];};
  const X=v=>f(ox+v*scale), Y=v=>f(oy+v*scale);
  let d='',ch=[];
  for(let i=0;i<n;i++){
    const ri=sweep[i]===1?rc.conv:rc.conc;
    const cur=V(i),pv=V(i-1),nx=V(i+1);
    const inD=nrm([cur[0]-pv[0],cur[1]-pv[1]]), outD=nrm([nx[0]-cur[0],nx[1]-cur[1]]);
    const en=[cur[0]-ri*inD[0],cur[1]-ri*inD[1]], ex=[cur[0]+ri*outD[0],cur[1]+ri*outD[1]];
    const R=f(ri*scale);
    d+=(i===0?'M ':'L ')+X(en[0])+' '+Y(en[1])+' A '+R+' '+R+' 0 0 '+sweep[i]+' '+X(ex[0])+' '+Y(ex[1])+' ';
    ch.push([X(en[0]),Y(en[1])],[X(ex[0]),Y(ex[1])]);
  }
  return {d:d+'Z',ch};
}
// v3.4c.8 [ruled] — the arms reach only the BUILDING BAND: perimeter tracks are 1.32in deep (the building
// tile's depth), station tracks 2.5in, .3in gaps; the cut runs CROSS_PAD outside the slot band and hugs the
// station block by CROSS_P on the arm sides. Grid = 1.32+.3+2.5+.3+2.5+.3+1.32 = 8.54 → board 8.84in native.
const CROSS_PAD=0.15, CROSS_GAP=0.3, CROSS_P=0.1, BAND_D=1.32, STN_T=2.5;
const WHARF_W=+(2*(CROSS_PAD+BAND_D+CROSS_GAP)+2*STN_T+CROSS_GAP).toFixed(2);   // 8.84
const CROSS_A=+((CROSS_PAD+BAND_D+CROSS_GAP-CROSS_P)/WHARF_W).toFixed(4), CROSS_B=+(1-(CROSS_PAD+BAND_D+CROSS_GAP-CROSS_P)/WHARF_W).toFixed(4);
const CROSS_R=+(0.12/WHARF_W).toFixed(4);   // ≈.12in cut corner (matches the live board's die-cut radius)
const CROSS_BLEED=0.125;     // ⚙ art bleed past the cut line (1/8″) for laser-cut tolerance — the cut is unchanged; only the art extends
// the ART clip = the cut plus DILATED outward by CROSS_BLEED, over a bleed-enlarged element (W + 2·bleed).
// A true outward offset: arms longer & wider by the bleed, convex corner radius +bleed, concave −bleed.
const CROSS_ART=(function(){const Wd=WHARF_W+2*CROSS_BLEED, halfArm=(CROSS_B-CROSS_A)/2*WHARF_W+CROSS_BLEED;
  return {a:(Wd/2-halfArm)/Wd, b:(Wd/2+halfArm)/Wd,
    r:{conv:(CROSS_R*WHARF_W+CROSS_BLEED)/Wd, conc:Math.max(.0005,(CROSS_R*WHARF_W-CROSS_BLEED)/Wd)}};})();
function wharfCross(){

  const clip='<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><clipPath id="crossclip" clipPathUnits="objectBoundingBox"><path d="'+roundedPlusPath(CROSS_ART.a,CROSS_ART.b,CROSS_ART.r).d+'"/></clipPath></defs></svg>';
  const wharf='<div class="wharf">'
    +'<div></div>'+slot+slot+'<div></div>'

// printables2: the SCORE RING — one clockwise lap of 50 cells with a FIXED, elegant walk: 15 spaces along
// the top and bottom, 10 down each side, so every CORNER lands on a multiple of 5 — 0/50 (top-left, the
// start), 15 (top-right), 25 (bottom-right), 40 (bottom-left) — and every 5th cell carries the alternate
// band (count by fives). Passing 49 flips the disc's lap marker (+50 — the second lap).
function scoreRingCells(NW,NH,T){
  const uw=NW-2*T, uh=NH-2*T;
  const nTop=14, nSide=9;                       // runs between the corner squares: 14+corner=15 · 9+corner=10
  const wT=uw/nTop, hS=uh/nSide;
  const cells=[];let i=0;
  const C=(x,y)=>cells.push({i:i++,x,y,w:T,h:T,corner:true});
  C(0,0);                                                                                   // 0 / 50 · START
  for(let c=0;c<nTop;c++)cells.push({i:i++,x:T+c*wT,y:0,w:wT,h:T});                         // top: 1–14
  C(NW-T,0);                                                                                // 15 · top-right
  for(let c=0;c<nSide;c++)cells.push({i:i++,x:NW-T,y:T+c*hS,w:T,h:hS});                     // right: 16–24
  C(NW-T,NH-T);                                                                             // 25 · bottom-right
  for(let c=0;c<nTop;c++)cells.push({i:i++,x:NW-T-wT*(c+1),y:NH-T,w:wT,h:T});               // bottom: 26–39
  C(0,NH-T);                                                                                // 40 · bottom-left
  for(let c=0;c<nSide;c++)cells.push({i:i++,x:0,y:NH-T-hS*(c+1),w:T,h:hS});                 // left: 41–49
  return cells;
}
function scoreRingHtml(NW,NH,T){
  const cells=scoreRingCells(NW,NH,T);
  const box=c=>{const cls=(c.i===0?' start':(c.i%5===0?' five':''));
    return '<div class="ringcell'+cls+'" style="left:'+c.x.toFixed(3)+'in;top:'+c.y.toFixed(3)+'in;width:'+c.w.toFixed(3)+'in;height:'+c.h.toFixed(3)+'in">'
      +(c.i===0?LU('flag')+'<span class="lap">0 / 50</span>':c.i)+'</div>';};
  return '<div class="score-ring">'+cells.map(box).join('')+'</div>';
}

  return '<div class="sb">'+(ART_ON?'<img class="sb-art" src="'+ART_DIR+'seamap.png" alt="">':'')+'<div class="sb-wash"></div>'
    +seaLanes()
    +'<div class="hb" style="'+pos(SEA_HB)+'"><span>'+LU('anchor')+' Hamburg · the Wharf</span></div>'
    +Object.keys(SEA_SEG).map(k=>seaSeg(SEA_SEG[k],seats)).join('')
    +SEA_K.map(d=>seaKontor(d,slots)).join('')
    +seaBruges(side)
    +'<div class="sb-side">the sea board · side '+side+' · '+(side==='A'?'2 players':'3–4 players')+'</div>'
    +'</div>';}
// ---- the MARKET & STORES board (v8): the Ship display (3) · the Specialist display (4) · the
// cask stacks and the recipe stacks, ringed by the score ring. The Bourse lane, the contract
// display and the demand deck left the kit with v7. Every slot is its family's true footprint.
function supplyBoard(){
  const dslot=(fam,ic,smp,lbl)=>'<div class="dslot '+fam+'">'+LU(ic)+(lbl?'<span class="rn">'+lbl+'</span>':'')
    +(OVERLAY&&smp?'<div class="ovl">'+smp+'</div>':'')+'</div>';
  const shelf=(lbl,ic,slots)=>'<div class="shelf-lbl">'+LU(ic)+lbl+'<span class="bag">'+LU('shopping-bag')+'</span></div>'
    +'<div class="shelf">'+slots+'</div>';
  const smpShip=[shipCard('cog','London'),shipCard('hulk','Bergen'),shipCard('cog','Wild')];
  const smpImp=[0,1,2,3].map(i=>improveTile(IMPROVE[i]));
  const market=shelf('Ships — the display of 3 · commission at the Harbor (Cog free · Hulk 1G) · then Post on its lane','sailboat',smpShip.map(s=>dslot('s','sailboat',s)).join(''))
    +shelf('Specialists — the display of 4 · Bergen’s prize or the Gain 1 specialist bonus seats one, free','wrench',smpImp.map(s=>dslot('i','wrench',s)).join(''))
    +'<div class="mbox supply-note"><h4>'+LU('dices')+'The dice and the bits</h4><div class="b">The quality dice (11 per colour) stay by each player; the hall die stands on the sea board. Goods · ⚜ invitation tokens · the 3 Kontor chits · score discs: a general supply beside this board.</div></div>';
  // THE CASKS & RECIPES column: the six stacks (Gruit · Hopped · the Q3 pair · the Q4 · the Q5 —
  // the 3-of-4 deal leaves one export in the box, so the slots print the TIER) and the four
  // export recipe stacks. Cask slots cut 2.4×1 · recipe slots 1.85×2.55 — true.
  const ck=nm=>{const d=CASKS.find(c=>c.nm===nm);return d?caskCardBack(d,d.pin||poolFor(d.q)[0]):'';};
  const rc=nm=>{const r=RECIPES.find(r=>r.nm===nm)||STARTERS.find(r=>r.nm===nm);return r?recipeCard(r):'';};
  const brow=slots=>'<div class="brew-row">'+slots+'</div>';
  const brew=brow(dslot('c','beer',ck('Gruit'),'Gruit')+dslot('c','beer',ck('Hopped'),'Hopped'))
    +brow(dslot('c','quality-3',ck('Broyhan'),'a Q3 beer')+dslot('c','quality-3',ck('Keut'),'a Q3 beer'))
    +brow(dslot('c','quality-4',ck('Mumme'),'the Q4 beer')+dslot('c','quality-5',ck('Bock'),'the Q5 beer'))
    +brow(dslot('r','scroll-text',rc('Broyhan'),'recipes · Q3')+dslot('r','scroll-text',rc('Keut'),'recipes · Q3'))
    +brow(dslot('r','scroll-text',rc('Mumme'),'recipes · Q4')+dslot('r','scroll-text',rc('Bock'),'recipes · Q5'));
  const inner='<div class="mboard supply" style="position:absolute;left:'+SCORE_RING_T+'in;top:'+SCORE_RING_T+'in;'
      +'width:'+(SUPPLY_NW-2*SCORE_RING_T).toFixed(3)+'in;height:'+(SUPPLY_NH-2*SCORE_RING_T).toFixed(3)+'in">'
    +'<div class="mb-head"><h2>'+LU('store')+'Market &amp; Stores</h2><h2 class="spec-h">'+LU('beer')+'Casks &amp; Recipes</h2></div>'
    +'<div class="sup-cols">'
      +'<div class="sup-main">'+market+'</div>'
      +'<div class="sup-cellar">'+brew+'</div>'
    +'</div>'
  +'</div>';
  return '<div class="supply-outer">'+scoreRingHtml(SUPPLY_NW,SUPPLY_NH,SCORE_RING_T)+inner+'</div>';}

//==================================================================
// PAGINATION — deterministic sheets of absolutely positioned items
//==================================================================
function newPage(pages,section,label,geo){const p={section,label,items:[],cuts:[],circles:[],geo:geo||PG};pages.push(p);return p;}
function packRun(pages,section,label,kind,htmlList,famTag,famPages,geo){
  // pack same-size items in gapless rows; rows flow page to page (one unbroken grid). geo = page geometry (default PG; tiles use TILE_GEO)
  const G=geo||PG;
  const [nw,nh]=SIZE[kind];const w=+(nw*SCALE).toFixed(4),h=+(nh*SCALE).toFixed(4);   // footprint = native × SCALE
  const cols=Math.floor((G.w-0.4)/w);const x0=+( (G.w-cols*w)/2 ).toFixed(4);
  // continue the previous run only if it's the SAME section, SAME page size (geo), AND was itself packed by packRun
  // (_kind set) — so a run never spills onto a mirror-BACKS page or a board page that shares the section.
  let pg=pages.length&&pages[pages.length-1].section===section&&(pages[pages.length-1].geo||PG)===G&&pages[pages.length-1]._kind?pages[pages.length-1]:newPage(pages,section,label,G);
  let cx=pg._cx!==undefined?pg._cx:x0, cy=pg._cy!==undefined?pg._cy:G.y0, rh=pg._rh||0;
  if(pg._kind&&pg._kind!==kind){cx=x0;cy=cy+rh;rh=0;}   // a new size always starts a fresh row
  htmlList.forEach(html=>{
    if(cx+w>x0+cols*w+0.001){cx=x0;cy+=h;}
    if(cy+h>G.yMax){pg._cx=undefined;pg=newPage(pages,section,label,G);cx=x0;cy=G.y0;}
    pg.items.push({x:cx,y:cy,w,h,nat:[nw,nh],html});   // nat = native size; the renderer scales content → footprint
    if(CUTR[kind])pg.circles.push({cx:cx+w/2,cy:cy+h/2,r:+(CUTR[kind]*SCALE).toFixed(4)});
    else addRectCut(pg,cx,cy,w,h);
    if(kind==='frame'){   // owner RINGS: also cut the interior hole (sized to a building tile, so the ring frames it)
      const hw=+(SIZE.bld[0]*SCALE).toFixed(4),hh=+(SIZE.bld[1]*SCALE).toFixed(4),ix=+((w-hw)/2).toFixed(4),iy=+((h-hh)/2).toFixed(4);
      if(ix>0.02)addRectCut(pg,+(cx+ix).toFixed(4),+(cy+iy).toFixed(4),hw,hh);}
    if(famTag)(famPages[famTag]=famPages[famTag]||new Set()).add(pages.indexOf(pg));
    cx+=w;rh=h;
  });
  pg._cx=cx;pg._cy=cy;pg._rh=rh;pg._kind=kind;
}
function addRectCut(pg,x,y,w,h){  // dedupe shared edges → each grid line cuts ONCE
  const seg=(x1,y1,x2,y2)=>{const k=[x1,y1,x2,y2].map(v=>v.toFixed(3)).join(',');
    if(!pg._segs)pg._segs={};if(pg._segs[k])return;pg._segs[k]=1;pg.cuts.push([x1,y1,x2,y2]);};
  seg(x,y,x+w,y);seg(x,y+h,x+w,y+h);seg(x,y,x,y+h);seg(x+w,y,x+w,y+h);
}
// pack same-size items (a single kind) into a sub-rectangle [x0,y0]→[x1,y1] of an EXISTING page — used to tuck the
// small TOKENS into the empty corners of the main board sheet. Rows flow within the box; round tokens get a cut circle.
function packRegion(pages,pg,kind,htmlList,x0,y0,x1,y1,famTag,famPages,bleed){
  // bleed=true packs like packSpaced: box = tile + 1.5mm bleed/side (.bl wrapper extends the
  // colours), boxes touch (bleeds = the 3mm cut gap), each piece cut on its own rounded rect
  const [nw0,nh0]=SIZE[kind];
  const nw=bleed?+(nw0+2*TILE_BLEED_N).toFixed(3):nw0, nh=bleed?+(nh0+2*TILE_BLEED_N).toFixed(3):nh0;
  const w=+(nw*SCALE).toFixed(4),h=+(nh*SCALE).toFixed(4);
  const cols=Math.max(1,Math.floor((x1-x0)/w));let cx=x0,cy=y0,n=0,over=0;
  htmlList.forEach(html=>{
    if(n&&n%cols===0){cx=x0;cy=+(cy+h).toFixed(4);}
    if(cy+h>y1+0.01)over++;
    pg.items.push({x:+cx.toFixed(4),y:+cy.toFixed(4),w,h,nat:[nw,nh],html:bleed?'<div class="bl">'+html+'</div>':html});
    if(kind==='tok'||kind==='disc'||kind==='wtok')pg.circles.push({cx:+(cx+w/2).toFixed(4),cy:+(cy+h/2).toFixed(4),r:+(CUTR[kind]*SCALE).toFixed(4)});
    else if(bleed)(pg.rrects=pg.rrects||[]).push({x:+(cx+TILE_BLEED).toFixed(3),y:+(cy+TILE_BLEED).toFixed(3),w:+(w-2*TILE_BLEED).toFixed(3),h:+(h-2*TILE_BLEED).toFixed(3),r:TILE_CUT_R});
    else addRectCut(pg,cx,cy,w,h);
    cx=+(cx+w).toFixed(4);n++;
  });
  if(famTag)(famPages[famTag]=famPages[famTag]||new Set()).add(pages.indexOf(pg));
  if(over)console.warn('packRegion '+kind+': '+over+' items overflow the box bottom ('+y1+')');
}
function addPolyCut(pg,pts){   // a closed polygon cut (the Wharf cross) — consecutive vertices → cut segments
  for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];pg.cuts.push([a[0],a[1],b[0],b[1]]);}
}
// ---- SPACED tile sheets (2026-07-19) — casks · ships · buildings are laser-cut TILES on the 22″ plotter:
// one FAMILY per call → ONE fronts sheet (22in wide, height fitted to the content) + its BACKS sheet (the
// LEFT↔RIGHT mirror — flip / mount around chipboard, cut the sandwich once). EVERY piece is cut on its OWN
// ROUNDED-RECT path — one joined laser line whose radius matches the tile art's .09in corner (× SCALE) —
// and carries a 1.5mm BLEED all round (the .bl wrapper extends the colours/art past the cut; the content
// never moves). Adjacent bleed boxes TOUCH: 1.5 + 1.5mm of bleed IS the 3mm gap between cut lines, so the
// sheet interior is solid ink and a slightly misaligned laser still lands on colour.
// runs = [{kind, items:[{html,back,fam}]}] (two footprints — the Cog/Hulk carriers — pack as consecutive runs).
const TILE_CUT_R=+(0.09*SCALE).toFixed(3), TILE_MAX_H=15, TILE_W=22;
const TILE_BLEED=0.059, TILE_BLEED_N=+(0.059/SCALE).toFixed(3);   // 1.5mm print bleed per side · its native size (1.5mm ÷ SCALE)
function packSpaced(pages,section,label,runs,famPages){
  // 2026-08-18 (designer: "wrap the tiles — less wasted white space"): the runs FLOW as one
  // continuous stream — a new run continues the current row while width remains, and each
  // row advances by its TALLEST tile. Mixed heights in a row cut fine (every tile carries
  // its own rounded-rect path; side bleeds still touch along the shared edges). The backs
  // sheet mirrors per item, so duplex registration is unaffected.
  const B=TILE_BLEED,W=TILE_W;const items=[];
  let cx=0.4, cy=0.45, rh=0;
  runs.forEach(run=>{
    if(!run.items.length)return;
    const [nw0,nh0]=SIZE[run.kind];
    const nw=+(nw0+2*TILE_BLEED_N).toFixed(3),nh=+(nh0+2*TILE_BLEED_N).toFixed(3);   // the packed box = tile + bleed
    const w=+(nw*SCALE).toFixed(3),h=+(nh*SCALE).toFixed(3);
    run.items.forEach(it=>{
      if(cx+w>W-0.4+0.001){cx=0.4;cy=+(cy+rh).toFixed(3);rh=0;}   // wrap: the row closes at its tallest tile
      items.push({x:+cx.toFixed(3),y:cy,w,h,nat:[nw,nh],
        html:'<div class="bl">'+it.html+'</div>',back:it.back?'<div class="bl">'+it.back+'</div>':null,fam:it.fam});
      cx=+(cx+w).toFixed(3);rh=Math.max(rh,h);
    });
  });
  cy=+(cy+rh).toFixed(3);
  const H=+(cy+0.45).toFixed(2);
  if(H>TILE_MAX_H)console.warn('packSpaced: "'+label+'" exceeds the '+TILE_MAX_H+'in laser bed ('+H+'in)');
  const geo={w:W,h:H,y0:0.45,yMax:+(H-0.28).toFixed(2)};
  const cut=it=>({x:+(it.x+B).toFixed(3),y:+(it.y+B).toFixed(3),w:+(it.w-2*B).toFixed(3),h:+(it.h-2*B).toFixed(3),r:TILE_CUT_R});   // the cut hugs the TILE edge, inset past the bleed
  const fp=newPage(pages,section,label,geo);
  items.forEach(it=>{fp.items.push({x:it.x,y:it.y,w:it.w,h:it.h,nat:it.nat,html:it.html});
    (fp.rrects=fp.rrects||[]).push(cut(it));
    if(it.fam)(famPages[it.fam]=famPages[it.fam]||new Set()).add(pages.indexOf(fp));});
  if(items.some(it=>it.back)){
    const bp=newPage(pages,section,label.replace(' fronts','')+' — backs (the horizontal mirror: flip left↔right / mount around chipboard, cut once)',geo);
    items.forEach(it=>{if(!it.back)return;const mx=+(W-it.x-it.w).toFixed(3);
      bp.items.push({x:mx,y:it.y,w:it.w,h:it.h,nat:it.nat,html:it.back});
      (bp.rrects=bp.rrects||[]).push(cut({x:mx,y:it.y,w:it.w,h:it.h}));});
    (famPages['Card/tile backs']=famPages['Card/tile backs']||new Set()).add(pages.indexOf(bp));
  }
}
// a LETTER (8.5×11 landscape) board: designed at 9.8×7.0 and printed — like EVERY component in the kit —
// at the one global SCALE (×0.8), centred on the sheet. Consistency ruling (2026-07-13): nothing in the
// kit prints at its own bespoke scale; the sheets keep their paper sizes, the content rides SCALE.
function letterBoard(pages,section,label,html){
  const pg=newPage(pages,section,label);   // default PG geo = letter landscape (10.4×7.9 printable)
  const NW=9.8,NH=7.0, sc=SCALE;
  const w=+(NW*sc).toFixed(3),h=+(NH*sc).toFixed(3),x=+((PG.w-w)/2).toFixed(3),y=+((PG.h-h)/2).toFixed(3);
  pg.items.push({x,y,w,h,nat:[NW,NH],html});   // nat = the design size → itDiv scales the whole board by sc
  (pg.rrects=pg.rrects||[]).push({x,y,w,h,r:0.14});   // the board's die-cut, like its table-board siblings
}
// printables2: the Wharf (a CROSS) on its own trimmed 22-wide sheet.
function wharfBoardSheet(pages){
  const G=WHARF_GEO;const pg=newPage(pages,'boards','Main board — the Wharf (cross)',G);
  // WHARF cross — 1.32in slot bands + 2.5in station tracks + .3in gaps → an 8.84in native board.
  const W=WHARF_W, wx=0.4, wy=0.7, bl=CROSS_BLEED;
  const Ox=+(wx-bl).toFixed(4),Oy=+(wy-bl).toFixed(4),wn=W+2*bl;
  pg.items.push({x:Ox,y:Oy,w:+(wn*SCALE).toFixed(4),h:+(wn*SCALE).toFixed(4),nat:[wn,wn],html:wharfCross()});
  pg.cutPath=roundedPlusPath(CROSS_A,CROSS_B,CROSS_R,W,wx,wy).d;   // native cross outline; scaled to match the content via cutXform
  pg.cutXform='matrix('+SCALE+',0,0,'+SCALE+','+(+(Ox*(1-SCALE)).toFixed(4))+','+(+(Oy*(1-SCALE)).toFixed(4))+')';
  return pg;
}
// THE SEA BOARD — double-sided: side B (3–4p) is the FRONT sheet, side A (2p) the BACK.
// Both centre on the same trimmed 22-wide sheet, so the mounted board flips in register.
function seaBoardSheets(pages){
  const G=SEA_GEO;const w=+(SEA_NW*SCALE).toFixed(4),h=+(SEA_NH*SCALE).toFixed(4);
  const x=+((G.w-w)/2).toFixed(3),y=+((G.h-h)/2).toFixed(3);
  [['B','The sea board — side B (3–4 players): four post seats a segment · three building slots · the hall of 8 · the yard in zones of 3 (front — mount side A on the back)'],
   ['A','The sea board — side A (2 players): two post seats a segment · two building slots · the hall of 6 · the yard in zones of 2 (back)']].forEach(([side,label])=>{
    const pg=newPage(pages,'boards',label,G);
    pg.items.push({x,y,w,h,nat:[SEA_NW,SEA_NH],html:seaBoard(side)});
    pg.rrects=[{x,y,w,h,r:0.14}];});
}
// the MARKET & STORES board on its own trimmed 22in sheet.
function supplyBoardSheet(pages){
  const G=SUPPLY_GEO;const pg=newPage(pages,'boards','Market & Stores board',G);
  const w1=+(SUPPLY_NW*SCALE).toFixed(4),h1=+(SUPPLY_NH*SCALE).toFixed(4);
  const x1=+((G.w-w1)/2).toFixed(3), y1=+((G.h-h1)/2).toFixed(3);
  pg.items.push({x:x1,y:y1,w:w1,h:h1,nat:[SUPPLY_NW,SUPPLY_NH],html:supplyBoard()});
  pg.rrects=[{x:x1,y:y1,w:w1,h:h1,r:0.14}];

// the PLAYER AID tri-fold sheets: ONE full-bleed letter sheet each (front + mirrored back),
// three panels per sheet, TWO printed cut lines at the thirds (paper-cutter grey — the
// cards convention). Unscaled like the checklist: the sheet IS the component.
function aidTrifoldSheets(pages){
  const W=+(PG.w/3).toFixed(4), panels=aid3Panels();
  const mk=(label,list)=>{const pg=newPage(pages,'cards',label);
    list.forEach((html,i)=>pg.items.push({x:+(i*W+0.14).toFixed(3),y:0.3,w:+(W-0.28).toFixed(3),h:7.9,html}));
    pg.cuts.push([W,0.12,W,8.38],[+(2*W).toFixed(4),0.12,+(2*W).toFixed(4),8.38]);
    return pg;};
  mk('Player aid — fronts ×3 (identical panels · two cuts at the lines → three complete aids per sheet)',panels.front);
  mk('Player aid — backs ×3 (identical panels — any duplex flip registers)',panels.back);
}
function buildPages(){
  const pages=[],famPages={};
  // --- BOARDS ---
  wharfBoardSheet(pages);    // the Wharf (cross) — its own trimmed 22-wide sheet
  seaBoardSheets(pages);     // the sea board — side B front, side A back
  supplyBoardSheet(pages);   // the Market & Stores board — its own sheet
  // --- TILES vs CARDS — split by HOW they print:
  //   • TILES  → 22-wide PLOTTER sheets via packSpaced (casks · ships · Public Works · private
  //              building tiles · Kontor building tiles · Specialists): a 3mm gap between pieces,
  //              every piece cut on its own rounded-rect path (mount around chipboard, cut the sandwich once).
  //   • CARDS  → LETTER (8.5×11) cardstock on a HOME duplex printer: recipes and the player aids.
  //   • TOKENS → single-sided, their own trimmed 22-wide sheet: goods · ⚜ invitations · the Kontor chits.
  function mirrorBackPages(frontPages,meta,geo,label,section){let i=0;frontPages.forEach(fp=>{
    const bp=newPage(pages,section||'tiles',label,geo);
    fp.items.forEach(it=>{const f=meta[i++];const mx=+(geo.w-it.x-it.w).toFixed(4);
      addRectCut(bp,mx,it.y,it.w,it.h);
      if(f.rec)bp.items.push({x:mx,y:it.y,w:it.w,h:it.h,nat:it.nat,html:recipeCard(f.d,true)});});
    (famPages['Card/tile backs']=famPages['Card/tile backs']||new Set()).add(pages.indexOf(bp));
  });}
  // --- CASK TILES → their own 22″ plotter sheet (single-faced) ---
  // Gruit's sixteen all print Gain 2 goods (pinned); Hopped's twelve print the eight verbs, four
  // twice; each export's six = a 6-window over the eight-verb pool (the per-beer offset) — the
  // printed mix IS the stack a brew searches.
  const caskItems=[];
  CASKS.forEach(d=>{const pool=d.pin?[d.pin]:poolFor(d.q);
    for(let i=0;i<cnt(d.n);i++){const act=pool[(i+(d.off||0))%pool.length];
      caskItems.push({fam:'Cask tiles',html:caskCardBack(d,act)});}});
  packSpaced(pages,'tiles','Cask tiles — single-faced (the die seat · printed start value · quality · the cask bonus) · 22″ plotter · 1.5mm bleed · cuts 3mm apart',[{kind:'caskc',items:caskItems}],famPages);
  // --- SHIP TILES → their own sheet pair; the Cog and Hulk carriers pack as two runs ---
  const cogs=[],hulks=[];
  (MODE==='proof'?[['cog','London'],['hulk','Wild']]:SHIP_DECK).forEach(([hull,dest])=>{
    (hull==='cog'?cogs:hulks).push({fam:'Ships',html:shipCard(hull,dest),back:shipBack(hull)});});
  packSpaced(pages,'tiles','Ship tile fronts — the hulls (Cog 2 berths free · Hulk 3 berths 1G · per far Kontor Cog ×3 · Hulk ×2 · wild Cog ×2 · Hulk ×1 — deck 18, display 3) · 22″ plotter · 1.5mm bleed · double-sided',[{kind:'shipc',items:cogs},{kind:'shiph',items:hulks}],famPages);
  // --- PUBLIC WORKS → single-faced ---
  const bldItems=[];
  BUILDINGS.forEach(d=>{for(let i=0;i<cnt(d.n);i++)bldItems.push({fam:'Public Works',html:buildingCard(d)});});
  packSpaced(pages,'bits','Public Works — single-faced, the shared brown family (the filler roster of 7: deal 4 at every player count onto random slots; the rest to the box; nothing refills — the tide takes each with the Ship at its slot) · 22″ plotter · 1.5mm bleed',[{kind:'bld',items:bldItems}],famPages);
  // --- THE PRIVATE BUILDING TILES — the hand of four, one set per house colour: tier 1 FRONT,
  // tier 2 on the BACK (the FLIP turns the standing tile over in place). 2.5×1.32in.
  const privs=[];PLAYERS.slice(0,cnt(PLAYERS.length)).forEach(pl=>PRIVATES.forEach(d=>
    privs.push({fam:'Private building tiles',html:privateTile(d,1,pl.c),back:privateTile(d,2,pl.c)})));
  packSpaced(pages,'bits','Private building tiles — the hand of four, one set per house colour (tier 1 front / tier 2 back — the Flip turns it in place · printed ★ 2 / 4 · no die) · 22″ plotter · 1.5mm bleed · double-sided',[{kind:'bld',items:privs}],famPages);
  // --- THE KONTOR BUILDING TILES — the set of three per house colour, single-faced, 1.32in square
  const kbs=[];PLAYERS.slice(0,cnt(PLAYERS.length)).forEach(pl=>KBUILDINGS.forEach(d=>
    kbs.push({fam:'Kontor building tiles',html:kontorBuildingTile(d,pl.c)})));
  packSpaced(pages,'bits','Kontor building tiles — the set of three per house colour (Warehouse · Kontorhaus · Guildhouse; placed in a Kontor slot where your posts run the whole lane, marked with a supply die at 1) · 22″ plotter · 1.5mm bleed · single-faced',[{kind:'kbt',items:kbs}],famPages);
  // --- SPECIALISTS → single-faced 2in squares
  const wimps=[];IMPROVE.forEach(d=>{for(let i=0;i<cnt(d.n);i++)wimps.push({fam:'Specialists',html:improveTile(d)});});
  packSpaced(pages,'bits','Specialist tiles — the ten singles (single-sided) · 22″ plotter · 1.5mm bleed · cuts 3mm apart',[{kind:'imp',items:wimps}],famPages);
  // --- TOKENS → their own single-sided trimmed sheet: goods · ⚜ invitations · the Kontor chits ---

  // --- RECIPE CARDS (cardstock — do not mount) — DOUBLE-SIDED: cost face / BREWED face.

  const rStart=pages.length;
  packRun(pages,'cards','Recipe cards — fronts (Gruit · Hopped · the four exports, 1 set per player) — print double-sided, flip left↔right','card',recMeta.map(f=>recipeCard(f.d)),'Recipe cards',famPages);
  mirrorBackPages(pages.slice(rStart),recMeta,PG,'Recipe card backs (mirror — flip left↔right): the brewed face — flip on your first brew of that beer','cards');
  // PLAYER AID — a letter tri-fold: three identical double-sided panels per sheet
  aidTrifoldSheets(pages);
  pages.filter(p=>p.section==='cards').forEach(p=>p.papercut=true);
  // --- PLAYER BOARDS — two per sheet, a tight die-cut hugging the slot cluster ---
  {const W=7.65,H=3.85,sw=+(W*SCALE).toFixed(4),sh=+(H*SCALE).toFixed(4),X=+((PG.w-sw)/2).toFixed(2);
    const ps=PLAYERS.slice(0,cnt(PLAYERS.length));let bpg=null;

  const pg=newPage(pages,'list','Component checklist');

// PNG EXPORT — rasterize any component to a PNG (html2canvas) ·
// download individually, or a whole type as a .zip (JSZip).
// Filenames: <type>-<name>-<front|back>.png. High-res (×6) so the output meets/exceeds the 1024px source art.
//
// ---- REVIEW NOTE from a parallel session (2026-06-28) — findings on the export "seam line" ----
// I was chasing the same exported-card horizontal seam this `bakeArt()` flatten apparently fixes. Notes
// in case they're useful for review / future tweaks (no code change here — this is just a comment):
//  • ROOT CAUSE: html2canvas leaves a 1px seam at CSS linear-gradient COLOUR-STOPS. The visible line on
//    card backs was the coloured `var(--c) → transparent` end/foot gradients (.cc-back .ce.top/.ce.bot,
//    .bcard .bc-foot, ship foot), seaming at their stop (cask-gose-back: ~y34% = the .ce.top 36% stop).
//    If any seam survives bakeArt on cards whose gradient is a real DOM element (not part of the baked art
//    layer), converting that gradient to an inline SVG linearGradient (baked colour, stop-opacity not the
//    `transparent` keyword) renders seam-free — same trick already used for the scrim / station roof.
//  • DO NOT swap in html2canvas-pro to "fix gradients": tested — it renders gradients cleanly BUT TAINTS
//    the export canvas ("getImageData/toBlob … tainted by cross-origin data"), which breaks the download.
//  • html2canvas also ignores radial-gradients (station roof → SVG pattern), CSS filter (building-back
//    grey), and clip-path:url() (wharf board → re-clip via Path2D) — keep those SVG/Path2D workarounds.
//  • VERIFYING the export in a headless sandbox: reading full-res card screenshots trips a 32MB media
//    limit. Verify with a small render (scale 2) + a NUMERIC metric (2nd-difference of row brightness in
//    the 20–48% band) POSTed back via the local http server's request log — never read a big card image.
// ------------------------------------------------------------------------------------------------------
//==================================================================
