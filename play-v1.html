<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Brewhouses of the Hanse — v1.0 “Demand” (playtest)</title>
<style>
  :root{--bg:#1d1813;--panel:#2a231b;--panel2:#332a20;--ink:#f3e9d8;--muted:#b9a888;--line:#4a3d2c;
        --gold:#d9a441;--green:#6f9e5a;--red:#c4624a;--blue:#5a86a8;--purple:#8d6fa6;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
  h1,h2,h3{margin:.2em 0;font-weight:700}
  a{color:var(--gold)}
  .wrap{max-width:1180px;margin:0 auto;padding:10px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
  .bar .grow{flex:1}
  .pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px}
  .cols{display:grid;grid-template-columns:1fr 320px;gap:10px}
  @media(max-width:900px){.cols{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
  .card h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:6px}
  button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;font-size:13px}
  button:hover:not(:disabled){border-color:var(--gold)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.go{background:#3a5e2c;border-color:#557a3e}
  button.warn{background:#5e352c}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .wharf{display:grid;grid-template-columns:60px 1fr 1fr 60px;grid-template-rows:34px 1fr 1fr 34px;gap:6px;margin:4px 0}
  .stn{background:var(--panel2);border:2px solid var(--line);border-radius:8px;padding:8px;text-align:center;min-height:84px}
  .stn.lit{border-color:var(--gold);box-shadow:0 0 0 2px rgba(217,164,65,.25) inset}
  .stn .nm{font-weight:700}
  .stn .sub{font-size:11px;color:var(--muted)}
  .slot{background:#241d15;border:1px dashed var(--line);border-radius:6px;font-size:11px;padding:4px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:40px}
  .slot.lit{border-style:solid;border-color:var(--gold)}
  .slot.cask{background:#2c2417;border-color:#6b5732;border-style:solid}
  .slot.ship{background:#1f2a30;border-color:#3d5c6b;border-style:solid}
  .dest{border:1px solid var(--line);border-radius:8px;padding:7px;margin-bottom:6px;background:var(--panel2)}
  .dest .hd{display:flex;justify-content:space-between;font-weight:700}
  .dmd{font-size:11.5px;border-left:3px solid var(--gold);padding:1px 6px;margin:3px 0;background:#241d15;border-radius:0 5px 5px 0}
  .dmd.std{border-left-color:var(--muted);opacity:.85}
  .who{font-size:11px;color:var(--muted)}
  .log{font-size:12px;max-height:240px;overflow:auto;background:#1a150f;border:1px solid var(--line);border-radius:6px;padding:6px}
  .log div{padding:1px 0;border-bottom:1px solid #251e15}
  .q{display:inline-block;min-width:20px;text-align:center;border-radius:4px;padding:0 4px;font-weight:700;font-size:12px}
  .q1{background:#4a4030}.q2{background:#5a6e3e}.q3{background:#3e6e6a}.q4{background:#6a4e8a}.q5{background:#8a5a2a}
  .tag{font-size:11px;color:var(--muted)}
  .choice{background:#241d15;border:1px solid var(--gold);border-radius:8px;padding:8px;margin-top:6px}
  .me{outline:2px solid var(--gold)}
  .pboard{font-size:12.5px}
  .vessel{display:inline-block;background:#241d15;border:1px solid var(--line);border-radius:6px;padding:3px 6px;margin:2px}
  .small{font-size:11px;color:var(--muted)}
  table{border-collapse:collapse;width:100%;font-size:12px}
  td,th{border:1px solid var(--line);padding:2px 5px;text-align:center}
  .banner{background:#3a2c14;border:1px solid var(--gold);color:#f0d9a0;border-radius:8px;padding:6px 10px;margin-bottom:8px;font-size:12.5px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ============================================================================
   BREWHOUSES OF THE HANSE — v1.0 "DEMAND"  (playtest build, hotseat)
   First playable of the clean-sheet. Implements: the Wharf, the dual-role cask,
   the DEMAND BOARD (buildings author the demand that redefines delivery value),
   ships sail-when-full, charter, enshrine, majorities (the floor), the Flight,
   the Masterpiece, the Hall. No AI seats yet (hotseat). Specs: RULES-v1.md /
   COMPONENTS-v1.md.  Numbers are first-pass ⚙.
   ========================================================================== */
const KEY='hanse-v1-demand-001';
const VERSION='v1.0 “Demand” · playtest 001';
const HAS_DOM = (typeof document!=='undefined');

/* ---------- DATA ---------- */
const STN = {A:{nm:'Market',sub:'Source',pos:[0,0]},B:{nm:'Brewhouse',sub:'Brew',pos:[0,1]},
             C:{nm:'Harbor',sub:'Ship',pos:[1,0]},D:{nm:'Cellar',sub:'Age',pos:[1,1]}};
const ADJ = {A:['B','C'],B:['A','D'],C:['A','D'],D:['B','C']};
// lines: row/col -> [stations], and the 2 slots on that line
const LINES = {
  rowT:{stns:['A','B'],slots:['s_AB','s_BA']},
  rowB:{stns:['C','D'],slots:['s_CD','s_DC']},
  colL:{stns:['A','C'],slots:['s_AC','s_CA']},
  colR:{stns:['B','D'],slots:['s_BD','s_DB']},
};
const SLOT_IDS = ['s_AB','s_BA','s_CD','s_DC','s_AC','s_CA','s_BD','s_DB'];
const stationLines = st => Object.keys(LINES).filter(L=>LINES[L].stns.includes(st));

// recipes: q, brew cost {G,H}, buy cost to acquire at market
const RECIPES = {
  gruit :{nm:'Gruit', q:1, brew:{G:1,H:0}, buy:0,  fixedAction:'source'},
  hopped:{nm:'Hopped',q:2, brew:{G:1,H:1}, buy:0},
  broyhan:{nm:'Broyhan',q:3,brew:{G:2,H:1}, buy:2},
  keut  :{nm:'Keut',  q:3, brew:{G:2,H:1}, buy:2},
  mumme :{nm:'Mumme', q:4, brew:{G:2,H:2}, buy:3},
  bock  :{nm:'Bock',  q:5, brew:{G:3,H:2}, buy:3},
};
const EXPORTS = ['broyhan','keut','mumme','bock'];

// cask slot-actions (drawn at brew for Q2+; Gruit fixed to source)
const CASK_ACTIONS = {
  source :{nm:'Source',desc:'+2 goods'},
  age    :{nm:'Age',   desc:'age a cask +2'},
  load   :{nm:'Load',  desc:'free-load a cask'},
  reach  :{nm:'Reach', desc:'+1 presence (majority)'},
  convert:{nm:'Convert',desc:'2 goods G↔H'},
  survey :{nm:'Survey',desc:'draw a demand tile'},
  wild   :{nm:'Wild',  desc:'any base action (Q4+)'},
};
const DRAWABLE = ['source','age','load','reach','convert','survey'];

// destinations
const DESTS = {
  bruges  :{nm:'Bruges',  gate:1, base:1, slots:3, benefit:'goods', maj:[4,2,0], kontor:true},
  london  :{nm:'London',  gate:2, base:1, slots:2, benefit:'upgrade',maj:[5,3,1], kontor:true},
  bergen  :{nm:'Bergen',  gate:2, base:1, slots:2, benefit:'goods', maj:[9,5,2], kontor:true},
  novgorod:{nm:'Novgorod',gate:3, base:2, slots:2, benefit:'upgrade',maj:[8,5,2], kontor:true},
  hall    :{nm:'The Hall', gate:2, base:0, slots:0, benefit:'none', maj:null, kontor:false},
};
const KONTORE = ['bruges','london','bergen','novgorod'];
const HALL_LADDER = {2:4,3:6,4:8,5:10};

// DEMAND tile definitions (the new content family). match(q)->bool, val(q,side)->pts.
const DEMAND_DEFS = {
  thirst :{nm:'The Thirst',   match:q=>true,   val:(q,s)=>q,          kickG:false, desc:'+1★ per quality level'},
  crav2  :{nm:'Craving Q2',   match:q=>q===2,  val:(q,s)=>s?4:2,      kickG:false, desc:'Q2 → +4★/+2'},
  crav3  :{nm:'Craving Q3',   match:q=>q===3,  val:(q,s)=>s?5:2,      kickG:false, desc:'Q3 → +5★/+2'},
  crav4  :{nm:'Craving Q4',   match:q=>q===4,  val:(q,s)=>s?6:3,      kickG:false, desc:'Q4 → +6★/+3'},
  conn   :{nm:'Connoisseur',  match:q=>q===5,  val:(q,s)=>s?8:3,      kickG:false, desc:'Q5 → +8★/+3'},
  premium:{nm:'Premium',      match:q=>q>=4,   val:(q,s)=>s?5:3,      kickG:false, desc:'Q4+ → +5★/+3'},
  hub    :{nm:'The Hub',      match:q=>true,   val:(q,s)=>s?3:1,      kickG:true,  desc:'any → +3★/+1 (owner +1G/rival)'},
  hopped :{nm:'Hopped Style', match:q=>q>=2,   val:(q,s)=>s?4:2,      kickG:false, desc:'Q2+ → +4★/+2'},
};
// deck contents (defId repeated by rarity)
const DEMAND_DECK = ['thirst','thirst','thirst','crav2','crav2','crav3','crav3','crav4','crav4',
  'conn','premium','premium','hub','hub','hopped','hopped'];

const SAILED_CAP = {2:7,3:11,4:14};
const MAX_ROUND = 25;
const STORE_CAP = 8;
const CHARTER_FARE = 2;

/* ---------- STATE ---------- */
let S=null, UI={}, undoStack=[], _id=0;
const uid = ()=> (++_id);
function rng(n){return Math.floor(Math.random()*n);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rng(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

function freshState(nPlayers, names){
  _id=0;
  const dealExports = shuffle(EXPORTS).slice(0,3);           // deal 3 of 4
  const topTier = Math.max(...dealExports.map(e=>RECIPES[e].q)); // the Masterpiece tier
  const demandDeck = shuffle(DEMAND_DECK);
  const players=[];
  for(let i=0;i<nPlayers;i++){
    players.push({
      id:i, name:(names&&names[i])||('Player '+(i+1)),
      G:3+(i>0?1:0), H:2,
      vessels:[null,null],                 // maturing casks (cap 2; +1 via Extra Vessel)
      recipes:['gruit','hopped'],
      upgrades:[],
      contracts:2,
      demandHand:[ demandDeck.pop() ],      // 1 starting demand tile
      station:null,
      deliverPts:0, enshrinePts:0, mpDone:false,
      delivered:{},                         // dest -> count (for majority)
      tiers:{},                             // q -> true (for Flight)
      reachBonus:0,                         // pending +presence (reach)
    });
    players[i].delivered = {bruges:0,london:0,bergen:0,novgorod:0};
  }
  const dests={};
  for(const k in DESTS){ dests[k]={...DESTS[k], demand:[], deliveredCount:0}; }
  // seed 1 neutral demand on each kontor
  for(const k of KONTORE){ dests[k].demand.push({def:demandDeck.pop(), owner:null, side:'spike'}); }
  // ships
  const shipDeck = shuffle(buildShipDeck());
  const slots={}; SLOT_IDS.forEach(s=>slots[s]=null);
  // warm start: a Hulk->Bruges + one more ship on slots, spread
  placeShip(slots, {dest:'bruges',cap:3,id:uid(),berths:[]}, 's_AC');
  const w2=shipDeck.pop(); placeShip(slots, {dest:w2.dest,cap:w2.cap,id:uid(),berths:[]}, 's_DB');
  // one Ready Gruit per player to deploy
  players.forEach(p=>{ p.vessels[0]={q:1,action:'source',age:1,ready:true,id:uid()}; });

  S={ n:nPlayers, players, dests, slots,
      shipDeck, shipMarket:[shipDeck.pop(),shipDeck.pop(),shipDeck.pop()],
      demandDeck, demandDisplay:[demandDeck.pop(),demandDeck.pop(),demandDeck.pop(),demandDeck.pop()],
      dealExports, topTier, mpClaimed:false,
      sailed:0, cap:(SAILED_CAP[nPlayers]||14),
      round:1, active:0, first:0, ending:false, over:false,
      log:[] };
  UI={sub:'place'};
  log('— Setup complete. Deal: '+dealExports.map(e=>RECIPES[e].nm).join(', ')+' (top tier Q'+topTier+'). —');
  return S;
}
function buildShipDeck(){
  const d=[]; KONTORE.forEach(k=>{ for(let i=0;i<5;i++) d.push({dest:k, cap:(i<3?2:3)}); }); return d;
}
function placeShip(slots, ship, prefId){
  if(!slots[prefId]){ slots[prefId]={type:'ship',ship}; return prefId; }
  for(const s of SLOT_IDS) if(!slots[s]){ slots[s]={type:'ship',ship}; return s; }
  return null;
}
function log(m){ S.log.unshift(m); if(S.log.length>200)S.log.pop(); }

/* ---------- HELPERS ---------- */
const P = ()=>S.players[S.active];
const isMyTurn = pid => pid===S.active;
function openSlot(){ return SLOT_IDS.find(s=>!S.slots[s]); }
function casksOnSlots(pid){ return SLOT_IDS.filter(s=>S.slots[s]&&S.slots[s].type==='cask'&&(pid==null||S.slots[s].cask.owner===pid)); }
function deployable(p){ return p.vessels.map((v,i)=>({v,i})).filter(x=>x.v&&x.v.ready); }
function pay(p,g,h){ p.G-=g; p.H-=h; }
function gain(p,g,h){ p.G=Math.min(STORE_CAP,p.G+g); p.H=Math.min(STORE_CAP,p.H+h); }
function canAfford(p,c){ return p.G>=(c.G||0)&&p.H>=(c.H||0); }
function readyAt(q){ return q; } // higher quality matures longer
function eligibleDest(dest,q){ return DESTS[dest].gate<=q; }

function snapshot(){ try{ undoStack.push(JSON.stringify({S,UI,_id})); if(undoStack.length>40)undoStack.shift(); }catch(e){} }
function undo(){ if(!undoStack.length)return; const o=JSON.parse(undoStack.pop()); S=o.S;UI=o.UI;_id=o._id; render(); }
function save(){ if(HAS_DOM) try{localStorage.setItem(KEY,JSON.stringify({S,_id}));}catch(e){} }
function load(){ if(!HAS_DOM)return false; try{const o=JSON.parse(localStorage.getItem(KEY)); if(o&&o.S){S=o.S;_id=o._id||0;UI={sub:(S.over?'over':'turn')};return true;}}catch(e){} return false; }

/* ---------- TURN MACHINE ---------- */
function beginTurn(){
  const p=P();
  // passive aging +1 at start of your turn
  p.vessels.forEach(v=>{ if(v&&!v.ready){ v.age++; if(v.age>=readyAt(v.q)) v.ready=true; } });
  p.reachBonus=0;
  UI.turn={moved:(S.round===1?false:false), line:null, usedStn:{}, usedSlot:{}, floorUsed:false, fromStation:p.station};
  UI.sub = (p.station==null?'place':'move');
  render();
}
function doPlace(st){ snapshot(); const p=P(); p.station=st; UI.turn.moved=true; UI.turn.line=null; UI.sub='line'; log(p.name+' places at '+STN[st].nm); render(); }
function doMove(st){
  snapshot(); const p=P();
  const rivals = S.players.some(q=>q.id!==p.id && q.station===st);
  p.station=st; UI.turn.moved=true; UI.turn.line=null;
  if(rivals){ UI.sub='toll'; UI.tollStation=st; }
  else { UI.sub='line'; }
  log(p.name+' → '+STN[st].nm);
  render();
}
function payToll(){ snapshot(); const p=P(); const t=Math.min(1,p.G); p.G-=t; log(p.name+' pays toll '+t+'G'); UI.sub='line'; render(); }
function useFloorPrompt(){ UI.sub='floor'; render(); }
function doFloor(vi){ snapshot(); const p=P(); const v=p.vessels[vi]; if(v){ runCaskAction(p,v.action,'floor'); UI.turn.floorUsed=true; log(p.name+' taps the floor: '+CASK_ACTIONS[v.action].nm); } UI.sub='line'; render(); }
function chooseLine(L){ snapshot(); UI.turn.line=L; UI.sub='turn'; render(); }

function endTurn(){
  snapshot();
  // check end trigger
  if(S.sailed>=S.cap && !S.ending){ S.ending=true; S.endAt=S.first; log('★ Sailed-Ships track FULL — final round.'); }
  const p=P();
  // advance
  let next=(S.active+1)%S.n;
  S.active=next;
  if(next===S.first){ S.round++; }
  if( (S.ending && next===S.first) || S.round>MAX_ROUND ){ gameOver(); return; }
  UI.choice=null;
  beginTurn();
}

/* ---------- ACTIONS: stations ---------- */
function stationAvailable(st){
  const t=UI.turn; if(!t||!t.line) return false;
  return LINES[t.line].stns.includes(st) && !t.usedStn[st];
}
function useStation(st){
  const p=P();
  if(st==='A') marketMenu();
  else if(st==='B') brewMenu();
  else if(st==='D') cellarStart();
  else if(st==='C') harborMenu();
}
function markStn(st){ UI.turn.usedStn[st]=true; }

function marketMenu(){
  const p=P(); const opts=[];
  opts.push({label:'Take 2 goods', fn:()=>{ snapshot(); gain(p,2,0); markStn('A'); log(p.name+' sources 2G'); closeChoice(); }});
  // acquire recipe
  EXPORTS.filter(e=>!p.recipes.includes(e)).forEach(e=>{ const c=RECIPES[e];
    opts.push({label:'Buy recipe '+c.nm+' (Q'+c.q+', '+c.buy+'G)', dis:p.G<c.buy, fn:()=>{ snapshot(); p.G-=c.buy; p.recipes.push(e); markStn('A'); log(p.name+' learns '+c.nm); closeChoice(); }});
  });
  // commission ship
  S.shipMarket.forEach((sh,i)=>{ if(!sh)return;
    opts.push({label:'Commission '+DESTS[sh.dest].nm+' '+(sh.cap===3?'Hulk':'Cog')+' (2G)', dis:p.G<2||!openSlot(), fn:()=>commissionShip(i)});
  });
  // charter contract
  opts.push({label:'Buy charter contract (1G)', dis:p.G<1, fn:()=>{ snapshot(); p.G-=1; p.contracts++; markStn('A'); log(p.name+' buys a contract'); closeChoice(); }});
  const anyOpenDemand = KONTORE.some(k=>S.dests[k].demand.length<S.dests[k].slots);
  // install a demand tile you already hold (starting tile / Survey draws) — free
  p.demandHand.forEach((d,i)=>{ const def=DEMAND_DEFS[d];
    opts.push({label:'Install held “'+def.nm+'” (free) ▸', dis:!anyOpenDemand, fn:()=>installHeld(i)});
  });
  // take a demand tile from the display and install it (2G)
  S.demandDisplay.forEach((d,i)=>{ if(!d)return; const def=DEMAND_DEFS[d];
    opts.push({label:'Take demand “'+def.nm+'” (2G) ▸ install', dis:p.G<2||!anyOpenDemand, fn:()=>installFlow(i)});
  });
  setChoice('Market — Source & author', opts, true);
}
function installHeld(i){
  const p=P(); const def=p.demandHand[i];
  const dopts=KONTORE.filter(k=>S.dests[k].demand.length<S.dests[k].slots)
    .map(k=>({label:'Install at '+DESTS[k].nm+' ('+S.dests[k].demand.length+'/'+S.dests[k].slots+')',
      fn:()=>{ snapshot(); S.dests[k].demand.push({def, owner:p.id, side:'spike'}); p.demandHand.splice(i,1);
               markStn('A'); log(p.name+' authors “'+DEMAND_DEFS[def].nm+'” at '+DESTS[k].nm+' (held)'); closeChoice(); }}));
  if(!dopts.length){ setChoice('No open demand slot', [{label:'Back',fn:closeChoice}], true); return; }
  setChoice('Install held “'+DEMAND_DEFS[def].nm+'” where?', dopts, true);
}
function commissionShip(i){
  const p=P(); snapshot(); const sh=S.shipMarket[i]; p.G-=2;
  const slot=openSlot(); S.slots[slot]={type:'ship',ship:{dest:sh.dest,cap:sh.cap,id:uid(),berths:[]}};
  S.shipMarket[i]=S.shipDeck.length?S.shipDeck.pop():null;
  markStn('A'); log(p.name+' commissions a '+DESTS[sh.dest].nm+' hull');
  // free berth: load a ready cask (vessel or slot) if eligible
  closeChoice();
  const ship=S.slots[slot].ship;
  const cands=loadCandidates(p,ship,true);
  if(cands.length){ setChoice('Free berth aboard the new hull (optional)',
     cands.map(c=>({label:c.label, fn:()=>{ loadAboard(c, ship); closeChoice(); render(); }}))
     .concat([{label:'Skip',fn:()=>{closeChoice();render();}}]), true); }
  else render();
}
function installFlow(i){
  const p=P(); const def=S.demandDisplay[i];
  const dopts=KONTORE.filter(k=>S.dests[k].demand.length<S.dests[k].slots)
    .map(k=>({label:'Install at '+DESTS[k].nm+' ('+S.dests[k].demand.length+'/'+S.dests[k].slots+')',
      fn:()=>{ snapshot(); p.G-=2; S.dests[k].demand.push({def:def,owner:p.id,side:'spike'});
               S.demandDisplay[i]=S.demandDeck.length?S.demandDeck.pop():null; markStn('A');
               log(p.name+' authors “'+DEMAND_DEFS[def].nm+'” at '+DESTS[k].nm); closeChoice(); }}));
  if(!dopts.length){ setChoice('No open demand slot at any kontor', [{label:'Back',fn:closeChoice}], true); return; }
  setChoice('Install “'+DEMAND_DEFS[def].nm+'” where?', dopts, true);
}

function brewMenu(){
  const p=P(); const open=p.vessels.findIndex(v=>!v);
  if(open<0){ setChoice('Brewhouse', [{label:'No open vessel',fn:closeChoice}], true); return; }
  const opts=p.recipes.filter(r=>canAfford(p,RECIPES[r].brew)).map(r=>{ const c=RECIPES[r];
    return {label:'Brew '+c.nm+' (Q'+c.q+', '+(c.brew.G||0)+'G'+(c.brew.H?'+'+c.brew.H+'H':'')+')', fn:()=>{
      snapshot(); pay(p,c.brew.G||0,c.brew.H||0);
      const action = c.fixedAction || DRAWABLE[rng(DRAWABLE.length)];
      const finalAction = (c.q>=4 && Math.random()<0.18)?'wild':action;
      p.vessels[open]={q:c.q,action:finalAction,age:0,ready:(readyAt(c.q)<=0),id:uid()};
      markStn('B'); log(p.name+' brews '+c.nm+' ['+CASK_ACTIONS[finalAction].nm+']'); closeChoice();
    }};
  });
  if(!opts.length) opts.push({label:"Can't afford any brew",fn:closeChoice});
  setChoice('Brewhouse — Brew', opts, true);
}

function cellarStart(){ UI.agePts=3; UI.sub='age'; closeChoice(); render(); }

function loadCandidates(p, ship, allowVessel){
  // returns cargo the active player may load: own deployed casks (+rival's), and (for commission) own vessel-ready
  const list=[];
  casksOnSlots(null).forEach(s=>{ const c=S.slots[s].cask; if(eligibleDest(ship.dest,c.q)) list.push({kind:'slot',slot:s,owner:c.owner,q:c.q,action:c.action,label:(c.owner===p.id?'your':S.players[c.owner].name+'’s')+' Q'+c.q+' (slot)'}); });
  if(allowVessel){ deployable(p).forEach(x=>{ if(eligibleDest(ship.dest,x.v.q)) list.push({kind:'vessel',vi:x.i,owner:p.id,q:x.v.q,action:x.v.action,label:'your Q'+x.v.q+' (vessel)'}); }); }
  return list;

function shipsOnBoard(){ return SLOT_IDS.filter(s=>S.slots[s]&&S.slots[s].type==='ship').map(s=>({slot:s,ship:S.slots[s].ship})); }
function loadMenu(free){

  const opts=[];

    cands.forEach(c=>opts.push({label:'→ '+DESTS[o.ship.dest].nm+' ['+o.ship.berths.length+'/'+o.ship.cap+']: load '+c.label,
      fn:()=>{ snapshot(); loadAboard(c,o.ship); if(!free) markStn('C'); closeChoice(); render(); }}));
  });
  if(!opts.length) opts.push({label:'No eligible cask/ship pair',fn:harborMenu});
  setChoice('Load onto which ship?', opts, true);
}
function loadAboard(c, ship){
  const p=P();
  // remove cargo from origin
  if(c.kind==='slot'){ const cask=S.slots[c.slot].cask; S.slots[c.slot]=null; ship.berths.push({owner:cask.owner,q:cask.q,action:cask.action});
     if(cask.owner!==p.id){ gain(p,1,0); log(p.name+' loads '+S.players[cask.owner].name+'’s cask (+1G loader)'); } }
  else { const v=p.vessels[c.vi]; p.vessels[c.vi]=null; ship.berths.push({owner:p.id,q:v.q,action:v.action}); }
  log(p.name+' loads a Q'+c.q+' → '+DESTS[ship.dest].nm+' ['+ship.berths.length+'/'+ship.cap+']');
  if(ship.berths.length>=ship.cap) sailShip(ship);
}
function sailShip(ship){
  // find & clear its slot
  const slot=SLOT_IDS.find(s=>S.slots[s]&&S.slots[s].type==='ship'&&S.slots[s].ship.id===ship.id);
  if(slot) S.slots[slot]=null;
  log('⛵ '+DESTS[ship.dest].nm+' hull sails FULL ('+ship.berths.length+').');
  ship.berths.forEach(b=> deliverCask(b, ship.dest));
  S.shipDeck.unshift({dest:ship.dest,cap:ship.cap}); // hull returns
  S.sailed++; checkClock();
}

        deliverCask({owner:p.id,q:v.q,action:v.action},k); markStn('C'); log(p.name+' charters a Q'+v.q+' → '+DESTS[k].nm); S.sailed++; closeChoice(); checkClock(); render(); }})); });

/* ---------- DELIVERY & SCORING ---------- */
function deliverCask(b, destKey){
  const owner=S.players[b.owner]; const dest=S.dests[destKey]; let v=dest.base;
  dest.demand.forEach(t=>{ const def=DEMAND_DEFS[t.def]; if(def.match(b.q)){
     const pts=def.val(b.q, t.side==='spike'); v+=pts;
     if(t.side==='spike' && pts>0){ t.side='standing'; }
     if(t.owner!=null && t.owner!==b.owner && def.kickG){ gain(S.players[t.owner],1,0); }
  }});
  owner.deliverPts+=v; owner.delivered[destKey]=(owner.delivered[destKey]||0)+1; dest.deliveredCount++;
  owner.tiers[b.q]=true;
  // benefit on delivery
  if(dest.benefit==='goods'){ gain(owner,2,0); }
  else if(dest.benefit==='upgrade'){ /* upgrade earn — simplified: +1 contract as placeholder engine reward */ owner.contracts++; }
  // masterpiece
  if(!S.mpClaimed && b.q===S.topTier){ S.mpClaimed=true; owner.mpDone=true; owner.deliverPts+=3; gain(owner,3,0); log('🏆 '+owner.name+' earns the MASTERPIECE (Q'+b.q+'): +3★ +3 goods'); }
  log('   ↳ '+owner.name+' delivers Q'+b.q+' to '+dest.nm+' for '+v+'★');
}
function checkClock(){ if(S.sailed>=S.cap && !S.ending){ S.ending=true; log('★ Sailed-Ships FULL — finish the round.'); } }

function flightPts(p){ const n=Object.keys(p.tiers).length; return n>=3?(n-1)*(n-1):0; }
function majorityScores(){
  const out={}; S.players.forEach(p=>out[p.id]=0);
  KONTORE.forEach(k=>{ const tiers=DESTS[k].maj;
    const arr=S.players.map(p=>({id:p.id,c:p.delivered[k]||0})).filter(x=>x.c>0).sort((a,b)=>b.c-a.c);
    if(!arr.length)return;
    const ranks = (S.n===2)? [tiers[0]] : [tiers[0],tiers[1],tiers[2]];
    // group ties, split sum
    let idx=0;
    while(idx<arr.length && idx<ranks.length){
      let j=idx; while(j+1<arr.length && arr[j+1].c===arr[idx].c) j++;
      const span=ranks.slice(idx, j+1); const sum=span.reduce((a,b)=>a+(b||0),0); const each=sum/(j-idx+1);
      for(let t=idx;t<=j;t++) out[arr[t].id]+=each;
      idx=j+1;
    }
  });
  return out;
}
function finalScores(){
  const maj=majorityScores();
  return S.players.map(p=>{ const fl=flightPts(p);
    const total=p.deliverPts+p.enshrinePts+(maj[p.id]||0)+fl;
    return {id:p.id,name:p.name,deliver:p.deliverPts,enshrine:p.enshrinePts,maj:Math.round((maj[p.id]||0)*10)/10,flight:fl,total:Math.round(total*10)/10,goods:p.G+p.H};
  }).sort((a,b)=> b.total-a.total || b.goods-a.goods);
}
function gameOver(){ S.over=true; UI.sub='over'; log('=== GAME OVER (round '+S.round+') ==='); save(); render(); }

/* ---------- cask slot-action (public, on a line) & floor ---------- */
function runCaskAction(p, act, ctx){
  if(act==='source') gain(p,2,0);
  else if(act==='age'){ const v=p.vessels.find(v=>v&&!v.ready); if(v){ v.age+=2; if(v.age>=readyAt(v.q))v.ready=true; } }
  else if(act==='convert'){ if(p.G>=1){p.G-=1;gain(p,0,1);} }
  else if(act==='reach') p.reachBonus++;
  else if(act==='survey'){ if(S.demandDeck.length) p.demandHand.push(S.demandDeck.pop()); }
  else if(act==='load'){ /* handled via load UI when used as slot building */ }
  else if(act==='source') gain(p,2,0);
}
function useSlotBuilding(slotId){
  const p=P(); const cell=S.slots[slotId]; if(!cell) return;
  snapshot();
  if(cell.type==='cask'){ const a=cell.cask.action;
    if(a==='load'){ loadMenu(true); UI.turn.usedSlot[slotId]=true; return; }
    runCaskAction(p,a,'slot'); log(p.name+' uses cask action '+CASK_ACTIONS[a].nm);
  } else if(cell.type==='ship'){ loadMenu(true); UI.turn.usedSlot[slotId]=true; return; }
  UI.turn.usedSlot[slotId]=true; closeChoice(); render();
}
function deployCask(vi){ const p=P(); const v=p.vessels[vi]; if(!v||!v.ready)return; const slot=openSlot(); if(!slot){ flash('No open slot — clogged.'); return; }
  snapshot(); S.slots[slot]={type:'cask',cask:{owner:p.id,q:v.q,action:v.action}}; p.vessels[vi]=null; log(p.name+' deploys a Q'+v.q+' to the ring'); render(); }

  endTurn:()=>{ closeChoice(); endTurn(); save(); },
};
function wire(){
  // station/slot clicks to move (when in move sub) — convenience
  if(UI.sub==='move'){ document.querySelectorAll('[data-stn]').forEach(el=>{ const st=el.getAttribute('data-stn'); if(ADJ[P().station].includes(st)) el.onclick=()=>doMove(st); }); }
}

/* ---------- BOOT ---------- */
if(HAS_DOM){ if(!load()){ S=null; } render(); }

/* ---------- HEADLESS API (for node smoke test) ---------- */
if(typeof globalThis!=='undefined'){ globalThis.__V1={
  get S(){return S;}, set S(v){S=v;}, get UI(){return UI;},
  freshState, beginTurn, endTurn, P, render, finalScores, DESTS, KONTORE,
  deployCask, sailShip, deliverCask, gameOver,
  // expose internals the bot drives:
  api:{ doPlace,doMove,payToll,chooseLine,useStation,deployCask,
        marketMenu,brewMenu,cellarStart,ageInto,ageDone,harborMenu,
        loadMenu,enshrineMenu,charterMenu, useSlotBuilding,
        get choice(){return UI.choice;}, openSlot, casksOnSlots, deployable, stationLines, ADJ, LINES, SLOT_IDS }
};}
