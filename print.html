<!DOCTYPE html>
<html lang="en">
<head>

<title>Brewhouses of the Hanse — Print &amp; Play · v4.17b “Champion’s Tour”</title>
<style>
  :root{--ink:#2b2018;--ink2:#5b4a37;--parch:#f3e9d2;--parch2:#e9dcc0;--line:#333;--gold:#b8860b;
    --sea:#274b5c;--green:#4a6b3a;--red:#7c2128;--violet:#5b3a8e;--vp:#b8860b;}
  *{box-sizing:border-box}
  body{margin:0;background:#e7e2d6;color:var(--ink);font-family:"Iowan Old Style",Georgia,serif;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar{position:sticky;top:0;z-index:10;background:var(--ink);color:var(--parch);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .bar h1{font-size:1.05rem;margin:0;font-variant:small-caps;letter-spacing:.5px}
  .bar a{color:var(--gold);text-decoration:none;font-size:.85rem}
  .bar button{font-family:inherit;cursor:pointer;border:none;border-radius:6px;padding:6px 13px;font-weight:bold;background:var(--gold);color:var(--ink)}
  .bar .seg{display:inline-flex;border:1px solid var(--gold);border-radius:6px;overflow:hidden}
  .bar .seg button{border-radius:0;background:transparent;color:var(--parch);font-weight:normal}
  .bar .seg button.on{background:var(--gold);color:var(--ink)}
  .bar .bsub{font-weight:normal;font-size:.66rem;opacity:.55;font-variant:small-caps;letter-spacing:1.5px;margin-left:10px}
  .bar .bsel{font-family:inherit;font-size:.85rem;border-radius:6px;padding:5px 10px;border:1px solid var(--gold);background:var(--ink);color:var(--parch);cursor:pointer}
  .bar #vsel{margin-left:auto}   /* title · the site nav · then the tool controls, pushed right */
  .note{font-size:.78rem;opacity:.85}
  /* ====== PAGE = US Letter LANDSCAPE, FULL PAPER (11×8.5in; content inset .3in) ======
     The sheet div IS the paper: an exported sheet PNG scaled to exactly 11×8.5 is at true size and
     registers with the cut-lines PDF (@page margin 0 — the same coordinate space edge to edge). */
  @media print{ @page{size:letter landscape;margin:0} }
  .page{width:11in;height:8.5in;background:#fff;margin:14px auto;box-shadow:0 3px 14px rgba(0,0,0,.25);position:relative;overflow:hidden}
  /* LARGE-FORMAT sheets (laser cutter / plotter) are 22in wide but each is trimmed to its own content HEIGHT so we
     don't run blank media — render() emits one named @page + .lgNN rule per distinct height into <style id=dynpage>. */
  @media print{.no-print{display:none} body{background:#fff} .page{margin:0;box-shadow:none;break-after:page}
    body.solo .page{display:none} body.solo .page.soloed{display:block}}
  /* every printed piece sits in an absolutely positioned .it box (inches) — layout is identical in
     ART and CUT layers; the CUT layer only hides the art and reveals the cut strokes in the overlay svg */
  .it{position:absolute}
  body.cut .it{visibility:hidden}
  /* baseline inline-icon size — body-text icons track the local font; component CSS overrides with explicit sizes */
  .ic{width:1em;height:1em;vertical-align:-.13em}
  img.ai{width:1em;height:1em;object-fit:contain;vertical-align:-.13em}   /* the illustrated icons track the same box wherever the CSS pairs "svg,.ic" */
  /* goods-icon colours: the pale palette is for dark tile faces; use the token colours on light text panels */
  .mbox .g,.pb-sub .g,.card .c-buy .g{color:#9c7414}
  .mbox .h,.pb-sub .h,.card .c-buy .h{color:#5d7d34}
  .ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
  .ov .cuts{display:none}
  body.cut .ov .cuts,body.both .ov .cuts{display:block}   /* CUT shows guides only (art hidden); BOTH overlays guides ON the art */
  /* card sheets are cut with a paper cutter, not the laser — their cut lines print WITH the art */
  .ov .cuts.always{display:block}
  .dl{position:absolute;top:.32in;right:.45in;z-index:6;display:flex;gap:4px}
  .dl button{font-size:.7rem;background:var(--sea);color:#fff;border:none;border-radius:4px;padding:2px 8px;cursor:pointer;font-family:inherit;opacity:.85}
  /* ====== TILES — 1.25in cut squares, gapless grid (a neighbour's colour is the bleed) ====== */
  .tile{width:1.25in;height:1.25in;background:var(--c,#777);color:#fff;
    position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:.096in;overflow:hidden;
    text-shadow:0 1px 1.5px rgba(0,0,0,.5)}
  /* SCALE-UP (printables2): keep the tuned 1.25in art; a top-left transform blows it up to the cut size,
     so every proportion is preserved. casks → 2.5in (×2), ships & buildings → 2.0in (×1.6); improvements stay 1.25in. */
  .tile.s2{transform:scale(2);transform-origin:top left}
  .tile.s16{transform:scale(1.6);transform-origin:top left}
  .tile .ic{width:1em;height:1em;vertical-align:-.15em} .tile svg{stroke-width:2}
  .q{position:absolute;top:.06in;left:.08in;display:flex;align-items:center;gap:.02in;font-weight:900;font-size:.34in;line-height:1}
  .q svg,.q .ic{width:.2in;height:.2in;stroke-width:2.2}
  .t-nm{position:absolute;top:.46in;left:.1in;max-width:1.05in;text-align:left;font-variant:small-caps;font-weight:bold;font-size:.155in;line-height:1.05}
  .t-act{font-size:.1in;line-height:1.12;background:rgba(0,0,0,.24);border-radius:.04in;padding:.025in .04in;margin-bottom:.03in;display:flex;align-items:center;gap:.03in}
  .t-act svg,.t-act .ic{width:.13in;height:.13in;flex:0 0 auto}
  .t-act .ac{display:inline-flex;align-items:center;justify-content:center;width:.22in;height:.22in;border-radius:50%;background:rgba(255,255,255,.92);flex:0 0 auto}
  .t-act .ac svg,.t-act .ac .ic{width:.12in;height:.12in;stroke-width:2.1;color:#23201c}
  .t-cost{font-size:.12in;font-weight:bold;display:flex;align-items:center;gap:.04in;line-height:1;flex-wrap:wrap}
  /* dual brew cost (the shared Q3 pool: Broyhan / Keut) — tightened so both costs sit on one line */
  .t-cost.dual{gap:.015in;font-size:.11in}
  .t-cost.dual .gc{gap:.008in;font-size:.11in} .t-cost.dual .gc svg,.t-cost.dual .gc .ic{width:.125in;height:.125in}
  .g{color:#ffe08a} .h{color:#c4e69c}
  .gc{display:inline-flex;align-items:center;gap:.02in;font-size:.12in;font-weight:bold}
  .gc svg,.gc .ic{width:.15in;height:.15in;flex:0 0 auto}
  .tile.gen{justify-content:flex-start;text-shadow:0 1px 1px rgba(0,0,0,.4)}
  .gen .g-head{display:flex;align-items:center;gap:.06in;font-variant:small-caps;font-weight:bold;font-size:.125in;line-height:1.02;min-width:0}
  .gen .g-head .bigic{flex:0 0 auto}
  .gen .g-head .bigic svg,.gen .g-head .bigic .ic{width:.27in;height:.27in;stroke-width:1.7}
  .gen .g-head .g-nm{min-width:0;overflow-wrap:break-word;hyphens:auto}
  .gen .g-sub{font-size:.108in;line-height:1.2;margin-top:.05in;opacity:.97}
  .gen .g-big{position:absolute;bottom:.072in;right:.096in;font-weight:900;font-size:.46in;line-height:.8;opacity:.92}
  .gen .g-cost{position:absolute;bottom:.078in;left:.096in}
  .gen.tn .g-head, .gen.tu .g-head{flex-direction:column;align-items:flex-end;text-align:right;gap:.05in}
  .gen.tn .g-sub{position:absolute;left:.096in;right:.096in;bottom:.084in;margin-top:0}
  .gen .g-act{background:rgba(0,0,0,.22);border-radius:.04in;padding:.04in .055in;font-size:.105in;line-height:1.16;margin-top:.06in;align-self:stretch}
  .gen.tg .g-head .bigic{position:absolute;right:.1in;bottom:.08in}
  .gen.tg .g-head .bigic svg,.gen.tg .g-head .bigic .ic{width:.34in;height:.34in;opacity:.9}
  /* (the card-face CSS — casks · ships · buildings · specialists · recipes · contracts · tokens/discs/frames/covers — lives in components.js, the shared library) */
  /* ====== 1.5mm BLEED on the plotter TILES (print-kit only — play.html keeps true tiles) ======
     The packed box = the tile + 1.5mm bleed all round; adjacent bleeds TOUCH (1.5+1.5 = the 3mm cut
     gap), so the sheet interior is solid ink and a laser misaligned by <1.5mm still lands on colour.
     Only the tile's BACKGROUND COLOUR and ART layers extend outward — the content never moves, and the
     cut rrect stays on the tile's true edge. (.059in = 1.5mm ÷ SCALE at the native SCALE 1.0 — these
     rules live in native units and MUST retune with TILE_BLEED_N if SCALE ever changes; the 2026-08-18
     scale-up left them at the old ×0.8 value .074 and the bleed band printed empty — the table caught it.) */
  .bl{position:relative;width:100%;height:100%;overflow:hidden}
  /* z-index:0 makes each tile its OWN stacking context — without it the ::before bleed band
     (z-index:-1) paints BEHIND the .page's white background and never shows (2026-08-18: the
     table's print had white channels between tiles; the art-layer extensions are real elements
     and always painted, which is why the ships looked right while the flat bands vanished). */
  .bl>.ctile,.bl>.btile,.bl>.stile,.bl>.ldtile,.bl>.icard,.bl>.chtile{position:absolute;left:.059in;top:.059in;overflow:visible;border-radius:0;z-index:0}
  .bl>.ctile::before,.bl>.btile::before,.bl>.stile::before,.bl>.ldtile::before,.bl>.icard::before,.bl>.chtile::before{content:"";position:absolute;inset:-.059in;background:var(--c,#33445a);z-index:-1}
  /* the lading strip is flat kontor colour — its ::before IS the whole bleed (no art layer to extend);
     the Tasting tile likewise bleeds its CATEGORY colour (the border's own hue — 2026-08-18) */
  .bl>.btile>.artbg,.bl>.stile>.artbg,.bl>.stile>.st-wash,.bl>.icard>.artbg{inset:-.059in}
  .bl>.ctile>.ct-art{left:-.059in;top:-.059in;bottom:-.059in}
  .bl>.ctB>.ct-art{left:auto;right:-.059in}
  .bl>.btile>.bt-foot{margin:0 -.059in -.059in;padding-left:.159in;padding-right:.159in;padding-bottom:.129in}   /* the foot colour bleeds down & sideways; its content keeps its .1in/.07in insets */
  .bl>.icard>.ic-foot{margin:0 -.059in -.059in;padding-left:.229in;padding-right:.229in;padding-bottom:.209in}   /* the Specialist foot gradient rides OVER its art — it must bleed too (the art alone bleeds beige) */
  /* ====== cask PERK strip (e.g. Keut +1 presence) — printed above the cost ====== */
  .t-perk{position:absolute;top:.06in;right:.08in;text-align:right;font-size:.082in;font-style:italic;line-height:1.08;opacity:.96}
  .t-perk b{font-size:.16in;font-weight:900;font-style:normal}
  .t-perk svg,.t-perk .ic{width:.16in;height:.16in;vertical-align:-.03in}
  /* (v5: the old 1.25″ .tile.bld / .tile.bback building-tile styles were retired — buildings are now .bcard cards, below) */
  /* ====================== PLAYER AID CARD (double-sided: A = a turn · B = icon reference) ======================
     Two sheets (FRONT / BACK). Every card on a sheet is IDENTICAL, on a centred & symmetric 2×2 grid, so the
     outlines register under EITHER duplex flip edge — "front aligns with back" holds regardless of the printer.
     (Flip on the SHORT edge keeps the back upright.) 5.2×4.4in card (grown for air, 2026-08-03). */
  .aid{width:100%;height:100%;background:#f7efdc;color:var(--ink);border:1.4px solid var(--ink);border-radius:.07in;
    padding:.055in .075in;display:flex;flex-direction:column;overflow:hidden;font-size:.105in;line-height:1.34;letter-spacing:-.008em}
  .aid .ic,.aid svg{width:.115in;height:.115in;vertical-align:-.015in;flex:0 0 auto}
  .aid .gi{color:#9c7414} .aid .hi{color:#5d7d34} .aid .vi{color:var(--gold)}
  .aid b{color:var(--ink)} .aid .em{color:var(--red);font-weight:bold;font-variant:small-caps}
  .aid .ahd{display:flex;align-items:center;gap:.06in;border-bottom:2px solid var(--gold);padding-bottom:.02in;margin-bottom:.035in;flex:0 0 auto}
  .aid .ahd .abi{width:.22in;height:.22in;border-radius:.04in;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .aid .ahd .abi svg,.aid .ahd .abi .ic{width:.16in;height:.16in}
  .aid .ahd .at{font-variant:small-caps;font-weight:bold;color:var(--red);font-size:.14in;line-height:1}
  .aid .ahd .as{font-size:.09in;font-style:italic;color:var(--ink2);margin-left:auto;text-align:right;line-height:1.1}
  .aid .acols{flex:1;display:flex;gap:.14in;min-height:0}
  .aid .acol{flex:1;display:flex;flex-direction:column;min-width:0}
  .aid h5{font-variant:small-caps;font-weight:bold;color:var(--sea);font-size:.107in;margin:.062in 0 .024in;white-space:nowrap;
    border-bottom:1px solid var(--line);padding-bottom:.006in;display:flex;align-items:center;gap:.04in}
  .aid h5:first-child{margin-top:0}
  .aid h5 svg,.aid h5 .ic{width:.12in;height:.12in}
  .aid .step{display:flex;gap:.05in;margin-bottom:.036in}
  .aid .step .sn{flex:0 0 auto;width:.17in;height:.17in;border-radius:50%;background:var(--sea);color:#fff;font-size:.09in;font-weight:bold;display:flex;align-items:center;justify-content:center}
  .aid .step .sx,.aid .ln{min-width:0}
  .aid .ln{margin-bottom:.038in}
  /* the die lifecycle strip: 5 stacked chips with arrows */
  .aid .dstrip{display:flex;align-items:flex-start;gap:.015in;margin-bottom:.038in}
  .aid .dch{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.006in;min-width:0}
  .aid .dch img.ai,.aid .dch svg{width:.13in;height:.13in}
  .aid .dch b{font-size:.105in;line-height:1}
  .aid .dch .ds{font-size:.105in;line-height:1.06;color:var(--ink2)}
  .aid .darr{flex:0 0 auto;font-weight:bold;opacity:.65;padding-top:.05in;font-size:.11in}
  /* the Kontore table — the front's centrepiece */
  .aid table.kt{width:100%;border-collapse:collapse;margin-bottom:.02in}
  .aid .kt th{font-variant:small-caps;text-align:left;border-bottom:1px solid var(--gold);font-size:.105in;padding:0 .02in .008in 0}
  .aid .kt td{padding:.004in .02in .004in 0;line-height:1.08;vertical-align:middle}
  .aid .kt td.kn{font-variant:small-caps;font-weight:bold;white-space:nowrap}
  .aid .kt td.km{font-weight:bold;white-space:nowrap}
  .aid .kt img.ai{width:.12in;height:.12in;margin-right:.012in}
  /* the DON'T FORGET callout */
  .aid .dontf{border:1.4px solid var(--red);border-radius:.04in;padding:.03in .045in;background:rgba(124,33,40,.05);margin:.02in 0 .026in;line-height:1.18}
  /* legend grid (back) */
  .aid .leg{display:flex;flex-direction:column}
  .aid .lr{display:flex;align-items:flex-start;gap:.05in;margin-bottom:.042in}
  .aid .lr .lic{flex:0 0 .2in;height:.15in;display:flex;align-items:center;justify-content:center;color:var(--sea)}
  .aid .lr .lic svg,.aid .lr .lic .ic{width:.15in;height:.15in}
  .aid .lr .lx{min-width:0} .aid .lr .lx b{font-variant:small-caps}
  /* the illustrated icons render as BIG as their detail allows (designer, final pass): the art
     carries ~15%/side transparent sticker margin, so the img boxes oversize past the glyph slots
     with negative margins — the visible sticker fills the slot and line metrics never grow */
  .aid img.ai{width:.19in;height:.19in;margin:-.05in -.008in;vertical-align:-.05in}
  .aid h5 img.ai{width:.21in;height:.21in;margin:-.05in 0;vertical-align:-.055in}
  .aid .lr .lic{flex:0 0 .26in;height:.15in}
  .aid .lr .lic img.ai{width:.27in;height:.27in;margin:-.055in -.02in}
  .aid .dch img.ai{width:.21in;height:.21in;margin:-.045in 0 -.04in}
  .aid .kt img.ai{width:.2in;height:.2in;margin:-.055in .008in -.055in 0;vertical-align:middle}
  .aid .ahd .abi img.ai{width:.24in;height:.24in;margin:-.02in}
  /* ---- .a3: the aid PANEL tier (2026-08-18, one COMPLETE aid per third of the letter
     sheet) — the ruled .105in body floor, now at PRINT size (~25% up on the old card);
     the back's legend runs two columns. */
  .aid.a3{border-width:2px;border-radius:.09in;padding:.13in .15in;font-size:.105in;line-height:1.22;letter-spacing:0}
  .aid.a3 .ic,.aid.a3 svg{width:.12in;height:.12in;vertical-align:-.015in}
  .aid.a3 .ahd{border-bottom-width:2px;padding-bottom:.04in;margin-bottom:.06in;gap:.06in}
  .aid.a3 .ahd .at{font-size:.17in}
  .aid.a3 .ahd .as{font-size:.095in}
  .aid.a3 .ahd .abi{width:.26in;height:.26in}
  .aid.a3 .ahd .abi svg,.aid.a3 .ahd .abi .ic{width:.18in;height:.18in}
  .aid.a3 .ahd .abi img.ai{width:.24in;height:.24in;margin:-.02in}
  .aid.a3 h5{font-size:.125in;margin:.17in 0 .05in;padding-bottom:.015in;gap:.04in}   /* the wide top margin IS the previous section's bottom padding (designer, 2026-08-18) */
  .aid.a3 h5 svg,.aid.a3 h5 .ic{width:.13in;height:.13in}
  .aid.a3 .step{gap:.06in;margin-bottom:.05in}
  .aid.a3 .step .sn{width:.19in;height:.19in;font-size:.105in}
  .aid.a3 .ln{margin-bottom:.045in}
  .aid.a3 .dstrip{gap:.015in;margin-bottom:.05in}
  .aid.a3 .dch b{font-size:.105in}
  .aid.a3 .dch .ds{font-size:.1in}
  .aid.a3 .darr{font-size:.115in;padding-top:.06in}
  .aid.a3 .kt th{font-size:.105in;padding-bottom:.012in}
  .aid.a3 .kt td{padding:.01in .025in .01in 0;line-height:1.12}
  .aid.a3 .dontf{padding:.05in .07in;border-width:1.6px;margin:.08in 0 .09in;line-height:1.22}
  .aid.a3 .lr{gap:.06in;margin-bottom:.05in}
  .aid.a3 .lr .lic{flex:0 0 .28in;height:.17in}
  .aid.a3 .lr .lic svg,.aid.a3 .lr .lic .ic{width:.17in;height:.17in}
  .aid.a3 img.ai{width:.2in;height:.2in;margin:-.05in -.008in;vertical-align:-.055in}
  .aid.a3 h5 img.ai{width:.22in;height:.22in;margin:-.05in 0;vertical-align:-.06in}
  .aid.a3 .lr .lic img.ai{width:.28in;height:.28in;margin:-.055in -.02in}
  .aid.a3 .dch img.ai,.aid.a3 .dch svg{width:.24in;height:.24in;margin:-.045in 0 -.04in}
  .aid.a3 .kt img.ai{width:.21in;height:.21in;margin:-.055in .008in -.055in 0;vertical-align:middle}
  /* the back's legend: two columns, rows unbroken */
  .aid.a3 .leg2{display:block;columns:2;column-gap:.16in;margin-top:.02in}
  .aid.a3 .leg2 h5{break-inside:avoid}
  .aid.a3 .leg2 .lr{break-inside:avoid}
  /* ====================== PLAYER BOARD (v1.6 — rebuilt from scratch) ======================
     A pure TRACKING surface — vessels & maturation (THE FLOOR row) · improvements · THE FLIGHT ·
     a goods zone · a bottom RECIPE RACK. No rules text (those live on the separate player-aid card).
     Tile-true: vessel & improvement spaces are 1.25in squares; recipe-rack strips are 1.85in (card width). */
  .board{--pc:#7c2128;width:100%;height:100%;background:var(--parch);color:var(--ink);border:2.5px solid var(--pc);
    border-radius:.12in;padding:.16in;display:flex;flex-direction:column;gap:.13in}
  .board svg,.board .ic{stroke-width:1.8}
  /* --- header: crest · house name · storage zone --- */
  .pb-head{display:flex;align-items:stretch;gap:.16in;flex:0 0 auto}
  .crest{width:.82in;flex:0 0 auto;border-radius:.08in;background:var(--pc);color:#fff;display:flex;align-items:center;justify-content:center}
  .crest svg,.crest .ic{width:.5in;height:.5in}
  .pb-title{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0}
  .pb-name{font-variant:small-caps;font-weight:bold;font-size:.3in;color:var(--pc);line-height:1}
  .pb-sub{font-size:.1in;color:var(--ink2);font-style:italic;margin-top:.03in}
  .pb-store{flex:0 0 auto;display:flex;flex-direction:column;gap:.04in;justify-content:center}
  .pb-store .slbl{font-variant:small-caps;font-weight:bold;font-size:.11in;color:var(--pc);display:flex;align-items:center;gap:.04in}
  .pb-store .slbl svg,.pb-store .slbl .ic{width:.14in;height:.14in}
  .szone{width:3.5in;height:.8in;border:1.6px solid var(--pc);border-radius:.07in;background:rgba(255,255,255,.45);
    display:flex;align-items:center;justify-content:center;gap:.14in;color:var(--pc)}
  .szone .si{display:inline-flex;align-items:center;gap:.04in;font-variant:small-caps;font-weight:bold;font-size:.135in}
  .szone .si svg,.szone .si .ic{width:.22in;height:.22in}
  .szone .cap{display:inline-flex;align-items:baseline;gap:.03in;font-size:.1in;font-style:italic;color:var(--ink2)}
  .szone .cap b{font-size:.17in;font-style:normal;font-weight:900;color:var(--pc)}
  /* --- section header (a zone label — a noun, never a rule) --- */
  .pb-sect{font-variant:small-caps;font-weight:bold;font-size:.125in;color:var(--pc);display:flex;align-items:center;gap:.05in;
    border-bottom:1px solid var(--pc);padding-bottom:.015in;margin-bottom:.05in}
  .pb-sect svg,.pb-sect .ic{width:.15in;height:.15in}
  .pb-sect .sm{font-variant:normal;font-weight:normal;font-style:italic;font-size:.088in;color:var(--ink2);margin-left:auto}
  /* --- THE FLOOR: ONE line of 3 vessels + 4 improvement slots; maturation tracks under the vessels --- */
  .floor{flex:0 0 auto}
  .floor-row{display:flex;align-items:flex-start;gap:.14in}
  .fgrp{display:flex;flex-direction:column}
  .grp-lbl{font-variant:small-caps;font-weight:bold;font-size:.1in;color:var(--pc);display:flex;align-items:center;gap:.04in;margin-bottom:.05in}
  .grp-lbl svg,.grp-lbl .ic{width:.13in;height:.13in}
  .grp-lbl .nn{font-variant:normal;font-weight:normal;font-style:italic;opacity:.8;margin-left:.05in}
  .vgroup,.igroup{display:flex;gap:.1in}
  .vcol{display:flex;flex-direction:column;align-items:center;width:1.25in}
  .vsq{width:1.25in;height:1.25in;border:1.6px solid var(--pc);border-radius:.06in;background:rgba(255,255,255,.5);position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--pc);font-size:.092in;text-align:center;gap:.02in}
  .vsq svg,.vsq .ic{width:.32in;height:.32in;opacity:.42}
  .vsq .vn{position:absolute;top:.05in;left:.07in;font-variant:small-caps;font-weight:bold;font-size:.092in;opacity:.7}
  /* forward-flow arrow between the vessel square and its maturation track (you move RIGHT to Ready) */
  .vflow{width:1.25in;height:.14in;display:flex;align-items:center;justify-content:center;color:var(--pc)}
  .vflow svg,.vflow .ic{width:.17in;height:.13in;stroke-width:2.4}
  /* maturation track: a beer STARTS on the space bearing its name, then advances RIGHT to READY (the last space) */
  .mtrack{display:flex;border:1.3px solid var(--pc);border-radius:.04in;overflow:hidden;width:1.25in}
  .mtrack .ms{flex:1;height:.52in;border-right:1px solid rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.014in;padding:.012in;background:rgba(255,255,255,.5);text-align:center}
  .mtrack .ms:last-child{border-right:none}
  .mtrack .ms .bn{font-variant:small-caps;font-weight:bold;font-size:.057in;line-height:1.05;color:var(--ink)}
  .mtrack .ms.fin{background:rgba(74,107,58,.24)}
  .mtrack .ms.fin .rdy{font-variant:small-caps;font-weight:900;font-size:.086in;color:var(--pc);line-height:1}
  .mtrack .ms.fin .rsub{font-variant:small-caps;font-size:.054in;color:var(--pc);opacity:.85;line-height:1}
  /* V3 (the Coppersmith) is identical to V1/V2 — ONLY its tile outline is dashed */
  .vcol.locked .vsq{border-style:dashed}
  /* improvement slots — host bought improvements (violet) AND displaced/flipped Buildings; tile-true 1.25in squares */
  .isq{width:1.25in;height:1.25in;border:1.5px dashed var(--violet);border-radius:.06in;background:rgba(91,58,142,.07);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.04in;color:var(--violet);font-size:.088in;text-align:center}
  .isq svg,.isq .ic{width:.3in;height:.3in;opacity:.6}
  /* --- THE FLIGHT: one space per beer type; mark each beer you deliver --- */
  .flight{flex:0 0 auto}
  .flight-row{display:flex;gap:.08in}
  .fbeer{flex:1;border:1.4px solid var(--pc);border-radius:.06in;background:rgba(255,255,255,.45);
    display:flex;align-items:center;gap:.07in;padding:.05in .08in}
  .fbeer.exp{border-style:dashed}
  .fdot{width:.4in;height:.4in;flex:0 0 auto;border-radius:50%;border:1.4px solid var(--pc);background:rgba(0,0,0,.03)}
  .fbeer.exp .fdot{border-style:dashed}
  .fmeta{display:flex;flex-direction:column;line-height:1.08;min-width:0}
  .fmeta .fn{font-variant:small-caps;font-weight:bold;font-size:.1in;color:var(--ink)}
  .fmeta .fq{font-size:.078in;color:var(--ink2)}
  /* ====================== PLAYER BOARD v6 (component-driven · tight die-cut · chrome-stripped) ==========
     v3.2d PURE SLOTS: seven 2.5in Floor slots (they seat the 2.5in cask cards) wrapped as two visual
     runs (F1–F4 · F5–F7) under the id row — nothing else. The Flight lives on the recipe cards; the
     rules live on the player aid. The die-cut hugs the cluster (see the call site). */
  .pb2{--pc:#7c2128;width:100%;height:100%;background:var(--parch);color:var(--ink);position:relative;
    border:3px solid var(--pc);border-radius:.18in;padding:.13in;display:flex;flex-direction:column;gap:.1in}
  /* the white highlight line is an ::after overlay border, not an inset box-shadow — html2canvas floods
     inset shadows across the whole element (the player-board sheet PNG exported 45%-white-washed; same
     export bug that painted the Market & Stores board gold — see .supply-outer) */
  .pb2::after{content:"";position:absolute;inset:0;border:1.5px solid rgba(255,255,255,.45);border-radius:.14in;pointer-events:none;z-index:6}
  .pb2 svg,.pb2 .ic{stroke-width:1.8}
  /* identity — a small colour crest + house name + a tiny goods-cap reminder (no storage block) */
  .pb2-id{display:flex;align-items:center;gap:.08in;flex:0 0 auto;padding:0 .02in}
  .pb2-crest{width:.32in;height:.32in;border-radius:.05in;background:var(--pc);color:#fff;display:flex;align-items:center;justify-content:center}
  .pb2-crest svg,.pb2-crest .ic{width:.2in;height:.2in}
  .pb2-name{font-variant:small-caps;font-weight:bold;font-size:.18in;color:var(--pc);line-height:1}
  .pb2-goods{margin-left:auto;display:inline-flex;align-items:center;gap:.04in;font-variant:small-caps;font-size:.092in;color:var(--ink2)}
  .pb2-goods svg,.pb2-goods .ic{width:.12in;height:.12in} .pb2-goods b{color:var(--pc);font-size:.105in}
  /* rows */
  .pb2-top,.pb2-bot{display:flex;align-items:stretch;flex:0 0 auto}
  .pb2-top{gap:.1in} .pb2-bot{gap:.1in}
  .pb2-blds{display:flex;gap:.1in;flex:0 0 auto}
  .pb2-vessels{display:flex;gap:.06in;flex:0 0 auto}
  .pb2-slot{position:relative;border:1.6px dashed var(--pc);border-radius:.06in;background:rgba(255,255,255,.35);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.04in;color:var(--pc);text-align:center}
  .pb2-slot .sn{position:absolute;top:.05in;left:0;right:0;font-variant:small-caps;font-weight:bold;font-size:.08in;opacity:.62;line-height:1.05}
  .pb2-slot .si{display:flex;gap:.06in;opacity:.4} .pb2-slot .si svg,.pb2-slot .si .ic{width:.32in;height:.32in}
  .pb2-bld{width:2in;height:2in}
  /* slots at the COMPONENT footprints (designer, 2026-08-03): vessels seat the 2.4×1 cask tile,
     the seats hold the 2×2 Specialist card; the seats row centres in the board */
  .pb2-vsl{width:2.4in;height:1in;border-style:solid}
  .pb2-vsl.extra{border-style:dashed}
  .pb2-vsl .si svg,.pb2-vsl .si .ic{width:.3in;height:.3in}
  .pb2-seat{width:2in;height:2in;border-style:solid}
  .pb2-seat .si svg,.pb2-seat .si .ic{width:.46in;height:.46in}
  .pb2-vessels.seats{margin:0 auto}
  /* ====================== DESTINATIONS BOARD ====================== */
  .dboard{width:100%;height:100%;background:var(--parch);border:2.5px solid var(--gold);border-radius:.14in;padding:.16in;display:flex;flex-direction:column;gap:.12in;color:var(--ink);box-sizing:border-box}
  .dboard svg,.dboard .ic{stroke-width:1.9}
  .db-head{display:flex;align-items:baseline;gap:.14in;border-bottom:2.5px solid var(--gold);padding-bottom:.06in}
  .db-head h2{margin:0;font-variant:small-caps;color:var(--red);font-size:.30in;letter-spacing:.5px;display:flex;align-items:center;gap:.06in}
  .db-head h2 svg,.db-head h2 .ic{width:.28in;height:.28in}
  .db-head .dsub{font-style:italic;color:var(--ink2);font-size:.1in}
  .db-head .legend{font-size:.088in;color:var(--ink2);margin-left:auto;display:flex;gap:.13in;align-items:center}
  .db-head .legend b{color:var(--ink)} .db-head .legend svg,.db-head .legend .ic{width:.14in;height:.14in;vertical-align:-.02in}
  .vp{color:var(--vp)} .ql{color:var(--ink)}
  /* each destination = a colourful vertical card, washed in its kontor colour */
  .kontor-row{display:flex;gap:.1in;flex:1;min-height:0}
  .kpanel{position:relative;flex:1;border:2.5px solid var(--kc);border-radius:.11in;background:var(--kt);display:flex;flex-direction:column;overflow:hidden;color:var(--ink)}
  .kpanel.hall{flex:.86}   /* the Hall is a touch narrower — no majority track */
  .ktitle{background:var(--kc);color:#fff;padding:.07in .1in;display:flex;justify-content:space-between;align-items:center;gap:.04in}
  .kname{font-variant:small-caps;font-weight:bold;font-size:.2in;display:flex;align-items:center;gap:.05in;line-height:1;letter-spacing:.3px}
  .kname svg,.kname .ic{width:.22in;height:.22in}
  .kreq{font-size:.13in;font-weight:bold;background:rgba(255,255,255,.24);border-radius:.05in;padding:.018in .06in;display:flex;align-items:center;gap:.03in;flex:0 0 auto}
  .kreq svg,.kreq .ic{width:.15in;height:.15in}
  .kbody{flex:1;display:flex;flex-direction:column;gap:.06in;padding:.08in .07in .09in}
  .krole{font-size:.1in;font-style:italic;color:var(--ink2);line-height:1.12;text-align:center;min-height:.22in}
  /* a section card inside the panel: white, kontor-edged, with a small small-caps heading. value/benefit are
     compact; the MAJORITY card grows so its presence zone fills the panel. Headings/notes wrap rather than
     clip — a panel this narrow, at a real serif font, can't guarantee a long label fits on one line. */
  .ksect{flex:1 1 0;background:#fff;border:1.5px solid var(--kc);border-radius:.07in;padding:.05in .04in;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.03in}
  .ksh{font-variant:small-caps;font-weight:bold;font-size:.09in;color:var(--kc);letter-spacing:.3px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.03in;opacity:.92;text-align:center;row-gap:0}
  .ksh svg,.ksh .ic{width:.12in;height:.12in;opacity:.85}
  .ksh .mt-t{color:var(--ink2);font-weight:normal;font-variant:normal;font-style:italic;font-size:.078in;margin-left:.02in}
  .ksub{font-size:.08in;font-style:italic;color:var(--ink2);text-align:center;line-height:1.1}
  .ksub b{color:var(--kc);font-style:normal}
  /* per-cask value — a readable star number, or a by-quality mini-row for the Long Haul */
  .kval{display:flex;align-items:center;justify-content:center;gap:.04in;font-weight:900;font-size:.42in;color:var(--kc);line-height:.92}
  .kval svg,.kval .ic{width:.28in;height:.28in;color:var(--vp);stroke-width:2.5}
  .kvscale{display:flex;gap:.06in;justify-content:center;align-items:flex-end}
  .kvscale .qv{display:flex;flex-direction:column;align-items:center;gap:.01in;flex:0 0 auto}
  .kvscale .qv .qq{font-size:.09in;font-variant:small-caps;font-weight:bold;color:var(--ink2);white-space:nowrap}
  .kvscale .qv .qn{display:flex;align-items:center;gap:.02in;font-weight:900;font-size:.22in;color:var(--kc);line-height:1;white-space:nowrap}
  .kvscale .qv .qn svg,.kvscale .qv .qn .ic{width:.16in;height:.16in;color:var(--vp);stroke-width:2.6;flex:0 0 auto}
  /* on-delivery benefit — iconic + a one-line note */
  .kben{display:flex;align-items:center;justify-content:center;gap:.05in;font-weight:900;font-size:.36in;color:var(--kc);line-height:1}
  .kben svg,.kben .ic{width:.42in;height:.42in;color:var(--kc);stroke-width:2.1}
  /* majority — the tiered payout + a PRESENCE ZONE (pile your delivered-cask tokens; most leads) */
  .ksect.maj{flex:1 1 auto}
  .kmaj{display:flex;align-items:center;justify-content:center;gap:.05in;font-weight:900;font-size:.32in;color:var(--kc);line-height:1}
  .kmaj svg,.kmaj .ic{width:.22in;height:.22in;color:var(--vp);stroke-width:2.4}
  .kmaj i{color:var(--ink2);font-style:normal;font-weight:normal;font-size:.2in}
  .kpz{flex:1 1 auto;align-self:stretch;min-height:.65in;margin-top:.03in;border:1.5px dashed var(--kc);border-radius:.06in;
    background:rgba(0,0,0,.025);display:flex;align-items:center;justify-content:center;gap:.04in;color:var(--kc)}
  .kpz svg,.kpz .ic{width:.14in;height:.14in;opacity:.7}
  .kpz span{font-variant:small-caps;font-weight:bold;font-size:.1in;letter-spacing:.5px;opacity:.78}
  /* the Hall — a prestige ladder of Q → ★ rows */
  .ksect.hall{flex:1 1 auto;justify-content:center;gap:.07in}
  .kladder{display:flex;flex-direction:column;gap:.07in;align-self:stretch;width:100%}
  .kladder .lr{display:flex;align-items:center;justify-content:space-between;gap:.06in;font-weight:900;color:var(--kc);background:var(--kt);border:1.5px solid var(--kc);border-radius:.06in;padding:.045in .11in}
  .kladder .lr .lq{font-size:.15in;font-variant:small-caps;color:var(--ink2)}
  .kladder .lr .lv{display:flex;align-items:center;gap:.035in;font-size:.3in}
  .kladder .lr svg,.kladder .lr .ic{width:.24in;height:.24in;color:var(--vp);stroke-width:2.5}
  /* v11: was margin-top:auto, which glued this to the very bottom edge of the panel with almost no
     clearance — a real (wider) serif font could wrap it to 2 lines with nothing below to absorb that,
     clipping it against .kpanel's overflow:hidden. A fixed gap + shorter copy fixes both: it now sits
     just under the ladder with real breathing room instead of pinned to the border. */
  .hall-note{font-size:.086in;font-style:italic;color:var(--ink2);text-align:center;line-height:1.14;margin-top:.1in}
  .hall-note b{color:var(--kc);font-style:normal}
  /* ====================== MAIN BOARD — THE WHARF ====================== */
  .mboard{width:100%;height:100%;background:var(--parch);border:2.5px solid var(--sea);border-radius:.12in;padding:.14in .16in;display:flex;flex-direction:column;gap:.04in;color:var(--ink)}
  .mboard svg,.mboard .ic{stroke-width:1.8}
  .mb-head{display:flex;align-items:center;gap:.14in;margin-bottom:.02in}
  .mb-head h2{margin:0;font-variant:small-caps;color:var(--sea);font-size:.26in;letter-spacing:.5px;display:flex;align-items:center;gap:.08in;white-space:nowrap}
  .mb-head h2 svg,.mb-head h2 .ic{width:.2in;height:.2in}
  .mb-head h2 img.ai{width:.55in;height:.55in;margin:-.14in 0}   /* the big illustrated header icons keep the row slim */
  .mb-head h2.spec-h{margin-left:auto;width:4.92in;justify-content:center}   /* centred over the CASKS & RECIPES column (4.92in, flush right — 2026-08-18) */
  .mb-head .sub{font-size:.1in;font-style:italic;color:var(--ink2)}
  .mb-main{flex:1;display:flex;gap:.14in;min-height:0;align-items:center}
  /* v3.4c.8 [ruled]: the board's arms reach only the BUILDING BAND — each slot prints the 2.5×1.32in
     building footprint (the side arms seat it ROTATED); casks/ships stack on the tile and hang OFF the
     board's edge, exactly as on the table (play.html's boardCross mirrors this live). */
  .wharf{flex:0 0 auto;align-self:flex-start;display:grid;gap:.3in;
    grid-template-columns:1.32in 2.5in 2.5in 1.32in;
    grid-template-rows:1.32in 2.5in 2.5in 1.32in}
  .wslot{border:2.5px dashed rgba(255,255,255,.82);border-radius:.18in;background:rgba(20,14,8,.24);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.04in;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.75)}
  .wslot svg,.wslot .ic{width:.5in;height:.5in;opacity:.85;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
  /* the station cell (2026-08-03, designer-ruled): a painted SCENE fills the cell; over it only the
     station TITLE (top — the scenes keep a calm top band) and the ACTION's illustrated icon (low-centre).
     The verbose action reference lives in the side column + the player aid. */
  .stn{border-radius:.2in;color:#fff;padding:.12in;display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative;overflow:hidden;text-shadow:0 1px 2px rgba(0,0,0,.55);box-shadow:0 3px 10px rgba(0,0,0,.35);border:.035in solid #e5dcc3}   /* the light-tan frame pops the stations off the deck (designer, round 2) */
  .stn>*{position:relative;z-index:1}
  .stn>.stn-scene{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;object-position:center}
  /* a dark foot gradient lifts the action icon + caption off the scene — an inline SVG ramp,
     not a CSS gradient (CSS gradients seam in the html2canvas export; the kp panels' pattern) */
  .stn>.stn-grad{position:absolute;left:0;right:0;bottom:0;height:54%;width:100%;z-index:0}
  .stn .nm{font-variant:small-caps;font-weight:bold;font-size:.34in;line-height:1;letter-spacing:.5px;text-shadow:0 1px 3px rgba(0,0,0,.8),0 0 .14in rgba(0,0,0,.55)}
  .stn .stn-foot{display:flex;flex-direction:column;align-items:center;gap:.035in;margin-bottom:.01in}
  .stn .stn-act{display:flex;align-items:center;justify-content:center}
  .stn .stn-act img.ai{width:.95in;height:.95in;filter:drop-shadow(0 2px 5px rgba(0,0,0,.55))}
  .stn .stn-sub{font-style:italic;font-weight:bold;font-size:.17in;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.9)}
  /* per-station frame colours match the action icons' bases (designer): Market RED · Brewhouse
     YELLOW · Harbor BLUE · Cellar GREEN (the gradient is the fallback under the opaque scene) */
  .stn.A{border-color:#b4423a;background:linear-gradient(155deg,#9c3b2e,#7c2128)}
  .stn.B{border-color:#c9a227;background:linear-gradient(155deg,#cda522,#9c7414)}
  .stn.C{border-color:#3d6b7e;background:linear-gradient(155deg,#3d6b7e,#244554)}
  .stn.D{border-color:#4a6b3a;background:linear-gradient(155deg,#5a7e46,#34492a)}
  .mb-side{flex:1;display:flex;flex-direction:column;gap:.055in;min-width:0}
  .mbox{border:1.5px solid var(--sea);border-radius:.07in;background:#fff;padding:.045in .07in}
  .mbox h4{margin:0 0 .025in;font-variant:small-caps;font-size:.115in;color:var(--sea);display:flex;align-items:center;gap:.04in;border-bottom:1px solid rgba(0,0,0,.15);padding-bottom:.015in}
  .mbox h4 svg,.mbox h4 .ic{width:.13in;height:.13in}
  .mbox .b{font-size:.092in;line-height:1.22}
  .mbox .b b{color:var(--red)}
  .mbox ol{margin:.02in 0 0;padding-left:.16in;font-size:.092in;line-height:1.24}
  .srow{display:flex;gap:.05in;font-size:.09in;line-height:1.2;margin-bottom:.024in}
  .srow:last-child{margin-bottom:0}
  .srow .sic{flex:0 0 auto;margin-top:.005in} .srow .sic svg,.srow .sic .ic{width:.14in;height:.14in}
  .srow b{font-variant:small-caps}
  .mtrack-l{font-size:.082in;font-style:italic;color:var(--ink2);text-align:center}
  .ctrack{display:flex;height:.55in;border:1.5px solid var(--sea);border-radius:.05in;overflow:hidden}
  .cc{flex:1;min-width:0;border-right:1px solid rgba(0,0,0,.15);display:flex;flex-direction:column;gap:.015in;align-items:center;justify-content:center;font-size:.08in;color:var(--ink2);background:rgba(255,255,255,.4)}
  .cc:last-child{border-right:none} .cc .n{font-size:.1in;color:#999}
  .cc svg,.cc .ic{width:.14in;height:.14in}
  .cc b{font-size:.085in;line-height:1}
  .cc.end{background:var(--sea);color:#fff;font-weight:bold;text-align:center;line-height:1}
  .cc.rend{background:rgba(122,82,54,.22);color:#7a5236;font-weight:bold;text-align:center;line-height:1}
  .rtrack{display:flex;height:.3in;border:1.5px solid var(--gold);border-radius:.05in;overflow:hidden}
  .rc{flex:1;min-width:0;border-right:1px solid rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-size:.078in;color:var(--ink2);background:rgba(255,255,255,.4)}
  .rc:last-child{border-right:none} .rc.band{background:rgba(184,134,11,.16)}
  .rc.cap{background:var(--gold);color:#fff;font-weight:bold;font-size:.07in;text-align:center;line-height:1}
  .rc.z{background:rgba(124,33,40,.12);font-variant:small-caps;font-weight:bold;color:var(--red);font-size:.07in}
  /* printables2: the SCORE RING — 50 disc-sized cells (0–49 + lap) wrapping the Supply board's outer edge */
  /* the gold rim is an ::after overlay border, NOT an inset box-shadow: html2canvas mis-renders inset
     box-shadows by FLOODING the whole element with the shadow colour — the S2 sheet PNG exported with the
     entire board interior painted gold (#b8860b) instead of parchment. Same bug class as the documented
     gradient/filter/clip-path quirks in the export review note; the ::after border pattern is already
     proven in exports by the goods tokens' .tok::after inner ring. */
  .supply-outer{position:relative;width:100%;height:100%;background:var(--parch);border-radius:.14in;overflow:hidden}
  .supply-outer::after{content:"";position:absolute;inset:0;border:2px solid var(--gold);border-radius:.14in;pointer-events:none;z-index:6}
  .score-ring{position:absolute;inset:0}
  .ringcell{position:absolute;border:1px solid rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;
    font-size:.21in;font-weight:900;color:var(--ink2);background:rgba(255,255,255,.55);overflow:hidden}
  .ringcell.start{background:var(--red);color:#fff;flex-direction:column;gap:.02in;text-align:center}
  .ringcell.start svg,.ringcell.start .ic{width:.19in;height:.19in}
  .ringcell.start .lap{font-size:.11in;font-weight:bold;line-height:1;opacity:.95}
  .ringcell.five{background:rgba(184,134,11,.3);color:var(--ink)}
  .trk-h{font-variant:small-caps;font-weight:bold;font-size:.12in;color:var(--sea);display:flex;align-items:center;gap:.05in;margin:.07in 0 .03in}
  .trk-h svg,.trk-h .ic{width:.14in;height:.14in}
  .trk-h .sm{font-variant:normal;font-weight:normal;font-style:italic;font-size:.082in;color:var(--ink2);margin-left:.06in}
  /* the WHARF board is a CROSS — the cut follows the plus outline; the 4 corners fall away */
  /* +.3in outline padding: the grid sits inset, the cut plus runs .3in outside the slots */
  .mboard.cross{background:#e9dcc0 url('art/wharf-board.png') center/cover;border:none;border-radius:0;padding:.3in;display:block;
    clip-path:url(#crossclip)}
  .mboard.supply{display:flex;flex-direction:column;gap:.08in;padding:.18in .2in .32in;border:none;background:transparent;border-radius:0}   /* extra foot padding — the content shouldn't ride the ring */
  .mboard.supply .tracks{flex:0 0 auto;margin-top:auto}
  /* a printed label on the large sheet (above each cut board) */
  .sheetlbl{font-variant:small-caps;color:var(--sea);font-weight:bold;font-size:.28in;display:flex;align-items:center;gap:.1in;height:100%}
  .sheetlbl svg,.sheetlbl .ic{width:.26in;height:.26in}
  .sheetlbl .sub{font-variant:normal;font-weight:normal;font-style:italic;font-size:.13in;color:var(--ink2)}
  /* ====================== WHARF SIDE — supply DISPLAYS (Building display · Ship market) ====================== */
  .disp{flex:1;display:flex;flex-direction:column;gap:.18in;min-width:0;margin-top:0}
  .mb-track{margin-top:.12in}
  .disp-h{display:inline-flex;align-items:center;gap:.05in;background:var(--sea);color:#fff;border-radius:.06in;
    padding:.035in .12in;font-variant:small-caps;font-weight:bold;font-size:.125in;letter-spacing:.3px;margin-bottom:.07in;text-shadow:0 1px 1px rgba(0,0,0,.25)}
  .disp-h svg,.disp-h .ic{width:.15in;height:.15in}
  .disp-h .sm{font-variant:normal;font-weight:normal;font-style:italic;font-size:.082in;opacity:.85;margin-left:.06in}
  .disp-h .sm svg,.disp-h .sm .ic{width:.1in;height:.1in;vertical-align:-.015in}
  .disp-h.b{background:var(--green)}
  .disp-h.m{background:#9c7414}
  .disp-h.i{background:var(--violet)}
  /* market SHELVES — one family per row at its native footprint; deck right-aligned = the stockroom column */
  .shelf{display:flex;gap:.12in;align-items:flex-start}
  .shelf-lbl{display:flex;align-items:center;gap:.04in;font-variant:small-caps;font-weight:bold;font-size:.105in;color:var(--ink2);margin-top:.02in}
  .shelf-lbl svg,.shelf-lbl .ic{width:.13in;height:.13in}
  .shelf-lbl .bag{margin-left:auto;display:inline-flex;align-items:center;opacity:.7}   /* refill from this family's DRAW BAG (tile backs reveal the type, so the supply hides in a bag) */
  .shelf-lbl .bag svg,.shelf-lbl .bag .ic{width:.16in;height:.16in}
  .disp-bd{display:flex;gap:.1in;align-items:center}
  .dslot{width:2.5in;height:1.32in;border:1.7px dashed var(--sea);border-radius:.07in;background:rgba(255,255,255,.5);   /* buildings 2×1.32 (v3.4a) */
    display:flex;flex-direction:column;gap:.04in;align-items:center;justify-content:center;color:var(--sea);flex:0 0 auto;position:relative}
  .dslot svg,.dslot .ic{width:.6in;height:.6in;opacity:.32}
  /* OVERLAY proof: a real component render ghosted into its slot — native size, half opacity, never printed */
  /* the ghost sits CENTRED in its slot — a slot may be cut larger than the piece it seats */
  .dslot .ovl{position:absolute;inset:0;opacity:.5;pointer-events:none;z-index:2;
    display:flex;align-items:center;justify-content:center}
  @media print{.ovl{display:none}}
  .dslot.b{border-color:var(--green);color:var(--green)}
  .dslot.i{border-color:var(--violet);color:var(--violet);width:2in;height:2in}   /* Specialist cards are 2×2 (component-true) */
  .dslot.s,.ddeck.s{width:2.5in;height:3in}   /* the ship display seats either hull — sized to the Hulk CARRIER (2.5×3; a Cog sits within) */
  .dslot.r{width:1.85in;height:2.55in;border-color:#8a6408;color:#8a6408}   /* recipe/contract cards, 1.85×2.55 */
  .dslot.r svg,.dslot.r .ic{width:.5in;height:.5in}
  .dslot.r .rn{font-variant:small-caps;font-weight:bold;font-size:.1in;opacity:.7}
  .dslot.r.ct{border-color:var(--sea);color:var(--sea)}
  /* the CONTRACT slot is component-true (2×0.9in): it had been inheriting the 2.5×1.32in
     building footprint, so the row of 3 ran 7.82in wide and overflowed the 7.6in board */
  .dslot.l{width:2in;height:.9in;border-color:var(--sea);color:var(--sea)}
  .dslot.l svg,.dslot.l .ic{width:.38in;height:.38in}
  /* (the goods/dice/marker bins moved OFF the board — the loose bits live in a supply tray; the Round
     backstop is rules-side only, untracked on the table) */
  /* ---- Market & Stores interior: the market column · the cellar (Specialists) column · the clock ---- */
  .sup-cols{display:flex;gap:.2in;flex:1;min-height:0}
  .sup-cellar{flex:0 0 auto;width:4.92in;display:flex;flex-direction:column;gap:.08in;justify-content:flex-start}
  .brew-row{display:flex;gap:.12in;flex:0 0 auto}
  .dslot.c{width:2.4in;height:1in;border-color:#8a6408;color:#8a6408}   /* a beer PILE — the cask tile's true 2.4×1 cut */
  .dslot.c svg,.dslot.c .ic{width:.3in;height:.3in}
  .dslot.c img.ai{width:.34in;height:.34in}
  .dslot.c .rn,.dslot.r .rn{font-variant:small-caps;font-weight:bold;font-size:.1in;opacity:.7}
  .sup-main{flex:0 0 auto;width:10.4in;display:flex;flex-direction:column;gap:.16in}   /* wide enough for the 4-slot ship shelf — the Specialists column sits clear right */
  .sup-main .tracks{margin-top:auto}
  .sup-cellar{flex:0 0 auto;width:2.4in;display:flex;flex-direction:column;gap:.09in;min-width:0}
  .sup-cellar .disp-h{font-size:.14in}
  .sup-cellar .shelf-v{display:flex;flex-direction:column;gap:.1in;align-items:center}
  /* the vertical Sailed-Ships CLOCK — its own slim third column, the ship at its head */
  .sup-clock{flex:0 0 auto;width:.74in;display:flex;flex-direction:column;align-items:center;gap:.03in}
  .sup-clock .cicon{color:var(--sea);display:flex;align-items:center;justify-content:center}
  .sup-clock .cicon svg,.sup-clock .cicon .ic{width:.34in;height:.34in;stroke-width:1.6}
  .sup-clock .clbl{font-variant:small-caps;font-weight:bold;font-size:.088in;color:var(--sea);text-align:center;line-height:1.1}
  .vtrack{flex:1;width:100%;display:flex;flex-direction:column;border:1.5px solid var(--sea);border-radius:.05in;overflow:hidden}
  .vtrack .cc{border-right:none;border-bottom:1px solid rgba(0,0,0,.15)}
  .vtrack .cc:last-child{border-bottom:none}
  .disp-h.k{background:var(--sea)}
  .disp-h.hall{background:#5b3a8e}
  /* a destination panel: gate · value · benefit · majority at POSTER scale (read standing, across a table)
     over an open presence ZONE (discs pile freely; no per-disc slots) */
  .kp{flex:1;border:3px solid var(--kc);border-radius:.1in;background:var(--kt,#fff);display:flex;flex-direction:column;overflow:hidden;position:relative}
  .kp.hall{flex:1.05}  /* the Hall is a CORE path — a touch more room than a kontor */
  /* v2.9.3: Novgorod's extra by-quality scale row makes its stat block genuinely taller than the other three
     kontors' (measured: ~178px of content wanting to fit a ~149px equal-share panel) — an equal flex:1 share
     wasn't enough even after the row stopped wrapping; it was just overflowing straight past the panel's
     bottom edge instead (still clipped, just no longer via a wrapped 2nd line). Give it more of the column. */
  .kp.scale{flex:1.22}
  /* the destination SCENE: full-bleed art; a dark inline-SVG gradient rises from the FOOT (where the
     white stats sit); the middle stays open art — the tally dice land on the quay */
  .kp-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0}
  .kp-grad{position:absolute;inset:0;width:100%;height:100%;z-index:1}
  .kp-t,.kp-rows,.kp-pz{position:relative;z-index:2}
  .kp-t{background:var(--kc);color:#fff;display:flex;align-items:center;gap:0;padding:.05in .11in;
    font-variant:small-caps;font-weight:bold;font-size:.22in;text-shadow:0 1px 1.5px rgba(0,0,0,.35)}
  .kp-t svg,.kp-t .ic{width:.21in;height:.21in}
  /* the city CREST rides LARGE and tight to the name, hanging down over the scene — the bar keeps
     its height (round 2, grown again on review) */
  .kp-t img.ai{width:.54in;height:.54in;margin:-.09in .005in -.28in -.02in;position:relative;z-index:3;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
  /* the minimum chip: bare (no pill), the die pulled up to centre on the text */
  .kp-q{margin-left:auto;display:inline-flex;align-items:center;gap:.03in;font-size:.2in;font-weight:900}
  .kp-q svg,.kp-q .ic{width:.19in;height:.19in}
  .kp-q img.ai{width:.28in;height:.28in;margin-top:-.23in}   /* the die rides high on the bar (designer values) */
  .kp-rows{flex:0 0 auto;display:flex;flex-direction:column;gap:.04in;padding:.04in .12in .11in;min-height:0}   /* anchored at the FOOT, over the gradient */
  .kp-cr{display:flex;gap:.1in;align-items:flex-end}
  .kp-cr.two{gap:.22in}   /* Novgorod: only 2 cells here (value moved to its own full-width row above), so give each more breathing room */
  /* the by-quality scale gets its OWN full-width row, not a 3rd cramped column — see kMini's comment */
  .kp-scalerow{display:flex;flex-direction:column;align-items:center;gap:.02in}
  /* v2.9.2: dropped the hardcoded white-space:nowrap on .kp-ch/.kp-scale/.kp-note.bnote — at the real print
     font (a wide serif, not this sandbox's fallback) a "no wrap, ever" rule doesn't shrink the text, it just
     overflows the narrow art panel silently past .kp's overflow:hidden edge. Wrapping + shorter copy below
     is the actual fix; nowrap only ever masked it in a narrower-than-real test render. */
  .kp-note.bnote{text-align:center}
  .kp-cell{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:.04in;text-align:center;min-width:0}
  .kp-ch{display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.03in;font-variant:small-caps;font-weight:bold;font-size:.108in;color:rgba(255,255,255,.88);text-shadow:0 1px 2px rgba(0,0,0,.75)}
  .kp-ch svg,.kp-ch .ic{width:.12in;height:.12in;flex:0 0 auto}
  .kp-big{display:inline-flex;align-items:center;gap:0;font-weight:900;font-size:.3in;color:#fff;line-height:1;white-space:nowrap;text-shadow:0 1.5px 3px rgba(0,0,0,.8);position:relative;left:.05in}   /* round 2: icon hugs its number · the value row nudges right to visually centre (designer) */
  .kp-big svg,.kp-big .ic{width:.34in;height:.34in}
  /* the on-delivery PRIZE — much bigger than its neighbours (designer, 2026-08-18): the bonus is the read */
  .kp-big.kp-ben{font-size:.42in}
  .kp-big.kp-ben img.ai{width:.62in;height:.62in;margin:-.16in -.04in -.1in .01in}
  .kp-big.kp-ben svg,.kp-big.kp-ben .ic{width:.46in;height:.46in}
  /* the by-quality scale — a STACKED chip per tier (Q above, ★ value below), not one long joined line, laid
     out on its OWN full-width row (kp-scalerow) instead of a 1-of-3 cell, so it scales to however many tiers
     a kontor prints (Novgorod's v2.9 floor row made it four) without wrapping to a 2nd line and colliding
     with the row below. flex-wrap stays as a last-resort safety net, not the primary fit strategy. */
  .kp-scale{display:flex;gap:.14in;justify-content:center;flex-wrap:wrap}
  .kp-scale .qv{display:flex;flex-direction:column;align-items:center;gap:.01in;flex:0 0 auto}
  .kp-scale .qv .qq{font-size:.088in;font-variant:small-caps;font-weight:bold;color:rgba(255,255,255,.8);white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.75)}
  .kp-scale .qv .qn{font-weight:900;font-size:.2in;color:#fff;line-height:1;text-shadow:0 1.5px 3px rgba(0,0,0,.8)}
  .kp-note{font-size:.12in;font-style:italic;color:rgba(255,255,255,.92);line-height:1.22;text-shadow:0 1px 2px rgba(0,0,0,.75)}
  .kp-note.ctr{text-align:center;padding:.03in .16in .02in;font-size:.12in}
  /* presence ZONE — the panel's open floor: ownership discs pile here (the majority count) */
  .kp-pz{flex:1;min-height:.42in}   /* the open middle — pure art; the parked tally dice pile here, untaught */
  /* Overlay proof: ghost 12mm d6 into the parking field (the piece it is actually cut for) */
  .kp-pz .ovl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    gap:.09in;opacity:.5;pointer-events:none;z-index:3}
  .kpovl .gdie img.ai,.kpovl .gdie .ic,.kpovl .gdie svg{width:.47in;height:.47in}   /* a real 12mm die */
  .kp-pz.nb{min-height:.18in}   /* the Hall's shorter note needs less clearance below it now that it's one short line */
  /* ====================== the DESTINATIONS & HALL board (narrow · pairs with Market & Stores) ====================== */
  .destb{width:100%;height:100%;background:var(--parch);border:2.5px solid #5b3a8e;border-radius:.12in;padding:.16in .18in;display:flex;gap:.16in;color:var(--ink)}
  .destb svg,.destb .ic{stroke-width:1.8}
  /* the KONTORE board is a 2×2 grid of panels; the CONTRACTS board a single row of 3 — separate
     boards, sized to their contents, no rules text (designer, 2026-08-03) */
  .destb.kboard,.destb.cboard{flex-direction:column;gap:.12in}
  .kgrid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:.14in;min-height:0}
  .crow{flex:0 0 auto;display:flex;gap:.16in;justify-content:center;align-items:center}
  .db-ccol .dslot{width:2.2in;height:1in}
  /* (the shelf-Hall column CSS — .db-hcol/.db-hhead/.hshelf2/.hs-*/.hlaunch — left with the
     v4.17 rethink; the Tastings board carries its own .tastb block below.) */
  .ddeck{width:2in;height:2in;border-radius:.07in;background:var(--sea);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.04in;
    text-shadow:0 1px 1px rgba(0,0,0,.3);box-shadow:.05in -.05in 0 rgba(0,0,0,.18),inset 0 0 0 1.5px rgba(255,255,255,.22)}
  .ddeck.b{background:var(--green)}
  .ddeck.i{background:var(--violet)}
  .ddeck svg,.ddeck .ic{width:.45in;height:.45in;opacity:.92}
  .ddeck .dn{font-size:.12in}
  .ddeck .dn{font-variant:small-caps;font-weight:bold;font-size:.092in;text-align:center;line-height:1.05}
  /* ====================== OVERLAND board (Trade Roads) ====================== */
  .olboard{width:100%;height:100%;background:var(--parch);border:2.5px solid #7a5236;border-radius:.12in;padding:.16in;display:flex;flex-direction:column;gap:.08in;color:var(--ink)}
  .olboard svg,.olboard .ic{stroke-width:1.8}
  .ol-head{display:flex;align-items:baseline;gap:.14in}
  .ol-head h2{margin:0;font-variant:small-caps;color:#7a5236;font-size:.24in;display:flex;align-items:center;gap:.08in}
  .ol-head h2 svg,.ol-head h2 .ic{width:.2in;height:.2in}
  .ol-head .sub{font-size:.1in;font-style:italic;color:var(--ink2)}
  .ol-legend{display:grid;grid-template-columns:1fr 1fr;gap:.02in .2in;font-size:.088in;line-height:1.2;background:#fff;border:1.5px solid #c9b693;border-radius:.08in;padding:.05in .1in}
  .ol-legend b{color:#7a5236}
  .ol-legend svg,.ol-legend .ic{width:.11in;height:.11in;vertical-align:-.02in}
  /* the tech-tree canvas: one Hamburg root + one Bruges gateway, branching to the 3 western roads + the eastern haul */
  .ol-tree{position:relative;flex:1;min-height:0}
  .ol-roads{position:absolute;inset:0;width:100%;height:100%}
  .ol-roads .ol-reg{fill:rgba(120,90,40,.05);stroke:rgba(0,0,0,.05)}
  .ol-roads .ol-reg.e{fill:rgba(70,50,20,.07)}
  .ol-roads line{stroke:#b08d57;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:.4 6;opacity:.85;vector-effect:non-scaling-stroke}
  .ol-roads .ol-express{stroke:#b08d57;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:.4 6;opacity:.85;vector-effect:non-scaling-stroke}  /* the Q4+ Rhine Charter (Hamburg→Cologne, skip Bruges) — same dotted style as the other roads; the label marks it */
  .ol-reglbl{position:absolute;font-variant:small-caps;font-style:italic;font-weight:bold;font-size:.1in;color:rgba(90,70,40,.72);letter-spacing:.5px}
  .ol-reglbl.r{font-style:normal;display:flex;align-items:center;gap:.04in;transform:translateX(-100%)}
  .ol-reglbl.express{font-style:normal;display:flex;align-items:center;gap:.04in;color:#9c3b2e;font-size:.092in;background:rgba(243,233,210,.85);border-radius:.04in;padding:.005in .035in}
  .ol-reglbl svg,.ol-reglbl .ic{width:.12in;height:.12in}
  /* a town node CARD, absolutely positioned & centred on its tree coordinate */
  .oln{position:absolute;transform:translate(-50%,-50%);border:1.6px solid #c9b693;border-radius:.07in;background:#fff;padding:.04in .05in;display:flex;flex-direction:column;gap:.03in;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .oln.home{background:#e6d3a8;border:2px solid #8a6d3b;align-items:center;justify-content:center;text-align:center;gap:.01in;padding:.05in}
  .oln.home svg,.oln.home .ic{width:.2in;height:.2in;color:#7a5236}
  .oln.home .oln-nm{font-size:.12in}
  .oln.home .oln-mt{font-size:.082in;font-style:italic;color:var(--ink2)}
  .oln.core{border-color:var(--gold);border-width:2.2px;background:#fdf6e6}
  .oln.deep{box-shadow:0 0 0 1.5px #7c2128,0 1px 3px rgba(0,0,0,.12)}
  .oln-h{display:flex;align-items:center;gap:.04in;flex-wrap:wrap}
  .oln-nm{font-variant:small-caps;font-weight:bold;font-size:.12in;display:inline-flex;align-items:center;gap:.03in}
  .oln-nm svg,.oln-nm .ic{width:.13in;height:.13in;color:var(--gold)}
  .oln-dp{color:var(--gold);font-weight:900}
  .oln-q,.oln-pts{display:inline-flex;align-items:center;gap:.012in;font-weight:900;font-size:.092in;border-radius:.03in;padding:0 .035in}
  .oln-q{background:rgba(0,0,0,.08)} .oln-pts{background:rgba(184,134,11,.2);color:#7a5210;margin-left:auto}
  .oln-q svg,.oln-q .ic,.oln-pts svg,.oln-pts .ic{width:.11in;height:.11in}
  /* the PHYSICAL claim-slot squares — a little bigger than a presence token; cover one to claim it */
  .olsq-row{display:flex;gap:.04in;justify-content:center}
  .olsq{position:relative;width:.4in;min-width:.4in;height:.46in;border:1.4px dashed #9a8049;border-radius:.04in;background:rgba(120,90,40,.05);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.01in;text-align:center;color:#6a532b}
  .olsq svg,.olsq .ic{width:.16in;height:.16in;stroke-width:1.9}
  .olsq .t{font-size:.066in;line-height:1;font-weight:bold;letter-spacing:-.2px}
  .olsq.fix{border-style:solid;border-width:1.8px;border-color:#6f5530;background:rgba(184,134,11,.16)}  /* always-available (every player count) — prominent: SOLID dark border + the gold fill */
  .olsq.pts{color:#7a5210}  /* points slot — gold star/text only; its bg + border follow fix(always)/gated(player-count), so a gated pts slot matches its neighbour */
  .olsq.pts svg,.olsq.pts .ic{color:var(--gold)}
  .olsq-badge{position:absolute;top:-.06in;right:-.05in;background:var(--red);color:#fff;font-size:.062in;font-weight:900;border-radius:.03in;padding:.004in .025in;letter-spacing:0}
  .oln-over{display:flex;align-items:center;gap:.03in;font-size:.076in;color:var(--ink2);border-top:1px dotted #c9b693;padding-top:.025in}
  .oln-over b{color:#7a5236}
  .oln-over svg,.oln-over .ic{width:.1in;height:.1in}
  .oln-gwb{display:flex;flex-direction:column;gap:.025in;font-size:.085in}
  .oln-gwb i{color:var(--ink2)}
  .oln-gwa{display:inline-flex;align-items:center;gap:.03in;font-weight:bold}
  .oln-gwa svg,.oln-gwa .ic{width:.11in;height:.11in}
  /* ---- v3.0-A player-board additions (v3.2d: covers only — the strip/shelf generators are retired) ---- */
  .pb2-goods.nomargin{margin-left:.12in}
  .pb2-row{display:flex;gap:.1in;flex:0 0 auto}

  .pb2-slot .cvt{position:absolute;bottom:.06in;left:.05in;right:.05in;font-size:.078in;font-variant:small-caps;font-weight:bold;color:var(--pc);opacity:.8;display:flex;align-items:center;justify-content:center;gap:.02in;line-height:1.1}
  .pb2-slot .cvt svg,.pb2-slot .cvt .ic{width:.1in;height:.1in;flex:0 0 auto}

  .pb2-flipsh .fsh{grid-column:1/3;font-variant:small-caps;font-weight:bold;font-size:.1in;color:var(--pc);display:flex;align-items:center;gap:.03in}

  .pb2-floor svg,.pb2-floor .ic{width:.15in;height:.15in;flex:0 0 auto}
  /* ====================== THE GUILD TASTINGS BOARD (v4.17b · recut 2026-08-18) ====================== */
  /* "Rules go in the rules page" — the board prints DATA + SLOTS only: the kontor-grade art
     header with the shared numbers in kp-cell chips, component-true parkings, the floor field
     on a plank, and the deck/⚜-card wells. No sentences; the judging lives in the rulebook. */
  .tastb{width:100%;height:100%;box-sizing:border-box;background:var(--parch);border:3px solid #5b3a8e;border-radius:.14in;padding:.12in .16in;display:flex;flex-direction:column;gap:.08in;color:var(--ink)}

  {nm:'Bruges',  kc:'#274b5c', tint:'#e9eff3', req:1, maj:[4,2,0], role:'The Hub — the on-ramp',        ben:{n:'+1',ic:'scroll-text'}, bnote:'a recipe — pay its fee (H = Q−3)'},
  {nm:'London',  kc:'#b8860b', tint:'#f7efda', req:2, maj:[5,3,1], role:'The Steelyard — the engine',   ben:{n:'+1',ic:'building-2'},  bnote:'a building, placed — your die on it'},
  {nm:'Bergen',  kc:'#4a6b3a', tint:'#ecf1e8', req:2, maj:[9,5,2], role:'Bryggen — the crews',          ben:{n:'+1',ic:'wrench'},      bnote:'a specialist, free'},

];

const PG={w:11,h:8.5,y0:0.75,yMax:7.92};   // FULL letter paper (landscape); content keeps the old .3in inset — physical positions unchanged

const WHARF_GEO ={w:22,h:10.15,y0:0.45,yMax:9.9};  // the Wharf cross (8.84 native, printed NATIVE since 2026-08-18) + the Destinations board on its right
const TOK_GEO   ={w:22,h:6.0,  y0:0.45,yMax:5.75};   // the TOKENS sheet — goods + discs/cubes/markers, single-sided cut circles

const SUPPLY_NW=17.45, SUPPLY_NH=10.8;   // Market & Stores native size — the displays column + the CASKS & RECIPES column (2026-08-18: the six beer piles + the four export recipe stacks moved ONTO the board; two 2.4in piles abreast set the right column at 4.92in)
const DEST_NW=7.6,   DEST_NH=11.7;      // the Destinations & Hall board — narrow, the SAME height (the pair sits flush on the table)
const SUPPLY_MAIN_W=9.7;                 // the left (displays) column's width; the destinations column takes the rest
const SCORE_CELLS=50;     // one lap = 0–49 (the start corner reads 0/50); a lap marker flips to 50–99 (winner ceilings ~90 in strong play)

const REGS=[[0.15,0.15],[10.25,0.15],[0.15,7.75],[10.25,7.75]];  // registration-mark centres (letter; large sheets compute from geo)

const SIZE={tile:[1.25,1.25],caskc:[2.4,1],cask:[2.4,1],shipk:[2.5,3],shipc:[2.5,3],shiph:[2.5,3],bld:[2.5,1.32],ld:[2,0.9],imp:[2,2],tok:[0.95,0.95],disc:[0.65,0.65],wtok:[1,1],card:[1.85,2.55]};   // v4.9b UI pass: EVERY hull cuts the SAME 2.5×3 tile (berth count unchanged; the hold below the berths is art)   // v3.4a/b refit: cask TILES 2.4×1 · buildings 2.5×1.32 · ALL-BERTH carrier ships

// ---- PLAYER AID — a LETTER TRI-FOLD (redesigned 2026-08-18, designer-ruled): one 8.5×11
// sheet per player, laid out in three tall panels like a tri-fold brochure; TWO straight

const AID_CHIP=(ic,nm,sub)=>'<span class="dch">'+LU(ic)+'<b>'+nm+'</b>'+(sub?'<span class="ds">'+sub+'</span>':'')+'</span>';

  +'<div class="ahd"><span class="abi">'+LU(ic)+'</span>'
  +'<div class="at">'+title+'</div><div class="as">Brewhouses of the Hanse</div></div>'

      +AID_CHIP('map-pin','Park','pips = \u2605')
    +'</div>'

    +'<h5>'+LU('sail')+'Load &amp; Sail</h5>'

    +'<div class="ln">'+LU('flask-conical')+' <b>Brewhouse</b>: brew the top pile tile</div>'
    +'<div class="ln">'+LU('ship')+' <b>Harbor</b>: place a Ship \u2014 fee 2/1/0'+G+' by size (Hulk free) \u2014 + 1 free load, no \u2605</div>'
    +'<h5>'+LU('landmark')+'The Kontore</h5>'
    +'<table class="kt"><tr><th>Kontor</th><th>Min</th><th>Prize</th><th>Maj.</th></tr>'
    +AID_K('kontor-bruges','Bruges','1+','a recipe, at its fee','4/2/0')
    +AID_K('kontor-london','London','2+','a building \u2014 your die on it','5/3/1')
    +AID_K('kontor-bergen','Bergen','2+','a Specialist, free','9/5/2')

    +'<div class="dontf"><b>Don\u2019t forget:</b> \u2460 the minimum reads the die AS IT BOARDS (after lifts) \u2461 Specialist &amp; Order displays refill at turn END (Ships &amp; buildings: at once)</div>'

  const back=aid3('back','book-open','End, Score &amp; Icons',
     '<h5>'+LU('timer')+'End &amp; Score</h5>'
    +'<div class="ln"><b>First EMPTY tray</b> (your last of 13 dice committed): finish the round. Round 25 backstop.</div>'
    +'<div class="ln">\u00b7 Delivered dice: the parked pips \u00b7 Majorities by parked dice</div>'

    +'<div class="leg leg2">'
    +'<h5>'+LU('coins')+'Goods</h5>'
    +AID_ROW('wheat','Grain','a good: currency + brewing','gi')

    +AID_ROW('coins','Goods','any mix of grain + hops')

    +AID_ROW('dices','Start value','printed on the cask tile')
    +AID_ROW('hourglass','Age','+1 a step')
    +AID_ROW('check','READY','the die reaches its quality')
    +AID_ROW('die-plus1','Lift','past quality, cap 6')

// printables2: the WHARF is now a CROSS board on its own (the cut follows the plus). 4×4 grid:
// empty corners · 8 perimeter slots · the 4 stations in the centre 2×2.
// a rounded-corner PLUS outline (objectBoundingBox 0–1) — used both as the cross board's clip-path and,
// chamfered, as its print cut. r = corner radius as a fraction of the board.
// scale/ox/oy let the SAME plus be emitted in objectBoundingBox fractions (defaults — for the clip-path)
// OR in absolute inch coords (for the cut overlay), so the CUT exactly matches the ART edge (the clip).
// r may be a number (same radius everywhere) OR {conv,conc} (different convex/concave radii — needed when
// the path is a uniform OUTWARD OFFSET of another plus, e.g. the art bleed clip vs the cut).
function roundedPlusPath(a,b,r,scale,ox,oy){
  scale=scale||1; ox=ox||0; oy=oy||0;
  const rc=(r&&typeof r==='object')?r:{conv:r,conc:r};
  const P=[[a,0],[b,0],[b,a],[1,a],[1,b],[b,b],[b,1],[a,1],[a,b],[0,b],[0,a],[a,a]];
  const sweep=[1,1,0,1,1,0,1,1,0,1,1,0];   // outer (convex) corners sweep 1, inner (concave) 0
  const n=P.length, V=i=>P[((i%n)+n)%n], f=x=>+x.toFixed(4);
  const nrm=p=>{const L=Math.hypot(p[0],p[1])||1;return[p[0]/L,p[1]/L];};
  const X=v=>f(ox+v*scale), Y=v=>f(oy+v*scale);
  let d='',ch=[];
  for(let i=0;i<n;i++){
    const ri=sweep[i]===1?rc.conv:rc.conc;
    const cur=V(i),pv=V(i-1),nx=V(i+1);
    const inD=nrm([cur[0]-pv[0],cur[1]-pv[1]]), outD=nrm([nx[0]-cur[0],nx[1]-cur[1]]);
    const en=[cur[0]-ri*inD[0],cur[1]-ri*inD[1]], ex=[cur[0]+ri*outD[0],cur[1]+ri*outD[1]];
    const R=f(ri*scale);
    d+=(i===0?'M ':'L ')+X(en[0])+' '+Y(en[1])+' A '+R+' '+R+' 0 0 '+sweep[i]+' '+X(ex[0])+' '+Y(ex[1])+' ';
    ch.push([X(en[0]),Y(en[1])],[X(ex[0]),Y(ex[1])]);
  }
  return {d:d+'Z',ch};
}
// v3.4c.8 [ruled] — the arms reach only the BUILDING BAND: perimeter tracks are 1.32in deep (the building
// tile's depth), station tracks 2.5in, .3in gaps; the cut runs CROSS_PAD outside the slot band and hugs the
// station block by CROSS_P on the arm sides. Grid = 1.32+.3+2.5+.3+2.5+.3+1.32 = 8.54 → board 8.84in native.
const CROSS_PAD=0.15, CROSS_GAP=0.3, CROSS_P=0.1, BAND_D=1.32, STN_T=2.5;
const WHARF_W=+(2*(CROSS_PAD+BAND_D+CROSS_GAP)+2*STN_T+CROSS_GAP).toFixed(2);   // 8.84
const CROSS_A=+((CROSS_PAD+BAND_D+CROSS_GAP-CROSS_P)/WHARF_W).toFixed(4), CROSS_B=+(1-(CROSS_PAD+BAND_D+CROSS_GAP-CROSS_P)/WHARF_W).toFixed(4);
const CROSS_R=+(0.12/WHARF_W).toFixed(4);   // ≈.12in cut corner (matches the live board's die-cut radius)
const CROSS_BLEED=0.125;     // ⚙ art bleed past the cut line (1/8″) for laser-cut tolerance — the cut is unchanged; only the art extends
// the ART clip = the cut plus DILATED outward by CROSS_BLEED, over a bleed-enlarged element (W + 2·bleed).
// A true outward offset: arms longer & wider by the bleed, convex corner radius +bleed, concave −bleed.
const CROSS_ART=(function(){const Wd=WHARF_W+2*CROSS_BLEED, halfArm=(CROSS_B-CROSS_A)/2*WHARF_W+CROSS_BLEED;
  return {a:(Wd/2-halfArm)/Wd, b:(Wd/2+halfArm)/Wd,
    r:{conv:(CROSS_R*WHARF_W+CROSS_BLEED)/Wd, conc:Math.max(.0005,(CROSS_R*WHARF_W-CROSS_BLEED)/Wd)}};})();
function wharfCross(){

  const clip='<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><clipPath id="crossclip" clipPathUnits="objectBoundingBox"><path d="'+roundedPlusPath(CROSS_ART.a,CROSS_ART.b,CROSS_ART.r).d+'"/></clipPath></defs></svg>';
  const wharf='<div class="wharf">'
    +'<div></div>'+slot+slot+'<div></div>'

}
// printables2: the SCORE RING — one clockwise lap of 50 cells with a FIXED, elegant walk: 15 spaces along
// the top and bottom, 10 down each side, so every CORNER lands on a multiple of 5 — 0/50 (top-left, the
// start), 15 (top-right), 25 (bottom-right), 40 (bottom-left) — and every 5th cell carries the alternate
// band (count by fives). Passing 49 flips the disc's lap marker (+50 — the second lap).
function scoreRingCells(NW,NH,T){
  const uw=NW-2*T, uh=NH-2*T;
  const nTop=14, nSide=9;                       // runs between the corner squares: 14+corner=15 · 9+corner=10
  const wT=uw/nTop, hS=uh/nSide;
  const cells=[];let i=0;
  const C=(x,y)=>cells.push({i:i++,x,y,w:T,h:T,corner:true});
  C(0,0);                                                                                   // 0 / 50 · START
  for(let c=0;c<nTop;c++)cells.push({i:i++,x:T+c*wT,y:0,w:wT,h:T});                         // top: 1–14
  C(NW-T,0);                                                                                // 15 · top-right
  for(let c=0;c<nSide;c++)cells.push({i:i++,x:NW-T,y:T+c*hS,w:T,h:hS});                     // right: 16–24
  C(NW-T,NH-T);                                                                             // 25 · bottom-right
  for(let c=0;c<nTop;c++)cells.push({i:i++,x:NW-T-wT*(c+1),y:NH-T,w:wT,h:T});               // bottom: 26–39
  C(0,NH-T);                                                                                // 40 · bottom-left
  for(let c=0;c<nSide;c++)cells.push({i:i++,x:0,y:NH-T-hS*(c+1),w:T,h:hS});                 // left: 41–49
  return cells;
}
function scoreRingHtml(NW,NH,T){
  const cells=scoreRingCells(NW,NH,T);
  const box=c=>{const cls=(c.i===0?' start':(c.i%5===0?' five':''));
    return '<div class="ringcell'+cls+'" style="left:'+c.x.toFixed(3)+'in;top:'+c.y.toFixed(3)+'in;width:'+c.w.toFixed(3)+'in;height:'+c.h.toFixed(3)+'in">'
      +(c.i===0?LU('flag')+'<span class="lap">0 / 50</span>':c.i)+'</div>';};
  return '<div class="score-ring">'+cells.map(box).join('')+'</div>';
}
